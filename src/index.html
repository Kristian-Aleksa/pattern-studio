<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern Studio</title>
<meta name="description" content="Offline generative pattern tools. Everything runs in your browser — nothing is uploaded.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23e4ff3d'/%3E%3C/svg%3E">
<style>
/*@inline ui/styles.css*/
</style>
</head>
<body>
<div class="app">
  <!-- Left: the style menu and the style's own settings. Middle: the artboard. Right: output, export, shortcuts and the library. -->
  <aside class="sidebar" aria-label="Pattern settings">
    <div class="side-top">
      <a class="brand" id="brand" href="#/" title="Home: all pattern styles">
        <div>Pattern Studio<small>GENERATIVE TOOLS</small></div>
      </a>
      <nav class="side-nav" aria-label="Main">
        <a class="nav-item" id="homeNav" href="#/" title="Home: all pattern styles (H)">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.2 6.6v6.9h9.6V6.6"/><path d="M1.8 7.8 8 2.6l6.2 5.2"/><path d="M6.6 13.5V10h2.8v3.5"/></svg>
          <span class="text">Home</span>
        </a>
        <!-- Dark / light: filled in by app.js (the same switch as the one by the home search) -->
        <button class="nav-item" id="themeNav" type="button"></button>
      </nav>
      <!-- the style switcher: previous, every style, next (filled in by app.js) -->
      <div class="style-pick" id="stylePick"></div>
    </div>
    <div class="panel inputs" id="panel"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="title"><h1 id="toolName">Pattern Studio</h1><p id="toolAbout"></p></div>
      <div class="actions" id="actions"></div>
    </header>
    <div class="stage" id="stage">
      <div class="frame" id="frame"><canvas id="view" aria-label="Artwork preview"></canvas><div class="busy-dot"></div></div>
      <div class="gens" id="gens" role="group" aria-label="Generations: ← and → step through them"></div>
    </div>
    <div class="statusbar"><span id="status"></span></div>
    <section class="home" id="home" aria-label="All pattern styles"></section>
    <section class="kept" aria-label="Kept variations">
      <div class="kept-label">Kept<b id="keptCount">0</b></div>
      <div class="kept-strip" id="kept"></div>
    </section>
  </main>

  <aside class="outputs" aria-label="Output, export and shortcuts">
    <div class="panel" id="panelOut"></div>
    <div class="side-foot">
      <div class="offline" title="Runs 100% offline. Nothing is uploaded or fetched."><i></i><span class="text">Offline · nothing uploaded</span></div>
      <button class="btn ghost" id="helpBtn" title="Keyboard shortcuts (?)">?<span class="text">&nbsp;Shortcuts</span></button>
    </div>
  </aside>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-wrap" id="modal"><div class="modal" id="modalBox" role="dialog" aria-modal="true"></div></div>

<!-- Your palettes, kept variations and last settings live here when you use "Save app copy". -->
<script id="pl-user-data" type="application/json">{}</script>
<script>
/*@inline core/pl.js*/
/*@inline core/rng.js*/
/*@inline core/noise.js*/
/*@inline core/color.js*/
/*@inline core/scene.js*/
/*@inline core/glyphs.js*/

/*@inline core/tools.js*/
/*@inline tools/sonar.js*/
/*@inline tools/culture.js*/
/*@inline tools/cipher.js*/
/*@inline tools/dahlia.js*/
/*@inline tools/coral.js*/
/*@inline tools/whorl.js*/
/*@inline tools/splice.js*/
/*@inline tools/filament.js*/
/*@inline tools/stipple.js*/
/*@inline tools/rise.js*/
/*@inline tools/prism.js*/
/*@inline tools/motley.js*/
/*@inline tools/warp.js*/
/*@inline tools/stitch.js*/
/*@inline tools/quilt.js*/
/*@inline tools/modular.js*/
/*@inline tools/husk.js*/
/*@inline tools/mist.js*/
/*@inline tools/atlas.js*/
/*@inline tools/strand.js*/
/*@inline tools/sear.js*/
/*@inline tools/crowd.js*/
/*@inline tools/aura.js*/
/*@inline ui/app.js*/
</script>
</body>
</html>
