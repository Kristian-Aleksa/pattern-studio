        const i0 = i > 0 ? i - 1 : i, i1 = i < cols - 1 ? i + 1 : i;
        const gx = (B[j * cols + i1] - B[j * cols + i0]) / ((i1 - i0) * dx || 1);
        const gy = (B[j1 * cols + i] - B[j0 * cols + i]) / ((j1 - j0) * dy || 1);
        G[j * cols + i] = Math.hypot(gx, gy);
      }
    }
    const out = { V, G, g, sp, n };
    trim(frameCache, n, 72);
    frameCache.set(key, out);
    return out;
  }

  /* ---- dots: per cell, which (if any), its band and size ------------------------------ */
  function dots(W, H, seed, p, nInks, t, amt, R) {
    const { V, G, sp } = field(W, H, seed, p, t, amt, R);
    const g = grid(W, H, p); // pixel sizes come from this frame (the cached field is in width units)
    const { cols, rows, cw } = g, nc = sp.c1 - sp.c0;
    const m = Math.max(1, nInks);
    const T = Array.from({ length: m - 1 }, (_, k) => K.bandC + ((k + 1) / m - 0.5) * K.bandS);
    const mc = Math.max(3, m), TC = Array.from({ length: mc - 1 }, (_, k) => K.bandC + ((k + 1) / mc - 0.5) * K.bandS);
    const cut = p.cutout / 100, sv = p.sizevar / 100, rMax = (p.dotsize / 100) * cw * 0.5;
    const lat = p.mode === 'lattice';
    const loose = K.lp * (p.loose / 100), edge = p.edge / 100;
    const sym = p.symmetry;
    const out = [];
    for (let j = sp.r0; j < sp.r1; j++) {
      const jj = sym === 'quad' ? Math.min(j, rows - 1 - j) : j;
      for (let i = sp.c0; i < sp.c1; i++) {
        const k = (j - sp.r0) * nc + (i - sp.c0), v = V[k];
        const ii = sym === 'mirror' || sym === 'quad' ? Math.min(i, cols - 1 - i) : i;
        let u;
        if (lat) {
          if (v < cut) continue;
          u = v;
        } else {
          // closeness to the nearest band edge, from the distance to it (v gap / gradient)
          let gap = 1;
          for (let q = 0; q < TC.length; q++) { const d = Math.abs(v - TC[q]); if (d < gap) gap = d; }
          const d = (gap * cols) / Math.max(G[k], 1e-4); // in cells
          const near = Math.exp(-Math.pow(d / K.dw, K.q));
          const steep = 1 - Math.exp(-Math.pow(G[k] / K.gs, K.gk));
          if (hash(seed, ii, jj, 0x57d1) >= loose + edge * (K.b0 + K.bg * steep + K.be * near)) continue;
          u = K.u0 + K.du * (K.uw * steep + (1 - K.uw) * near);
          if (u < cut) continue;
        }
        const tt = cut < 1 ? Math.min(1, Math.max(0, (u - cut) / (1 - cut))) : 1;
        let band = 0;
        while (band < T.length && v >= T[band]) band++;
        out.push({ i, j, ii, jj, band, r: rMax * (1 - sv * (1 - tt)) });
      }
    }
    return { list: out, g };
  }

  /* ---- build ------------------------------------------------------------------------ */
  function build({ W, H, seed, p, colors, t = 0, anim, crisp, region }) {
    // Tiny previews (like the kept thumbnails) use a coarser grid so their dots stay visible.
    const L0 = Math.max(W, H);
    if (crisp === false && L0 < 200 && p.res > L0 / 4) p = Object.assign({}, p, { res: Math.max(8, Math.round(L0 / 4)) });
    const n = colors.length;
    const m = nDots(n);
    const scene = new PL.Scene(W, H, colors[0], 0);
    const layers = [];
    for (let k = 0; k < m; k++) layers.push(scene.layer('dots-' + (k + 1), colors[1 + k], m === 1 ? 'Dots' : 'Dots ' + (k + 1), 1 + k));
    const accent = n >= 3 ? scene.layer('accent', colors[n - 1], 'Accent', n - 1) : null;
    const amt = anim ? anim.amount : 0;
    const { list, g } = dots(W, H, seed, p, m, t, amt, region);
    const { cw, ch, hex } = g;
    const rate = p.accent / 100, jit = p.jitter / 100;
    const shape = p.shape;
    for (const d of list) {
      const L = accent && hash(seed, d.ii, d.jj, 0xacce) < rate ? accent : layers[Math.min(m - 1, d.band)];
      let x = (d.i + 0.5 + (hex && d.j % 2 ? 0.5 : 0)) * cw, y = (d.j + 0.5) * ch;
      if (jit > 0) {
        x += (hash(seed, d.ii, d.jj, 0x71e1) - 0.5) * jit * cw;
        y += (hash(seed, d.ii, d.jj, 0x71e2) - 0.5) * jit * cw;
      }
      if (shape === 'square') PL.Scene.rect(L, x - d.r, y - d.r, 2 * d.r, 2 * d.r);
      else if (shape === 'diamond') { const q = d.r * 1.2533; PL.Scene.quad(L, x, y - q, x + q, y, x, y + q, x - q, y); } // same area as the circle
      else PL.Scene.circle(L, x, y, d.r);
    }
    scene.status = `${list.length.toLocaleString()} dots`;
    return scene;
  }

  PL.tools.register({
    id: 'stipple',
    name: 'Stipple',
    kind: 'Backgrounds',
    tagline: 'Halftone dots',
    about: 'Dot fields read from a noise field: halftone lattices and contour scatters that gather along the color-band edges, with a few accent dots. The edges drift in the animation, so dots blink on and off along them.',
    inks: {
      min: 3, max: 8, roles, fit, spec, add, generate,
      span: () => 2, // Invert swaps the ground and the first dot ink
      hint: 'Ground first, then the dot inks from the lowest band to the highest, then the accent.',
    },
    palettes: PALETTES,
    params: PARAMS,
    animLabel: 'Intensity',
    animHint: 'How far the field drifts over the loop: dots blink on and off as the band edges shift',
    defaults: {
      anim: { amount: 0.3, fps: 14, frames: 30 },
      fx: {},
      palette: 'Ember', // the preset the style opens on (its card's colors)
    },
    build,
    zoom: true, // draws any region of its world (General's Rotation and Size)
    _K: K,
    _clear: () => { stillCache.clear(); frameCache.clear(); rangeCache.clear(); cachedCells = 0; },
    _dots: dots,
    _field: field,
  });
})();
/* ==========================================================================
   tools/rise.js — Rise: stripe arcs.

      stripe + gap. One stripe is centred on the frame's middle, so the
      pattern is symmetric. Stripes counts across the frame's short side.
   2. Bands: nested circles around the anchor (an edge's midpoint or the
      centre; Auto picks an edge for each variation). Ring k (0 = innermost)
      has radius Depth x (k + 0.8) of the frame's short side. Inside each ring
      the stripes run on, but in another pair of colors, so ground and stripe
      trade places from ring to ring. The pairs follow a fixed order from the
      middle out: each ring takes the next ink as its ground and stripes in a
      color one further round the palette, until every pairing has been used.
      With the default three colors (cream, yellow, purple) that gives
      yellow/purple, purple/cream, yellow/cream, purple/yellow, then again.
   3. Every edge is exact: true arcs, and stripe sides on whole pixels, so
      neighbouring colors meet cleanly with no hairline seams.
   4. Animation: each ring's radius swings in and out once per loop
      (Intensity x 0.3 x Depth), each ring 0.35 of a loop behind the one inside
      it, so a smooth wave keeps rising out from the anchor. Seamless.
   ========================================================================== */
(() => {
  const { hash } = PL.rng;

  // Base (the ground outside the arcs), then the inks. The default look's colors first.
  const PALETTES = [
    { name: 'Sunrise', colors: ['#EAE5C6', '#F9D536', '#2C115B'] },
    { name: 'Poppy', colors: ['#F3EDE2', '#F25C3B', '#1E2A5A'] },
    { name: 'Lagoon', colors: ['#E6F2EE', '#3CC6A8', '#0E3B43'] },
    { name: 'Blush', colors: ['#F7E9E4', '#F2A7B5', '#5B1E3F'] },
    { name: 'Night', colors: ['#16132A', '#F7C948', '#ECE6D6'] },
    { name: 'Split', colors: ['#FAEDD5', '#0092C5', '#4C338B'] }, // split complement of the base 82: inks at 232 and 292
    { name: 'Lavender', colors: ['#F0ECFA', '#AE96DA', '#84AB7B', '#481E52'] },
    { name: 'Harbor', colors: ['#EEF3F7', '#7CC6FE', '#2B59C3', '#0B1D51'] },
    { name: 'Ember', colors: ['#F6EFE6', '#FFB703', '#FB8500', '#D62828', '#2B2D42'] },
    { name: 'Mono', colors: ['#F2F2EE', '#BDBDB8', '#1C1C1C'] },
    { name: 'Duo', colors: ['#F1EBDD', '#E4572E'] },
  ];

  const roles = (n) => ['Base', ...Array.from({ length: n - 1 }, (_, i) => (n === 2 ? 'Ink' : 'Ink ' + (i + 1)))];

  const isLight = (hex) => PL.color.luminance(hex) > 0.35;

  // "New colors": a pale (now and then a deep) base, a bright first ink and a deep second
  // one in a contrasting hue (on a deep base: a bright ink and a pale one), then mid inks.
  function generate(n, rng) {
    const C = PL.color;
    const dark = rng.chance(0.22);
    const h1 = rng.float(0, 360), h2 = h1 + rng.float(120, 220);
    const out = [dark
      ? C.lch(rng.float(0.17, 0.23), rng.float(0.03, 0.07), h2 + rng.float(-30, 30))
      : C.lch(rng.float(0.92, 0.96), rng.float(0.02, 0.045), h1 + rng.float(-25, 25))];
    out.push(C.lch(rng.float(0.8, 0.88), rng.float(0.15, 0.2), h1));
    if (n > 2) out.push(dark ? C.lch(rng.float(0.9, 0.95), rng.float(0.02, 0.05), h1 + rng.float(-20, 20)) : C.lch(rng.float(0.24, 0.34), rng.float(0.12, 0.17), h2));
    for (let i = 3; i < n; i++) out.push(C.lch(rng.float(0.55, 0.72), rng.float(0.13, 0.19), h1 + 70 + (i - 3) * 95 + rng.float(-15, 15)));

  }

  // + adds an ink in a hue the palette doesn't have yet, at a middle lightness.
  function add(colors) {
    const C = PL.color;
    const c = colors.slice();
    const hues = c.slice(1).map((x) => C.hexToLch(x)[2]);
    let best = 0, bd = -1;
    for (let h = 0; h < 360; h += 10) {
      const d = hues.length ? Math.min(...hues.map((x) => Math.abs((((h - x) % 360) + 540) % 360 - 180))) : 180;
      if (d > bd) { bd = d; best = h; }

    c.push(C.lch(isLight(c[0]) ? 0.62 : 0.72, 0.16, best));

  }

    let c = (colors || []).map(PL.color.normHex).filter(Boolean);
    if (!c.length) c = PALETTES[0].colors.slice();
    if (c.length === 1) c.push(PL.color.mix(c[0], isLight(c[0]) ? '#000000' : '#FFFFFF', 0.75));

  // (ground, stripes) for ring k, counting from the innermost. Outside the rings: (base, ink 1).
  function bandPair(k, B, n) {

    const m = n - 1;

  const ANCHORS = { bottom: [0.5, 1], top: [0.5, 0], left: [0, 0.5], right: [1, 0.5], centre: [0.5, 0.5] };
  // Auto: an edge for each variation, the bottom most often.
  function anchorOf(seed, a) {
    if (ANCHORS[a]) return a;
    const u = hash(seed, 0x415e, 7, 3);
    return u < 0.4 ? 'bottom' : u < 0.6 ? 'right' : u < 0.8 ? 'top' : 'left';
  }

  const S = (section, key, label, min, max, def, extra = {}) => ({ section, key, label, type: 'range', min, max, def, step: 1, ...extra });
  const PARAMS = [
    { section: 'Artwork', key: 'anchor', label: 'Anchor', type: 'select', def: 'auto', rand: false,
      options: [{ value: 'auto', label: 'Auto' }, { value: 'bottom', label: 'Bottom' }, { value: 'top', label: 'Top' },
        { value: 'left', label: 'Left' }, { value: 'right', label: 'Right' }, { value: 'centre', label: 'Centre' }] },
    S('Artwork', 'stripes', 'Stripes', 6, 28, 16, { randChoices: [10, 12, 14, 16, 18, 20, 22], hint: 'Stripes across the frame (across the short side of a wide or tall frame)' }),
    S('Artwork', 'weight', 'Weight', 30, 70, 42, { unit: '%', randChoices: [42, 50, 58], hint: 'How wide each stripe is, as a share of stripe + gap' }),
    S('Artwork', 'bands', 'Bands', 1, 8, 3, { randChoices: [3, 4, 5], hint: 'How many arcs' }),
    S('Artwork', 'depth', 'Depth', 10, 40, 18, { unit: '%', rand: [18, 32], hint: 'Spacing of the arcs, as a share of the frame' }),
  ];

  const K = {
    r0: 0.8,        // ring k sits at Depth x (k + r0)
    lag: 0.35,      // each ring swings this much of a loop behind the one inside it
    ampK: 0.3,      // swing: Intensity x this x Depth
    ampMax: 0.53,   // ... at most this x Depth, so neighbouring rings never cross
  };

  /* ---- build ------------------------------------------------------------------------ */
  // region (General's Rotation and Size): the part of the world to cover; the stripes run on past the
  // frame and the arcs are whole circles round the anchor, so zooming out shows more of the same picture.
  function build({ W, H, seed, p, colors, t = 0, anim, region }) {
    const R = region || { x0: 0, y0: 0, x1: W, y1: H };
    const n = colors.length;
    const scene = new PL.Scene(W, H, colors[0], 0);
    const Sd = Math.min(W, H);
    const N = Math.max(1, Math.round(p.stripes)), B = Math.max(1, Math.round(p.bands));
    const anchor = anchorOf(seed, p.anchor);
    const cx = ANCHORS[anchor][0] * W, cy = ANCHORS[anchor][1] * H;

    // Stripe and gap intervals across the region, sides on whole pixels (crisp, seamless).
    const pitch = Sd / N, half = (Math.min(70, Math.max(30, p.weight)) / 100) * pitch * 0.5;
    const xc0 = W / 2 - (N / 2) * pitch; // a stripe centre: x = 0 on a square frame
    const j0 = Math.floor((R.x0 - half - xc0) / pitch) - 1, j1 = Math.ceil((R.x1 + half - xc0) / pitch) + 1;
    const stripes = [], gaps = [];
    const zs = region && region.z > 1 ? region.z : 1; // output pixels to a frame pixel: the sides land on whole output pixels
    let x = R.x0;
    for (let j = j0; j <= j1; j++) {
      const c = xc0 + j * pitch;
      const a = Math.max(R.x0, Math.round((c - half) * zs) / zs), b = Math.min(R.x1, Math.round((c + half) * zs) / zs);
      if (b <= a) continue;
      if (a > x) gaps.push([x, a]);
      stripes.push([a, b]);
      x = Math.max(x, b);
    }
    if (x < R.x1) gaps.push([x, R.x1]);

    // Ring radii: Depth x (k + 0.8), each swinging in and out once a loop, in a wave outwards.
    const d = Math.min(40, Math.max(10, p.depth)) / 100;
    const amp = Math.min(K.ampK * Math.max(0, anim ? anim.amount : 0), K.ampMax);
    const tt = ((t % 1) + 1) % 1;
    const radius = (k) => Sd * d * (k + K.r0 + amp * Math.sin(2 * Math.PI * (tt - K.lag * k)));

    const outside = scene.layer('stripes', colors[1], 'Stripes', 1);
    for (const [a, b] of stripes) PL.Scene.rect(outside, a, R.y0, b - a, R.y1 - R.y0);
    for (let k = B - 1; k >= 0; k--) {
      const [g, s] = bandPair(k, B, n);
      const r = radius(k);
      const LG = scene.layer('band-' + (k + 1), colors[g], 'Band ' + (k + 1), g);
      const LS = scene.layer('band-' + (k + 1) + '-stripes', colors[s], 'Band ' + (k + 1) + ' stripes', s);
      for (const [a, b] of gaps) PL.Scene.slice(LG, a, b, cx, cy, r);
      for (const [a, b] of stripes) PL.Scene.slice(LS, a, b, cx, cy, r);
    }
    scene.status = `${B} band${B > 1 ? 's' : ''} · ${N} stripes · ${anchor}`;
    return scene;
  }

  PL.tools.register({
    id: 'rise',
    name: 'Rise',
    kind: 'Backgrounds',
    tagline: 'Stripe arcs',
    about: 'Vertical stripes with nested arcs rising from an edge or the centre; inside each arc the stripe and ground colors trade places. In the animation the arcs swell and settle in a smooth wave that rises out from the anchor.',
    inks: {
      min: 2, max: 6, roles, fit, spec, add, generate,
      span: (n) => n, // Invert reverses the whole palette (a deep base, a pale last ink)
      hint: 'Base first (the ground outside the arcs), then the inks. The arcs trade these colors around in a fixed order.',
    },
    palettes: PALETTES,
    params: PARAMS,
    animLabel: 'Intensity',
    animHint: 'How far the arcs swell and settle as the wave rises through them (0: still)',
    defaults: {
      anim: { amount: 0.8, fps: 12, frames: 72 },
      fx: {},
    },
    build,
    zoom: true, // draws any region of its world (General's Rotation and Size)
    _K: K,
    _anchorOf: anchorOf,
    _bandPair: bandPair,
  });
})();
/* ==========================================================================
   tools/prism.js — Prism: pixel aurora.

   1. Grid: Pixels square cells across the frame's width (rows follow the
      frame's shape). Everything is drawn in whole cells, with a fine grid of
      dots at the cell centres on top (Dot grid).
   2. Streams: broad arms fan out from a source (usually near an edge, now
      and then further in), one arm per stream, each running Reach of the way
      across the frame, bending and meandering, a little narrower at its tip,
      with wavy edges. Where a stream runs the cells glow: a white core, then
      the fringe (warm inks next to the core, then hot pinks, blues and deep
      indigo), then the black ground. Where arms run close their glows add up,
      so the gap between them fills with fringe.
   3. Fringe sets how far the glow spreads: the core and every fringe band
      widen with it, so a high Fringe floods the frame and a low one keeps the
      streams thin and crisp. Sizes go by the frame's short side.
   4. Every cell carries its own fixed random offset, so the bands break up
      into scattered pixels, and its own tint (a touch darker); now and then a
      cell out in the ground lights up too. Within a band the inks gather in
      patches that follow a slow noise, with a few strays.
   5. Animation: each cell's glow swings up and down once per loop, every
      cell at its own timing, so pixels shimmer across the band edges (never
      more than two bands either way). The loop starts calm, close to the still
      image, and stirs up mid-way. The streams hold still. Seamless; Intensity
      sets the swing.
   ========================================================================== */
(() => {
  const { hash } = PL.rng;

  // Ground, core, then the fringe inks from the core outwards. The default look's colors first.
  const SPECTRUM = ['#FFE800', '#FFC400', '#FF9E00', '#FF3B00', '#FF2D55', '#FF00A8', '#E600D8', '#00C8FF', '#2E7CFF', '#6A2BD9', '#0038FF', '#2B0FA8', '#3A1ED8', '#5A0FB0'];
  const PALETTES = [
    { name: 'Aurora', colors: ['#08080A', '#FFFFFF', ...SPECTRUM] },
    { name: 'Ember', colors: ['#0B0605', '#FFF6E8', '#FFD166', '#FFB703', '#FB8500', '#F94144', '#E5383B', '#C9184A', '#9D0208', '#6A040F', '#370617'] },
    { name: 'Glacier', colors: ['#050A12', '#F2FBFF', '#C8F7FF', '#7FE7FF', '#3FC1FF', '#2E7CFF', '#2F4CDF', '#3A2BC0', '#3B1E92', '#2A0F5E'] },
    { name: 'Toxic', colors: ['#070B05', '#F7FFE8', '#E9FF70', '#B6FF3B', '#6EF06A', '#2EE6A8', '#00C2D1', '#1478D4', '#2C3FB0', '#311D80'] },
    { name: 'Candy', colors: ['#0D0612', '#FFF4FB', '#FFE5A3', '#FFC2D1', '#FF8FC2', '#FF4DA6', '#D63AF9', '#9B5CFF', '#5B6CFF', '#2F3BB8'] },
    { name: 'Sunprint', colors: ['#F4EEE4', '#0D153F', '#2735A6', '#0077CC', '#09B7DC', '#74E2C6', '#EBE696'] }, // on paper: a deep 270 core, then out through 270, 250, 220 and 175 to a pale 105
    { name: 'Lagoon', colors: ['#03100F', '#F2FFF9', '#D7FFE9', '#9DF7D2', '#5FE6C1', '#26C6B4', '#1398A8', '#156E96', '#1D4A7E', '#1C2B5E'] },
    { name: 'Gold', colors: ['#0A0805', '#FFFDF2', '#FFF1B8', '#FFE07A', '#FFC94A', '#F2A93B', '#D98A2B', '#A86A26', '#6E4A21', '#3D2A16'] },
    { name: 'Mono', colors: ['#08080A', '#FFFFFF', '#D9D9D9', '#A6A6A6', '#737373', '#4D4D4D', '#2E2E2E'] },
    { name: 'Dusk', colors: ['#040411', '#FFF8EA', '#FACF9E', '#FB906A', '#DE5388', '#853397', '#361B73'] }, // a sunset: a cream core, then 70, 40, 0, 320 and 290 down into the night
  ];

  /* ---- color roles: ground, core, fringe inks (core outwards) ----------------------- */
  const roles = (n) => ['Ground', 'Core', ...Array.from({ length: n - 2 }, (_, i) => (n === 3 ? 'Fringe' : 'Fringe ' + (i + 1)))];
  const spec = (n) => ({ ramp: Math.max(1, n - 2), accents: 0 });
  const isLight = (hex) => PL.color.luminance(hex) > 0.35;

  // The fringe has four bands; the inks are shared out between them in order, the
  // middle bands taking the extra ones (14 inks: 3, 4, 4, 3).
  const BANDS = 4;
  function bandInks(m) {
    const g = Math.min(BANDS, m);
    const cut = (k) => (k * 2 < g ? Math.floor((k * m) / g) : k * 2 > g ? Math.ceil((k * m) / g) : Math.round((k * m) / g));
    const out = [];
    for (let k = 0; k < g; k++) out.push(Array.from({ length: cut(k + 1) - cut(k) }, (_, i) => cut(k) + i));
    // fewer inks than bands: the outer bands share the last inks
    while (out.length < BANDS) out.push(out[out.length - 1]);
    return out;
  }

  // The most vivid lightness for each hue (where the sRGB gamut reaches furthest out in
  // OKLCh), in 10-degree steps, worked out once.
  let CUSP = null;
  function cuspL(h) {
    if (!CUSP) {
      CUSP = [];
      for (let k = 0; k < 36; k++) {
        let bl = 0.6, bc = -1;
        for (let L = 0.3; L <= 0.985; L += 0.015) { const c = PL.color.hexToLch(PL.color.lch(L, 0.4, k * 10))[1]; if (c > bc) { bc = c; bl = L; } }
        CUSP.push(bl);
      }
    }
    const x = (((h % 360) + 360) % 360) / 10, i = Math.floor(x) % 36, f = x - Math.floor(x);
    return CUSP[i] * (1 - f) + CUSP[(i + 1) % 36] * f;
  }

  // "New colors": a near-black ground (now and then a pale one) and a near-white core, then a
  // fringe of vivid inks whose hues run round the wheel from a light hue (yellow, cyan, green)
  // towards the deep ones, each as rich as it can be, getting darker from the core outwards.
  function generate(n, rng) {
    const C = PL.color;
    const m = Math.max(1, n - 2);
    const pale = rng.chance(0.12);
    const paths = [[100, -1, 160, 230], [90, -1, 130, 190], [200, 1, 110, 160], [150, 1, 120, 170], [70, -1, 110, 170]];
    const [hs, dir, s0, s1] = rng.pick(paths);
    const h0 = hs + rng.float(-10, 10), sweep = rng.float(s0, s1), tint = rng.float(0, 360);
    const out = pale
      ? [C.lch(rng.float(0.93, 0.97), rng.float(0.005, 0.025), tint), C.lch(rng.float(0.13, 0.2), rng.float(0.01, 0.04), tint)]
      : [C.lch(rng.float(0.08, 0.14), rng.float(0, 0.025), tint), C.lch(rng.float(0.97, 1), rng.float(0, 0.02), tint)];
    for (let i = 0; i < m; i++) {
      const k = m === 1 ? 0.5 : i / (m - 1);
      const kk = pale ? 1 - k : k; // on a pale ground the fringe runs deep (by the core) to light (by the ground)
      const h = h0 + dir * sweep * kk;
      const L = Math.min(cuspL(h), 0.96 - 0.5 * kk ** 1.15) + rng.float(-0.02, 0.02);
      out.push(C.lch(L, 0.4, h));
    }
    return out;
  }

  // + adds a fringe ink (outermost) in a hue the fringe doesn't have yet, bright enough to read.
  function add(colors) {
    const C = PL.color;
    const c = colors.slice();
    const hues = c.slice(2).filter((x) => C.hexToLch(x)[1] > 0.04).map((x) => C.hexToLch(x)[2]);
    let best = 0, bd = -1;
    for (let h = 0; h < 360; h += 10) {
      const d = hues.length ? Math.min(...hues.map((x) => Math.abs((((h - x) % 360) + 540) % 360 - 180))) : 180;
      if (d > bd) { bd = d; best = h; }
    }
    c.push(C.lch(isLight(c[0]) ? 0.58 : 0.7, 0.19, best));
    return c;
  }

  function fit(colors, n) {
    let c = (colors || []).map(PL.color.normHex).filter(Boolean);
    if (!c.length) c = PALETTES[0].colors.slice();
    if (c.length === 1) c.push(PL.color.mix(c[0], isLight(c[0]) ? '#000000' : '#FFFFFF', 0.92));
    if (c.length === 2) c.push(PL.color.lch(0.7, 0.2, PL.color.hexToLch(c[1])[2] + 40));
    if (c.length === n) return c;
    if (c.length > n) {
      // keep the ground and the core; take the fringe inks evenly from the ones given
      const f = c.slice(2), m = n - 2;
      return [c[0], c[1], ...Array.from({ length: m }, (_, i) => f[Math.round((i * (f.length - 1)) / Math.max(1, m - 1))])];
    }
    while (c.length < n) c = add(c);
    return c;
  }

  const S = (section, key, label, min, max, def, extra = {}) => ({ section, key, label, type: 'range', min, max, def, step: 1, ...extra });
  const PARAMS = [
    S('Artwork', 'pixels', 'Pixels', 24, 72, 52, { step: 2, rand: [38, 70], hint: 'Cells across the frame' }),
    S('Artwork', 'streams', 'Streams', 1, 5, 2, { rand: [2, 4], hint: 'How many streams fan out from the source' }),
    S('Artwork', 'reach', 'Reach', 30, 85, 75, { unit: '%', rand: [45, 75], hint: 'How far the streams run across the frame' }),
    S('Artwork', 'fringe', 'Fringe', 50, 160, 81, { unit: '%', rand: [75, 125], hint: 'How far the glow spreads round each stream' }),
    S('Artwork', 'dotgrid', 'Dot grid', 0, 100, 55, { unit: '%', rand: false, hint: 'Brightness of the dots at the cell centres' }),
  ];

  // Constants. Lengths in units of the frame's short side.
  const K = {
    unit: 0.047,        // one fringe band is this wide at Fringe 100 %
    core: 2.4,          // a stream's core reaches this many band widths from its centre line (at its base)
    taper: 0.3,         // ... narrowing to (1 - taper) of that at the tip
    bands: [1, 1, 0.7, 0.35], // widths of the four fringe bands, core outwards (the ground fades like the last)
    scatter: 0.68,      // each cell's fixed offset (sd, in bands)
    scatterCorr: 0.35,  // ... part of it shared with neighbouring cells
    spark: 0.35, sparkL: 1.4, // stray lit cells out in the ground: chance by the glow's edge, and how far out they reach (band widths)
    swing: 1.05,        // animation: each cell swings this many bands either way at Intensity 1 ...
    still: 0.65,        // ... mostly about its place in the still frame, so the loop starts calm and stirs up mid-way
    tint: 0.06,         // cells are up to this much darker
    tints: 5,           // ... in this many steps
    hueF: 2.0,          // ink patches: noise cycles per short side
    inkJit: 0.28,       // ... and how much each cell strays from its patch
    blend: 1.2,         // where streams meet their glows add up (soft minimum, in band widths)
    warpA: 0.035, warpF: 2.6, // wavy stream edges: displacement and noise frequency
    lenK: [0.85, 1.3],  // arm length: Reach x frame diagonal x this range
    sep: 0.95,          // arms keep at least this far apart (radians) where they can
    fan: [3.6, 4.8], fanPad: 0.06, // a source by an edge fans its arms over this much (radians), not quite to the ends
    bendK: 0.9,         // arms bend steadily up to this much per unit length (radians) ...
    meander: 1.6, meanderF: 1.2, // ... and meander: turn rate (sd, radians per unit length) and how often it changes
    widthK: [0.8, 1.2], // streams differ in width by this range
    edgeP: 0.85, edgeD: [0.03, 0.28], // chance the source sits near an edge, and how far in from it
    dot: 0.07, dotA: 0.8, // dot size (x cell) and opacity at Dot grid 100 %
  };

  /* ---- geometry --------------------------------------------------------------------- */
  // Grid of whole cells: Pixels across the width.
  // The rows go by the frame's exact shape (aspect, from the app), so the preview has the export's rows.
  function grid(W, H, p, aspect) {
    const cols = Math.max(2, Math.round(p.pixels));
    const cw = W / cols, rows = Math.max(2, aspect > 0 ? Math.floor(cols / aspect + 0.5 + 1e-6) : Math.round(H / cw));
    return { cols, rows, cw, ch: H / rows };
  }

  // The streams for a seed and frame shape: a source, and from it one arm per stream, fanning
  // out (into the frame when the source sits by an edge, all round when it is further in).
  // Each arm bends and meanders as it runs on. An arm is a centre line (a polyline in width
  // units: the frame is 1 wide and A tall) with its core radius at each point (band widths).
  function streams(seed, A, p) {
    const r = PL.rng.create((seed ^ 0x6d2b79f5) >>> 0);
    const Sn = Math.max(1, Math.min(5, Math.round(p.streams)));
    const TAU = Math.PI * 2;
    let sx, sy, centre, arc;
    if (r.next() < K.edgeP) {
      const e = Math.floor(r.next() * 4), t = r.float(0.1, 0.9), d = r.float(K.edgeD[0], K.edgeD[1]);
      [sx, sy, centre] = e === 0 ? [t, d, Math.PI / 2] : e === 1 ? [1 - d, t, Math.PI] : e === 2 ? [t, 1 - d, -Math.PI / 2] : [d, t, 0];
      centre += r.float(-0.3, 0.3);
      arc = r.float(K.fan[0], K.fan[1]);
    } else { sx = r.float(0.2, 0.8); sy = r.float(0.2, 0.8); centre = r.float(0, TAU); arc = TAU; }
    const full = arc >= TAU - 1e-9;
    const diag = Math.hypot(1, A), m = Math.min(1, A); // m: the frame's short side (width units)
    const NM = PL.noise.get((seed ^ 0x3c6ef372) >>> 0);
    // arms one after another at random angles in the fan, each kept clear of the earlier ones
    // where it can be (so adding a stream keeps the others where they were)
    const rel = [];
    const rays = [];
    const apart = (o) => (rel.length ? Math.min(...rel.map((x) => { const d = Math.abs(o - x) % TAU; return Math.min(d, TAU - d); })) : TAU);
    for (let k = 0; k < 5; k++) {
      let o = 0, od = -1; // offset from the fan's start
      for (let tries = 0; tries < 12; tries++) {
        const c = r.float(K.fanPad, 1 - K.fanPad) * arc, d = apart(c);
        if (d > od) { o = c; od = d; }
        if (d >= K.sep) break;
      }
      rel.push(o);
      const len = (p.reach / 100) * diag * r.float(K.lenK[0], K.lenK[1]);
      const c1 = r.float(-K.bendK, K.bendK), off = r.float(0, 97);
      const width = r.float(K.widthK[0], K.widthK[1]);
      if (k >= Sn) continue;
      // the arm sets off at its fan angle (taken in the frame's own proportions, so the fan
      // stretches with the frame), then turns as it runs on: a steady bend plus a slow meander
      const a = centre - arc / 2 + o;
      const steps = Math.max(12, Math.ceil(len / 0.035)), ds = len / steps;
      let x = sx, y = sy * A, h = Math.atan2(Math.sin(a) * A, Math.cos(a));
      const pts = [x, y], rad = [K.core * width];
      for (let i = 1; i <= steps; i++) {
        const s = (i - 0.5) * ds, u = i / steps;
        h += (c1 + K.meander * NM.noise4(off + (s / m) * K.meanderF, off * 0.37, 0.5, 0.5) / 0.295) * (ds / m);
        x += Math.cos(h) * ds; y += Math.sin(h) * ds;
        pts.push(x, y); rad.push(K.core * width * (1 - K.taper * u * u));
      }
      rays.push({ pts, rad });
    }
    return { rays, source: [sx, sy * A] };
  }

  /* ---- the field: each cell's fixed glow level q, in bands ---------------------------
     q < 0: core; 0..4: the four fringe bands; >= 4: ground. Distance past the core edge
     maps to q piecewise (the outer bands are narrower), then each cell gets its own fixed
     offset. Cached per seed / settings.                                                   */
  // R (General's Rotation and Size): the part of the world to cover; the grid runs on past the frame, the
  // streams are where they are, and the dark ground with its dot grid carries on round them.
  const cache = new Map();
  function span(g, W, H, R) {
    const { cols, rows } = g;
    if (!R) return { c0: 0, c1: cols, r0: 0, r1: rows };
    return { c0: Math.floor((R.x0 * cols) / W), c1: Math.ceil((R.x1 * cols) / W), r0: Math.floor((R.y0 * rows) / H), r1: Math.ceil((R.y1 * rows) / H) };
  }
  function field(W, H, seed, p, aspect, R) {
    const g = grid(W, H, p, aspect), A = H / W;
    const sp = span(g, W, H, R);
    const key = [seed, g.cols, g.rows, A.toFixed(5), p.streams, p.reach, p.fringe, sp.c0, sp.c1, sp.r0, sp.r1, ...Object.values(K).flat()].join('|');
    const hit = cache.get(key);
    if (hit) return hit;
    const { cols, rows } = g, nc = sp.c1 - sp.c0, n = nc * (sp.r1 - sp.r0);
    const { rays } = streams(seed, A, p);
    const NW = PL.noise.get((seed ^ 0x2545f491) >>> 0), NS = PL.noise.get((seed ^ 0x9e3779b9) >>> 0);
    // Fringe scales the whole glow (the core and the bands); sizes go by the frame's short side
    const m = Math.min(1, A), unit = K.unit * (p.fringe / 100) * m;
    const B = [0]; for (const w of K.bands) B.push(B[B.length - 1] + w);
    const toBands = (x) => {
      // x: distance past the core edge, in band widths -> q
      if (x < 0) return x / K.bands[0];
      for (let k = 0; k < 4; k++) if (x < B[k + 1]) return k + (x - B[k]) / K.bands[k];
      return 4 + (x - B[4]) / K.bands[3];
    };
    const Q = new Float32Array(n);
    // scatter: a per-cell value plus a little shared with neighbours (a smooth noise at cell scale)
    const gs = (i, j, s) => { const a = hash(i, j, seed, s), b = hash(i, j, seed, s + 1), c = hash(i, j, seed, s + 2); return (a + b + c - 1.5) * 2; };
    const sc = K.scatter / Math.hypot(1, K.scatterCorr);
    const D = new Float64Array(rays.length);
    for (let j = sp.r0; j < sp.r1; j++) {
      for (let i = sp.c0; i < sp.c1; i++) {
        let x = (i + 0.5) / cols, y = ((j + 0.5) / rows) * A;
        // wavy edges: move the sample point a little
        x += K.warpA * m * NW.noise4((x / m) * K.warpF + 5.3, (y / m) * K.warpF - 2.1, 0.7, 0.3);
        y += K.warpA * m * NW.noise4((x / m) * K.warpF - 8.9, (y / m) * K.warpF + 4.4, 2.3, 1.9);
        // distance past each stream's core edge, in band widths; where streams run close
        // together their glows add up (a soft minimum), so the gaps between them fill in
        for (let r = 0; r < rays.length; r++) {
          const P = rays[r].pts, R = rays[r].rad;
          let v = Infinity;
          for (let s = 0, m = 0; s + 3 < P.length; s += 2, m++) {
            const ax = P[s], ay = P[s + 1], bx = P[s + 2] - ax, by = P[s + 3] - ay;
            const t = Math.max(0, Math.min(1, ((x - ax) * bx + (y - ay) * by) / (bx * bx + by * by || 1)));
            const ex = x - ax - bx * t, ey = y - ay - by * t;
            const e = Math.sqrt(ex * ex + ey * ey) / unit - (R[m] + (R[m + 1] - R[m]) * t);
            if (e < v) v = e;
          }
          D[r] = v;
        }
        let best = Infinity;
        for (let r = 0; r < rays.length; r++) if (D[r] < best) best = D[r];
        if (rays.length > 1) {
          let sum = 0;
          for (let r = 0; r < rays.length; r++) sum += Math.exp(-(D[r] - best) / K.blend);
          best -= K.blend * Math.log(sum);
        }
        const shared = NS.noise4(i * 0.62 + 3.7, j * 0.62 - 1.9, 0.5, 0.5) * 4.2; // ~unit sd at the cell scale
        let q = toBands(best) + sc * (gs(i, j, 11) + K.scatterCorr * shared);
        // sparks: now and then a cell out in the ground near a stream lights up in a fringe colour
        if (best > B[4] && hash(i, j, seed, 0x5a7) < K.spark * Math.exp(-(((best - B[4]) / K.sparkL) ** 2))) {
          const u = hash(i, j, seed, 0x5a8);
          q = 4 - 2 * u * u; // the outer bands (never bright enough to flash white)
        }
        Q[(j - sp.r0) * nc + (i - sp.c0)] = q;
      }
    }
    const out = { Q, g, sp };
    if (cache.size > 12) cache.delete(cache.keys().next().value);
    cache.set(key, out);
    return out;
  }

  // Per cell: band index for a frame (0 core, 1..4 fringe, 5 ground). In the animation each
  // cell's level swings once a loop, at its own timing.
  function tiers(W, H, seed, p, t, amt, aspect, R) {
    const { Q, g, sp } = field(W, H, seed, p, aspect, R);
    const { cols, rows } = g, nc = sp.c1 - sp.c0, n = Q.length;
    const T = new Uint8Array(n);
    const sw = K.swing * Math.max(0, amt || 0), tt = ((t % 1) + 1) % 1;
    for (let k = 0; k < n; k++) {
      let q = Q[k];
      if (sw > 0) {
        // each cell's own timing (cells past the frame: by their place, so none share one)
        const i = sp.c0 + (k % nc), j = sp.r0 + Math.floor(k / nc), inside = i >= 0 && i < cols && j >= 0 && j < rows;
        const ph = 2 * Math.PI * (inside ? hash(j * cols + i, seed, 0x51, 0x7e) : hash(i, j, seed, 0x517e));
        q += sw * (Math.sin(2 * Math.PI * tt + ph) - K.still * Math.sin(ph));
      }
      T[k] = q < 0 ? 0 : q < 4 ? 1 + Math.floor(q) : 5;
    }
    return { T, g, sp };
  }

  /* ---- build ------------------------------------------------------------------------ */
  function build({ W, H, aspect, seed, p, colors, t = 0, anim, region }) {
    const n = colors.length;
    const scene = new PL.Scene(W, H, colors[0], 0);
    const { T, g, sp } = tiers(W, H, seed, p, t, anim ? anim.amount : 0, aspect, region);
    const { cols, rows, cw } = g, nc = sp.c1 - sp.c0;
    const m = Math.max(1, n - 2);
    const bands = bandInks(m);
    const NH = PL.noise.get((seed ^ 0x68e31da4) >>> 0), hm = Math.min(1, H / W);
    // layers: core, then fringe inks, each in a few tints; dots on top
    const C = PL.color;
    const tintOf = (hex, k) => (k === 0 ? hex : C.mix(hex, '#000000', (K.tint * k) / (K.tints - 1)));
    const layers = new Map();
    const layer = (ci, k) => {
      const key = ci * 16 + k;
      let L = layers.get(key);
      if (!L) {
        const name = (ci === 1 ? 'Core' : m === 1 ? 'Fringe' : 'Fringe ' + (ci - 1)) + (k ? ' · ' + (k + 1) : '');
        L = scene.layer('c' + ci + '-' + k, tintOf(colors[ci], k), name, k ? undefined : ci);
        layers.set(key, L);
      }
      return L;
    };
    // create the layers in drawing order: core first, then fringe inks core outwards
    for (let ci = 1; ci < n; ci++) for (let k = 0; k < K.tints; k++) layer(ci, k);
    // cells snap to the output's whole pixels: zs of them to a frame pixel (zoomed in by General's Size, more)
    const zs = region && region.z > 1 ? region.z : 1, snap = (v) => Math.round(v * zs) / zs;
    let lit = 0;
    for (let j = sp.r0; j < sp.r1; j++) {
      const y0 = snap((j * H) / rows), y1 = snap(((j + 1) * H) / rows);
      for (let i = sp.c0; i < sp.c1; i++) {
        const b = T[(j - sp.r0) * nc + (i - sp.c0)];
        if (b === 5) continue;
        let ci;
        if (b === 0) ci = 1;
        else {

            const z = (v / 0.295 + K.inkJit * 3.46 * (hash(i, j, seed, 0x4b1d + b) - 0.5)) / Math.hypot(1, K.inkJit);

    id: 'prism',
    name: 'Prism',
    kind: 'Backgrounds',
    tagline: 'Pixel aurora',
    about: 'Chunky pixel streams fanning across a black dot-grid field: a white core with a rainbow fringe that breaks up into scattered pixels. In the animation every pixel shimmers across the band edges.',

    build,
    zoom: true, // draws any region of its world (General's Rotation and Size)

/* ==========================================================================
   tools/motley.js — Motley: glyph patchwork.

   1. Grid: square cells, Cells across the frame (rows follow the frame's
      shape; the last row may be cut by the bottom edge). Each cell holds at
      most one glyph, sized by Glyph size: a square, circle, target (a circle
      with a dot of a second ink in the middle), plus, stripes (three bars) or
      a small dot.
   2. Patches: ragged blobs and stepped blocks spread over the frame and laid
      over one another (bigger ones first, loosely), each filled with one glyph
      in one ink. Size sets how big they are, Ragged how lumpy the blobs and
      how cut-about the blocks (stepped notches and staircase corners), Blocks
      the share of blocks among them.
   3. Sparse patches fill only every other cell (a checkerboard) or every
      other row, so the patch beneath shows through. Stitched patches get an
      outline of small pluses and dots in another ink just outside their edge.
      Gaps are patches that cut back to the plain ground.
   4. Animation: now and then a glyph of a sparse patch drops out for a frame,
      at random, showing what lies beneath, so the woven areas twinkle while
      everything else holds still. Amount sets how often. The flicker repeats
      exactly every loop, so it is seamless.
   ========================================================================== */
(() => {
  const { hash } = PL.rng;

  // Ground first, then the inks.
  const PALETTES = [
    { name: 'Spring', colors: ['#DBF3DB', '#151D15', '#E64343', '#284CAC', '#F2D935', '#00BBC3', '#D179CA', '#3E8343'] }, // tomato, blue, lemon, aqua, orchid and green on mint
    { name: 'Frost', colors: ['#EDF7FC', '#0D1E3B', '#1570D1', '#6AC5E8', '#91E2DC', '#EC7380', '#9274C3', '#F7DD7D'] },
    { name: 'Cream', colors: ['#F3F1DC', '#1C1C1C', '#EA9D48', '#1C4763', '#E2323C', '#2F9785', '#F03899', '#9DB9AD'] },
    { name: 'Citrine', colors: ['#F6F4CE', '#17170C', '#EC7C0E', '#D33D2C', '#589A28', '#0070A6', '#F0C543', '#7A3430'] },
    { name: 'Blush', colors: ['#F8F4F6', '#1C1C1C', '#3B2792', '#4E86D8', '#1FD33A', '#561C1C', '#85A69A', '#EFB752'] },
    { name: 'Moss', colors: ['#301705', '#E7D5C1', '#D2F408', '#B1FD5A', '#61F733', '#3EE767', '#41DEBF', '#389ABA'] },
    { name: 'Gelato', colors: ['#FFF3E9', '#2F1C19', '#EE79A1', '#FBBB87', '#A6E599', '#AA8DDE', '#D8BD51', '#0097AA'] },
    { name: 'Neon', colors: ['#0B0C1A', '#F4EEE0', '#FB40AD', '#CFEF46', '#00D0D9', '#845CF7', '#FF9D20', '#1C69E3'] }, // neon inks on a night ground
    { name: 'Mono', colors: ['#F2F0EA', '#1C1C1C', '#5E5E5E', '#9B9B9B', '#C8C6C0'] },
    { name: 'Duo', colors: ['#F4EFE6', '#1B3BFF', '#FF5A36'] },
  ];

  /* ---- color roles -------------------------------------------------------------------- */
  const roles = (n) => ['Ground', ...Array.from({ length: n - 1 }, (_, i) => (n === 2 ? 'Ink' : 'Ink ' + (i + 1)))];
  const spec = (n) => ({ ramp: 1, accents: Math.max(1, n - 1) });
  const isLight = (hex) => PL.color.luminance(hex) > 0.35;

  // "New colors": a pale tinted ground (now and then a deep one), a near-black first ink (on a
  // deep ground: a pale one), then vivid inks spread round the wheel, light and deep by turns,
  // with one muted ink among them.
  function generate(n, rng) {
    const C = PL.color;
    const dark = rng.chance(0.14);
    const h0 = rng.float(0, 360);
    const out = dark
      ? [C.lch(rng.float(0.2, 0.27), rng.float(0.04, 0.07), h0), C.lch(rng.float(0.88, 0.92), rng.float(0.02, 0.04), h0 + 40)]
      : [C.lch(rng.float(0.94, 0.975), rng.float(0.015, 0.05), h0), C.lch(rng.float(0.16, 0.2), rng.float(0, 0.01), h0)];
    const m = n - 2;
    const h1 = rng.float(0, 360), step = dark ? rng.float(18, 34) : (360 / Math.max(1, m)) * rng.float(0.8, 1.05);
    const muted = m >= 4 ? Math.floor(rng.float(1, m)) : -1;
    for (let i = 0; i < m; i++) {
      const h = h1 + i * step + rng.float(-12, 12);
      if (i === muted) { out.push(C.lch(rng.float(0.62, 0.72), rng.float(0.03, 0.06), h)); continue; }
      const L = dark ? rng.float(0.72, 0.9) : i % 2 ? rng.float(0.42, 0.6) : rng.float(0.74, 0.9);
      out.push(C.lch(L, rng.float(0.14, 0.24), h));
    }
    return out;
  }

  // + adds an ink in a hue the palette doesn't have yet.
  function add(colors) {
    const C = PL.color;
    const c = colors.slice();
    const hues = c.slice(1).filter((x) => C.hexToLch(x)[1] > 0.04).map((x) => C.hexToLch(x)[2]);
    let best = 0, bd = -1;
    for (let h = 0; h < 360; h += 10) {
      const d = hues.length ? Math.min(...hues.map((x) => Math.abs((((h - x) % 360) + 540) % 360 - 180))) : 180;
      if (d > bd) { bd = d; best = h; }
    }
    c.push(C.lch(isLight(c[0]) ? 0.62 : 0.8, 0.17, best));
    return c;
  }

  function fit(colors, n) {
    let c = (colors || []).map(PL.color.normHex).filter(Boolean);
    if (!c.length) c = PALETTES[0].colors.slice();
    if (c.length === 1) c.push(PL.color.mix(c[0], isLight(c[0]) ? '#000000' : '#FFFFFF', 0.85));
    if (c.length >= n) return c.slice(0, n);
    while (c.length < n) c = add(c);
    return c;
  }

  const S = (section, key, label, min, max, def, extra = {}) => ({ section, key, label, type: 'range', min, max, def, step: 1, ...extra });
  const PARAMS = [
    S('Grid', 'cells', 'Cells across', 16, 120, 62, { rand: [41, 76], hint: 'Cells across the frame' }),
    S('Grid', 'glyph', 'Glyph size', 40, 100, 77, { unit: '%', rand: [73, 94], hint: 'How much of its cell each glyph fills' }),
    S('Patches', 'patches', 'Patches', 4, 60, 27, { rand: [18, 32], hint: 'How many shapes are laid over one another' }),
    S('Patches', 'size', 'Size', 0, 100, 64, { unit: '%', rand: [35, 65], hint: 'How big the shapes are' }),
    S('Patches', 'ragged', 'Ragged', 0, 100, 43, { unit: '%', rand: [35, 75], hint: 'How lumpy the blobs are, and how stepped and cut-about the blocks' }),
    S('Patches', 'blocks', 'Blocks', 0, 100, 51, { unit: '%', rand: [20, 60], hint: 'Share of the shapes that are stepped blocks rather than blobs' }),
    S('Patches', 'sparse', 'Sparse', 0, 100, 21, { unit: '%', rand: [20, 50], hint: 'Share of the shapes with glyphs in every other cell or every other row only (these twinkle in the animation)' }),
    S('Patches', 'stitched', 'Stitched', 0, 100, 38, { unit: '%', rand: [25, 55], hint: 'Share of the shapes outlined with small pluses and dots in another ink' }),
    S('Patches', 'gaps', 'Gaps', 0, 100, 0, { unit: '%', rand: [0, 20], hint: 'Share of the shapes that cut back to the plain ground' }),
  ];

  // Constants. Glyph sizes are shares of the glyph box (Glyph size x cell x box); shape sizes
  // are in units of the frame's width (radii: of its mean side).
  const K = {
    box: 0.92,          // glyph box: Glyph size x cell x this
    circle: 1.02,       // circle and target diameter
    cen: 0.425,         // a target's centre dot diameter
    dot: 0.37,          // dot diameter
    plus: 0.263,        // plus arm thickness (the arms span the box)
    bar: 0.185, pitch: 0.345, barLen: 0.98, // stripes: three bars
    kinds: [['square', 0.19], ['circle', 0.26], ['dot', 0.15], ['plus', 0.19], ['stripes', 0.13], ['target', 0.08]],
    rows: 0.38,         // sparse patches: share woven in rows (the rest: a checkerboard)
    sparseK: 1.4,       // Sparse ^ this = the chance a shape is sparse (0.23 at the default 35 %)
    stitchPlus: 0.55,   // stitches: share of pluses (the rest are dots)
    r0: 0.06, r1: 0.3,  // patch radius: (r0 + r1 x Size) x the frame's mean side ...
    rJit: [0.45, 1.5], rPow: 1.4, // ... times a random factor in this range (weighted toward the small end)
    stretch: 0.7,       // shapes stretch up to e^(this/2) one way
    blobA: 0.3,         // blob outline: lobes, depth (x Ragged) ...
    blobF: 1.0,         // ... and how many round the blob
    bumpA: 0.05, bumpF: 2.6, // ... plus smaller bumps
    square: [2, 3.6],   // blobs range from round to squarish (superellipse exponent)
    stitchK: 1.47,      // Stitched ^ this = the chance a shape is outlined (0.26 at the default 40 %)
    cut: 0.55,          // blocks: chance per corner of a cut (x Ragged) ...
    chamfer: 0.55,      // ... a staircase (diagonal) cut, otherwise a stepped notch
    reach: 0.06,        // patch centres may sit this far outside the frame
    spread: 1.2,        // centres: jitter round their evenly spread places (x the spacing of 24 shapes)
    mix: 0.35,          // stacking: big shapes first, small ones on top, this loosely
    flicker: 0.215,     // animation: chance a sparse glyph drops out in a frame, x Amount
  };

  const pick = (table, u) => { let s = 0; for (const [v, w] of table) { s += w; if (u < s) return v; } return table[table.length - 1][0]; };
  const lerp = (a, b, t) => a + (b - a) * t;

  /* ---- grid ---------------------------------------------------------------------------- */
  function grid(W, H, p) {
    const cols = Math.max(2, Math.round(p.cells));
    const cw = W / cols;
    const rows = Math.max(1, Math.ceil(H / cw - 1e-6)); // square cells; the last row may be cut
    return { cols, rows, cw };
  }

  /* ---- the patches ----------------------------------------------------------------------
     Every patch takes the same 24 random numbers whatever the sliders say, so moving a slider
     only changes what it has to, and adding patches keeps the others where they are.         */
  const DRAWS = 24;
  function makePatches(seed, A, p, n) {
    const r = PL.rng.create((seed ^ 0x51ab7e3d) >>> 0);
    const M = Math.sqrt(A); // the frame is 1 wide and A tall; M = its mean side
    const P = Math.max(1, Math.min(60, Math.round(p.patches)));
    const f = (v) => Math.max(0, Math.min(100, v)) / 100;
    const size = f(p.size), rag = f(p.ragged), blocks = f(p.blocks), sparse = f(p.sparse), stitched = f(p.stitched), gaps = f(p.gaps);
    const inks = Math.max(1, n - 1);
    const other = (ink, u) => { if (inks < 2) return ink; const o = 1 + Math.min(inks - 2, Math.floor(u * (inks - 1))); return o >= ink ? o + 1 : o; };
    const out = [];
    const sx0 = r.next(), sy0 = r.next();
    for (let k = 0; k < 60; k++) {
      const u = []; for (let q = 0; q < DRAWS; q++) u.push(r.next());
      if (k >= P) continue;
      const pt = { k };
      pt.gap = u[0] < gaps;
      pt.block = u[1] < blocks;
      // centres spread evenly over the frame (a low-discrepancy sequence from a random start,
      // jittered), so the shapes tile it like a patchwork rather than piling up
      const qx = (sx0 + (k + 1) * 0.7548776662466927) % 1, qy = (sy0 + (k + 1) * 0.5698402909980532) % 1;
      const jit = K.spread / Math.sqrt(24);
      pt.cx = lerp(-K.reach, 1 + K.reach, Math.min(1, Math.max(0, qx + (u[2] - 0.5) * jit)));
      pt.cy = lerp(-K.reach, 1 + K.reach, Math.min(1, Math.max(0, qy + (u[3] - 0.5) * jit))) * A;
      pt.R = (K.r0 + K.r1 * size) * M * lerp(K.rJit[0], K.rJit[1], Math.pow(u[4], K.rPow));
      pt.sx = Math.exp((u[5] - 0.5) * K.stretch);
      pt.kind = pick(K.kinds, u[6]);
      pt.ink = 1 + Math.min(inks - 1, Math.floor(u[7] * inks));
      pt.ink2 = other(pt.ink, u[8]);
      pt.mode = u[9] < Math.pow(sparse, K.sparseK) ? (u[10] < K.rows ? 'rows' : 'checker') : 'full';
      pt.par = u[11] < 0.5 ? 0 : 1;
      pt.stitch = u[12] < Math.pow(stitched, K.stitchK);
      pt.sink = other(pt.ink, u[13]);
      pt.nz = u[14] * 97;
      pt.rot = u[15] * Math.PI;
      pt.rag = rag;
      pt.ex = lerp(K.square[0], K.square[1], u[18]);
      if (pt.block) {
        // a rectangle (not rotated), with cuts at its corners: notches (one or two steps) or
        // staircase corners (a diagonal cut, which the grid turns into steps)
        pt.hw = pt.R * pt.sx * lerp(0.7, 1, u[16]);
        pt.hh = (pt.R / pt.sx) * lerp(0.7, 1, u[17]);
        pt.cuts = [];
        for (let c = 0; c < 4; c++) {
          const v = hash(seed, k, c, 0x3c7a1); // per corner, outside the main draws
          if (v >= K.cut * rag) continue;
          const w = hash(seed, k, c, 0x3c7a2), h = hash(seed, k, c, 0x3c7a3), t = hash(seed, k, c, 0x3c7a4);

          else {
            const v5 = hash(seed, k, c, 0x3c7a5), steps = v5 < 0.45 ? 1 : v5 < 0.8 ? 2 : 3;

          }
        }
      }
      pt.order = pt.R * (pt.block ? Math.sqrt(pt.hw * pt.hh) / pt.R : 1) * lerp(1 - K.mix, 1 + K.mix, u[19]);
      out.push(pt);
    }

    return out.sort((a, b) => b.order - a.order);
  }

  // Is (x, y) (width units) inside patch pt?
  function makeInside(NZ) {
    return (pt, x, y) => {
      if (pt.block) {
        const dx0 = x - (pt.cx - pt.hw), dx1 = pt.cx + pt.hw - x, dy0 = y - (pt.cy - pt.hh), dy1 = pt.cy + pt.hh - y;
        if (dx0 < 0 || dx1 < 0 || dy0 < 0 || dy1 < 0) return false;
        for (const q of pt.cuts) {
          const ex = q.c === 0 || q.c === 3 ? dx0 : dx1, ey = q.c < 2 ? dy0 : dy1; // distance in from the corner
          if (q.type === 0) { if (ex / q.a + ey / q.b < 1) return false; } // staircase corner
          else if (ex < q.a && ey < q.b && Math.floor((ex / q.a) * q.steps) + Math.floor((ey / q.b) * q.steps) < q.steps) return false; // stepped notch
        }
        return true;
      }
      // a blob: an ellipse whose radius wanders round its outline (lobes, then smaller bumps)
      const ox = x - pt.cx, oy = y - pt.cy;
      const c = Math.cos(pt.rot), s = Math.sin(pt.rot);
      const lx = (ox * c + oy * s) / (pt.R * pt.sx), ly = (-ox * s + oy * c) / (pt.R / pt.sx);
      const d = pt.ex === 2 ? Math.hypot(lx, ly) : Math.pow(Math.pow(Math.abs(lx), pt.ex) + Math.pow(Math.abs(ly), pt.ex), 1 / pt.ex);
      const lim = 1 + pt.rag * (K.blobA + K.bumpA) * 2.2;
      if (d > lim) return false;
      if (d < 1 - pt.rag * (K.blobA + K.bumpA) * 2.2) return true;
      const ux = d > 1e-9 ? lx / d : 1, uy = d > 1e-9 ? ly / d : 0;
      const r = 1 + pt.rag * (K.blobA * NZ.noise4(ux * K.blobF + pt.nz, uy * K.blobF - pt.nz, pt.nz * 0.31, 0.5)
        + K.bumpA * NZ.noise4(ux * K.bumpF - pt.nz, uy * K.bumpF + pt.nz, 0.5, pt.nz * 0.17)) / 0.3;
      return d < r;
    };
  }

  // Bounding box of a patch (width units), generous for blobs.
  function bbox(pt) {
    if (pt.block) return [pt.cx - pt.hw, pt.cx + pt.hw, pt.cy - pt.hh, pt.cy + pt.hh];
    const e = (1 + pt.rag * (K.blobA + K.bumpA) * 2.2) * Math.SQRT2 * pt.R * Math.max(pt.sx, 1 / pt.sx); // squarish blobs reach into the corners
    return [pt.cx - e, pt.cx + e, pt.cy - e, pt.cy + e];
  }

  /* ---- per-cell stacks (cached): from the top down, the patches a cell can show, ending at
     the first one that always shows (a full patch or a stitch). Sparse patches' glyphs can
     drop out for a frame; their empty cells are see-through.                                 */
  // Past the frame (General's Rotation and Size, region R) the patchwork carries on: the world is laid out
  // in tiles the size of the box the frame's patch centres spread over (so the patches are as dense
  // everywhere), the frame's own patches in its tile and every other tile with patches of its own (a seed
  // of its own), stacked big ones first, and the frame's own patches on top of all the others (so in the
  // frame the patchwork stays the frame's own).
  function patchesFor(seed, A, p, n, R, W) {
    if (!R) return makePatches(seed, A, p, n);
    const TS = 1 + 2 * K.reach, M = Math.sqrt(A), size = Math.max(0, Math.min(100, p.size)) / 100;
    const E = 3 * (K.r0 + K.r1 * size) * M * K.rJit[1] + 0.05; // further than any patch reaches from its centre
    const X0 = R.x0 / W - E, X1 = R.x1 / W + E, Y0 = R.y0 / W - E, Y1 = R.y1 / W + E; // width units
    const others = [];
    let own = [];
    for (let tj = Math.ceil((Y0 / A - 1 - K.reach) / TS); tj <= Math.floor((Y1 / A + K.reach) / TS); tj++) {
      for (let ti = Math.ceil((X0 - 1 - K.reach) / TS); ti <= Math.floor((X1 + K.reach) / TS); ti++) {
        if (ti === 0 && tj === 0) { own = makePatches(seed, A, p, n); continue; }
        const sd = (Math.imul(seed | 0, 0x2c1b3c6d) ^ Math.imul(ti, 0x9e3779b1) ^ Math.imul(tj, 0x85ebca77) ^ 0x6d2b79f5) | 0;
        const id = 61 * (1 + (((ti + 512) & 1023) << 10 | ((tj + 512) & 1023)));
        for (const pt of makePatches(sd, A, p, n)) {
          pt.cx += ti * TS; pt.cy += tj * TS * A; pt.k += id;
          if (pt.cx > X0 && pt.cx < X1 && pt.cy > Y0 && pt.cy < Y1) others.push(pt);
        }
      }
    }
    return others.sort((a, b) => b.order - a.order).concat(own);
  }

  const cache = new Map();
  const OPAQUE = 1, STITCH = 2;
  // sp (General's Rotation and Size): the columns c0..c1 and rows r0..r1 to lay out (default: the frame's)
  function layout(W, H, seed, p, n, R) {
    const g = grid(W, H, p);
    const sp = R ? { c0: Math.floor(R.x0 / g.cw), c1: Math.ceil(R.x1 / g.cw), r0: Math.floor(R.y0 / g.cw), r1: Math.ceil(R.y1 / g.cw) } : { c0: 0, c1: g.cols, r0: 0, r1: g.rows };
    const key = [seed, g.cols, g.rows, (H / W).toFixed(5), n, p.patches, p.size, p.ragged, p.blocks, p.sparse, p.stitched, p.gaps, sp.c0, sp.c1, sp.r0, sp.r1, ...Object.values(K).flat(2)].join('|');
    const hit = cache.get(key);
    if (hit) return hit;
    const { cols } = g, nc = sp.c1 - sp.c0, N = nc * (sp.r1 - sp.r0);
    const pts = patchesFor(seed, H / W, p, n, R, W);
    const NZ = PL.noise.get((seed ^ 0x6c8e9cf5) >>> 0);
    const inside = makeInside(NZ);
    const lists = Array.from({ length: N }, () => []);
    const done = new Uint8Array(N); // a cell whose stack already ends in an opaque entry
    for (let q = pts.length - 1; q >= 0; q--) {
      const pt = pts[q];
      const [x0, x1, y0, y1] = bbox(pt);
      // the patch's cells over its bounding box (one cell more all round, even past the frame)
      const i0 = Math.floor(x0 * cols) - 2, i1 = Math.ceil(x1 * cols) + 2, j0 = Math.floor(y0 * cols) - 2, j1 = Math.ceil(y1 * cols) + 2;
      const bw = i1 - i0 + 1, bh = j1 - j0 + 1;

        for (let i = Math.max(sp.c0, i0); i <= Math.min(sp.c1 - 1, i1); i++) {

            if (pt.stitch && (In(i - 1, j) || In(i + 1, j) || In(i, j - 1) || In(i, j + 1))) { lists[c].push(q, STITCH); done[c] = 1; }
            continue;
          }
          if (pt.mode === 'full') { lists[c].push(q, OPAQUE); done[c] = 1; continue; }

  }

  // What each cell shows in frame f: the patch (its place in the stack, or -1 for the ground)
  // and whether it shows as a stitch, packed as index * 2 + stitch.
  function cellsAt(W, H, seed, p, n, t, anim, R) {

    const { cols, rows } = L.g, { sp } = L, nc = sp.c1 - sp.c0, N = L.lists.length;
    const F = Math.max(1, (anim && anim.frames) | 0 || 36);
    const f = ((Math.round((((t % 1) + 1) % 1) * F) % F) + F) % F;
    const pf = Math.min(0.9, K.flicker * Math.max(0, anim ? anim.amount : 0));
    const show = new Int16Array(N).fill(-1);
    for (let c = 0; c < N; c++) {
      const l = L.lists[c];

        if (s === 0 && pf > 0 && hash(cid, L.pts[k].k * 131 + f, seed, 0x7f1c) < pf) continue; // dropped out this frame

  /* ---- build ------------------------------------------------------------------------ */
  // region (General's Rotation and Size): the part of the world to cover (see patchesFor)
  function build({ W, H, seed, p, colors, t = 0, anim, region }) {
    const n = colors.length;
    const scene = new PL.Scene(W, H, colors[0], 0);
    const { L, show } = cellsAt(W, H, seed, p, n, t, anim, region);
    const { cols, rows, cw } = grid(W, H, p); // (not the cached grid: the same cells can come at another size)
    const { sp } = L, nc = sp.c1 - sp.c0;
    const gl = Math.max(40, Math.min(100, p.glyph)) / 100;
    const b = K.box * gl * cw, hb = b / 2;
    // one layer per ink, then the targets' middles on top
    const layers = [], centres = [];
    for (let ci = 1; ci < n; ci++) layers[ci] = scene.layer('ink-' + ci, colors[ci], n === 2 ? 'Ink' : 'Ink ' + ci, ci);
    const centre = (ci) => centres[ci] || (centres[ci] = scene.layer('ink-' + ci + '-middles', colors[ci], (n === 2 ? 'Ink' : 'Ink ' + ci) + ' · target middles', ci));
    const t2 = (K.plus * b) / 2, bh = (K.bar * b) / 2, pitch = K.pitch * b, bl = (K.barLen * b) / 2;
    const rc = (K.circle * b) / 2, rd = (K.dot * b) / 2, rk = (K.cen * b) / 2;
    const plus = (Ly, x, y) => PL.Scene.poly(Ly, [x - t2, y - hb, x + t2, y - hb, x + t2, y - t2, x + hb, y - t2, x + hb, y + t2, x + t2, y + t2,
      x + t2, y + hb, x - t2, y + hb, x - t2, y + t2, x - hb, y + t2, x - hb, y - t2, x - t2, y - t2]);
    let drawn = 0;
    for (let j = sp.r0; j < sp.r1; j++) {
      const y = (j + 0.5) * cw;
      for (let i = sp.c0; i < sp.c1; i++) {
        const v = show[(j - sp.r0) * nc + (i - sp.c0)];
        if (v < 0) continue;
        const pt = L.pts[v >> 1], x = (i + 0.5) * cw;

          const Ly = layers[pt.sink];

          drawn++;
          continue;

        if (pt.gap) continue;
        const Ly = layers[pt.ink];
        switch (pt.kind) {
          case 'square': PL.Scene.rect(Ly, x - hb, y - hb, b, b); break;
          case 'circle': PL.Scene.circle(Ly, x, y, rc); break;
          case 'dot': PL.Scene.circle(Ly, x, y, rd); break;
          case 'target': PL.Scene.circle(Ly, x, y, rc); PL.Scene.circle(centre(pt.ink2), x, y, rk); break;
          case 'stripes': for (const o of [-pitch, 0, pitch]) PL.Scene.rect(Ly, x - bl, y + o - bh, 2 * bl, 2 * bh); break;

    scene.layers = scene.layers.filter((Ly) => Ly.c.length || Ly.r.length || Ly.p.length);
    const ord = (Ly) => (/-middles$/.test(Ly.key) ? 1 : 0);
    scene.layers.sort((a, c) => ord(a) - ord(c));
    const np = region ? Math.max(1, Math.min(60, Math.round(p.patches))) : L.pts.length; // the frame's own patches
    scene.status = `${cols} × ${rows} cells · ${np} patches · ${drawn.toLocaleString()} glyphs`;
    return scene;
  }

  PL.tools.register({
    id: 'motley',
    name: 'Motley',
    kind: 'Backgrounds',
    tagline: 'Glyph patchwork',
    about: 'Ragged blobs and stepped blocks laid over one another on a grid, each filled with squares, circles, targets, pluses, stripes or dots in one ink; some woven into the shape below, some outlined in stitches, some cut back to the ground. In the animation the woven glyphs twinkle as they drop out for a moment.',
    inks: {
      min: 2, max: 12, roles, fit, spec, add, generate,
      span: () => 2, // Invert swaps the ground and the first ink
      hint: 'Ground first, then the inks. Each shape takes one ink (a target takes a second one for the dot in its middle, a stitched outline another).',
    },
    palettes: PALETTES,
    params: PARAMS,
    animLabel: 'Amount',
    animHint: 'How often the glyphs of the woven shapes drop out for a moment (0: still)',
    defaults: {
      anim: { amount: 0.6, fps: 6, frames: 36 }, // 36 frames in about 6 s
      fx: {},
      palette: 'Cream', // the preset the style opens on (its card's colors)
    },
    build,
    zoom: true, // draws any region of its world (General's Rotation and Size)
    _K: K,
    _clear: () => cache.clear(),

    _layout: layout,

/* ==========================================================================
   tools/warp.js — Warp: op-art patterns, bent.

   1. Pattern: a checkerboard of square cells (anchored at the frame's top-left
      corner), or slashes: diagonal stripes cut into bands across their length,
      each band slid along by its own random amount, so the stripes step at
      every band edge. Scale sets the cell (or stripe) size; every variation
      has its own base size, stripe angle, stripe weight and band length.
   2. Two colors: the base and one of the inks (each variation picks one, the
      first ink most often), and which of them is drawn on top of the other.
   3. Warp bends the pattern, one of three ways (Auto picks per variation):
        waves  - every point slides across by a sine of its height and up and
                 down by a sine of its position across;
        taper  - the columns fan out like a floor in perspective (the cells keep
                 their height, the width changes from top to bottom);
        pinch  - everything is pulled toward the centre: the screen radius goes
                 as a power of the pattern radius, so cells shrink into the middle.
      Warp sets how strongly. The shapes are true vector polygons: every side
      of a cell or stripe is cut into five straight steps and each step's ends
      are bent.
   4. Animation: the warp breathes. Its strength swings once per loop around
      the still level (Intensity x 0.55 either way, in step with the first wave),
      so the pattern bends further, eases back and bends
      again. Seamless; Intensity 0 holds everything still.
   ========================================================================== */
(() => {
  const { hash } = PL.rng;

  // Two colors each: the base and its ink (the default look uses Rust: defaults.palette). + adds inks for the variations to pick from.
  const PALETTES = [
    { name: 'Neon', colors: ['#0E0B0B', '#A5E8FC'] },
    { name: 'Acid', colors: ['#0C0E0A', '#D7FF3D'] },
    { name: 'Sunset', colors: ['#170A1C', '#FF8A3D'] },
    { name: 'Lagoon', colors: ['#06141A', '#3DF2E0'] },
    { name: 'Paper', colors: ['#F1ECE2', '#151515'] },
    { name: 'Rust', colors: ['#F0F5F0', '#D67523'] },
    { name: 'Candy', colors: ['#FFF4F8', '#FF4F9A'] },
    { name: 'Midnight', colors: ['#0A1030', '#7AA2FF'] },
    { name: 'Mono', colors: ['#0E0E0E', '#F2F2F2'] },
    { name: 'Duo', colors: ['#14213D', '#FCA311'] },

  /* ---- color roles ---------------------------------------------------------------- */
  const roles = (n) => ['Base', ...Array.from({ length: n - 1 }, (_, i) => (n === 2 ? 'Ink' : 'Ink ' + (i + 1)))];
  const spec = (n) => ({ ramp: 1, accents: Math.max(1, n - 1) });
  const isLight = (hex) => PL.color.luminance(hex) > 0.35;

  // "New colors": a near-black base and bright, saturated inks round the wheel (now and then
  // a pale base with deep inks).
  function generate(n, rng) {
    const C = PL.color;
    const pale = rng.chance(0.15);
    const h0 = rng.float(0, 360);
    const out = [pale ? C.lch(rng.float(0.94, 0.97), rng.float(0.01, 0.03), h0) : C.lch(rng.float(0.1, 0.15), rng.float(0, 0.02), h0)];
    const m = n - 1, step = 360 / Math.max(1, m), h1 = rng.float(0, 360);
    for (let i = 0; i < m; i++) {
      let h = h1 + i * step * rng.float(0.85, 1.1) + rng.float(-14, 14);
      if (pale && ((h % 360) + 360) % 360 > 55 && ((h % 360) + 360) % 360 < 120) h += 65; // no muddy olives on a pale base
      out.push(pale ? C.lch(rng.float(0.45, 0.6), rng.float(0.16, 0.23), h) : C.lch(rng.float(0.72, 0.9), rng.float(0.14, 0.24), h));

  // + adds an ink in a hue the palette doesn't have yet.
  function add(colors) {

    const c = colors.slice();

    let best = 0, bd = -1;
    for (let h = 0; h < 360; h += 10) {

    return c;
  }

    let c = (colors || []).map(PL.color.normHex).filter(Boolean);
    if (!c.length) c = PALETTES[0].colors.slice();
    if (c.length === 1) c.push(PL.color.mix(c[0], isLight(c[0]) ? '#000000' : '#FFFFFF', 0.85));
    if (c.length >= n) return c.slice(0, n);
    while (c.length < n) c = add(c);

  }

  const S = (section, key, label, min, max, def, extra = {}) => ({ section, key, label, type: 'range', min, max, def, step: 1, ...extra });
  const PARAMS = [
    { section: 'Artwork', key: 'style', label: 'Style', type: 'select', def: 'auto',
      options: [{ value: 'auto', label: 'Auto' }, { value: 'checker', label: 'Checker' }, { value: 'slash', label: 'Slash' }] },
    { section: 'Artwork', key: 'bend', label: 'Warp shape', type: 'select', def: 'auto',
      options: [{ value: 'auto', label: 'Auto' }, { value: 'waves', label: 'Waves' }, { value: 'taper', label: 'Taper' }, { value: 'pinch', label: 'Pinch' }] },
    S('Artwork', 'scale', 'Scale', 50, 200, 100, { unit: '%', rand: [75, 135], hint: 'Size of the cells or stripes' }),
    S('Artwork', 'warp', 'Warp', 0, 100, 70, { unit: '%', rand: [40, 90], hint: 'How strongly the pattern bends (0: flat)' }),
  ];

  // Constants. Lengths are shares of the frame's short side unless noted.
  const K = {
    cell: [0.1, 0.17],      // cell (or stripe pitch) at Scale 100 %: this range, per variation
    duty: [0.43, 0.6],      // slash: share of the pitch the drawn stripe takes
    band: [1.3, 5.5],       // slash: band length, x the pitch (log-uniform)
    tilt: 16,               // slash: stripe angle = a diagonal +/- this (degrees)
    inkW: [0.5, 0.27, 0.15, 0.08], // the chance of each ink (later ones share the last weight)
    kinds: [['waves', 0.4], ['taper', 0.35], ['pinch', 0.25]],
    // waves: x slides by a sine of y, y by a sine of x
    waveLen: [0.6, 1.15],   // wavelength of the across-sine (x the short side) ...
    waveRatio: [1.15, 1.35],// ... the other one this much longer
    slope: [0.5, 1.5],      // steepest slope of the across-sine at Warp 100 % (at Warp w: w x this)
    ampRatio: [0.45, 0.6],  // the up-and-down sine's amplitude, x the across one's
    // taper: x' = cx + (x - cx) (1 + k (y - cy) / (H / 2)), k = Warp x this (fanning out downwards mostly)
    taper: [0.2, 0.7], taperUp: 0.15, taperMin: 0.1,
    reach: 3.2,             // taper: the pattern runs this many cells past the frame's sides, so a strong taper
                            // opens a strip of plain ground in the top corners, like a horizon
    // pinch: screen radius = R (r / R)^e, e = 1 + Warp x this, R = half the diagonal x [0.95, 1.1]
    pinch: [0.75, 1.25],
    mod: 0.55,              // animation: the warp swings by Intensity x this either way
    sub: 5,                 // every side of a cell or stripe is bent in this many straight steps
  };

  const pickW = (table, u) => { let s = 0, tot = 0; for (const [, w] of table) tot += w; for (const [v, w] of table) { s += w / tot; if (u < s) return v; } return table[table.length - 1][0]; };
  const lerp = (a, b, t) => a + (b - a) * t;

  /* ---- per-variation settings (each from its own hash, so changing one setting never
     reshuffles the others: Style and Warp shape keep the same cells and bend) ---------- */
  function setup(W, H, seed, p, n) {
    const u = (k) => hash(seed, 0x57a9, k, 3);
    const Sd = Math.min(W, H);
    const style = p.style === 'checker' || p.style === 'slash' ? p.style : u(1) < 0.5 ? 'checker' : 'slash';
    const bend = p.bend === 'waves' || p.bend === 'taper' || p.bend === 'pinch' ? p.bend : pickW(K.kinds, u(2));
    const scale = Math.max(50, Math.min(200, p.scale)) / 100;
    const cell = Sd * lerp(K.cell[0], K.cell[1], u(3)) * scale;
    // colors: which ink, and which of the two is drawn on top
    const inks = Math.max(1, n - 1);

    const ink = n > 1 ? pickW(wts, u(4)) : 0;

    const ang = ((u(6) < 0.5 ? 45 : -45) + lerp(-K.tilt, K.tilt, u(7))) * (Math.PI / 180);
    const duty = lerp(K.duty[0], K.duty[1], u(8));
    const band = cell * Math.exp(lerp(Math.log(K.band[0]), Math.log(K.band[1]), u(9)));
    const bandPhase = u(10);

    const lam1 = Sd * lerp(K.waveLen[0], K.waveLen[1], u(11)), lam2 = lam1 * lerp(K.waveRatio[0], K.waveRatio[1], u(12));
    const slope = lerp(K.slope[0], K.slope[1], u(13));

    const pinchK = lerp(K.pinch[0], K.pinch[1], u(19)), R = 0.5 * Math.hypot(W, H) * lerp(0.95, 1.1, u(20));

  }

  // The bend for one frame: forward map pattern -> screen, and a box in pattern space that is
  // sure to cover the frame (or, for General's Rotation and Size, region T of the world: the bends
  // carry on past the frame, so zooming out shows more of the same picture).
  function bender(W, H, P, warp, t, amount, T) {
    const w = Math.max(0, Math.min(100, warp)) / 100;
    const m = 1 + K.mod * Math.max(0, amount || 0) * Math.sin(2 * Math.PI * t + P.modPh);
    const cx = W / 2, cy = H / 2, pad = P.cell * 1.5;
    const X0 = T ? T.x0 : 0, X1 = T ? T.x1 : W, Y0 = T ? T.y0 : 0, Y1 = T ? T.y1 : H;
    if (w === 0 || m === 0) return { fwd: (x, y) => [x, y], box: [X0 - pad, X1 + pad, Y0 - pad, Y1 + pad], m };
    if (P.bend === 'waves') {
      const ax = P.ax * w * m, ay = P.ay * w * m, k1 = (2 * Math.PI) / P.lam1, k2 = (2 * Math.PI) / P.lam2;
      const e = Math.abs(ax) + Math.abs(ay) + pad;
      return { fwd: (x, y) => [x + ax * Math.sin(k1 * y + P.ph1), y + ay * Math.sin(k2 * x + P.ph2)], box: [X0 - e, X1 + e, Y0 - e, Y1 + e], m };
    }
    if (P.bend === 'taper') {
      const k = P.taperK * w * m;
      const f = (y) => Math.max(K.taperMin, 1 + (k * (y - cy)) / (H / 2));
      const half = W / 2 + K.reach * P.cell;
      return { fwd: (x, y) => [cx + (x - cx) * f(y), y], box: [cx - half, cx + half, Y0 - pad, Y1 + pad], m, fixed: true };

  let FORCE = null; // tests: override per-variation settings

    const n = colors.length;
    const P = Object.assign(setup(W, H, seed, p, n), FORCE || {});
    const tt = ((t % 1) + 1) % 1;
    const B = bender(W, H, P, p.warp, tt, anim ? anim.amount : 0, region);
    const X0 = region ? region.x0 : 0, X1 = region ? region.x1 : W, Y0 = region ? region.y0 : 0, Y1 = region ? region.y1 : H;
    const top = P.swap ? P.ink : 0, under = P.swap ? 0 : P.ink;
    const scene = new PL.Scene(W, H, colors[under], under);
    const L = scene.layer(P.style === 'checker' ? 'cells' : 'stripes', colors[top], P.style === 'checker' ? 'Cells' : 'Stripes', top);
    const [bx0, bx1, by0, by1] = B.box;
    const margin = P.cell * 0.5;
    let count = 0;
    // one outline: corners in pattern space (a parallelogram: o, o + e1, o + e1 + e2, o + e2)
    const quad = (ox, oy, e1x, e1y, e2x, e2y) => {
      const n1 = K.sub, n2 = K.sub; // five straight steps a side, bent at their ends
      const pts = [];
      let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity;
      const put = (x, y) => { const q = B.fwd(x, y); pts.push(q[0], q[1]); if (q[0] < minx) minx = q[0]; if (q[0] > maxx) maxx = q[0]; if (q[1] < miny) miny = q[1]; if (q[1] > maxy) maxy = q[1]; };
      for (let i = 0; i < n1; i++) put(ox + (e1x * i) / n1, oy + (e1y * i) / n1);
      for (let i = 0; i < n2; i++) put(ox + e1x + (e2x * i) / n2, oy + e1y + (e2y * i) / n2);
      for (let i = 0; i < n1; i++) put(ox + e1x + e2x - (e1x * i) / n1, oy + e1y + e2y - (e1y * i) / n1);
      for (let i = 0; i < n2; i++) put(ox + e2x - (e2x * i) / n2, oy + e2y - (e2y * i) / n2);
      if (maxx < X0 - 1 || minx > X1 + 1 || maxy < Y0 - 1 || miny > Y1 + 1) return; // off the frame (or region)
      // clockwise on screen (the nonzero rule then never punches holes where outlines overlap)
      let area = 0;
      for (let i = 0, k = pts.length - 2; i < pts.length; k = i, i += 2) area += (pts[k] - pts[i]) * (pts[k + 1] + pts[i + 1]);

      const s = P.cell;

    id: 'warp',
    name: 'Warp',
    kind: 'Backgrounds',
    tagline: 'Op-art pattern',
    about: 'Checkerboards and slashed stripes in a bright ink on black, bent by waves, a taper or a pinch. In the animation the warp breathes: the pattern bends further, eases back and bends again.',
    inks: {
      min: 2, max: 8, roles, fit, spec, add, generate,
      span: () => 2, // Invert swaps the base and the first ink
      hint: 'Base first, then the inks. Each variation pairs the base with one of the inks (the first one most often).',
    },
    palettes: PALETTES,
    params: PARAMS,
    recolorable: false,
    animLabel: 'Intensity',
    animHint: 'How far the warp swings as it breathes (0: still)',
    defaults: {
      anim: { amount: 0.8, fps: 12, frames: 72 },
      fx: {},
      palette: 'Rust', // the preset the style opens on (its card's colors)
    },
    build,
    zoom: true, // draws any region of its world (General's Rotation and Size)

/* ==========================================================================
   tools/stitch.js — Stitch: glitched pixel grid.

   1. Grid: Columns across the frame; the rows follow the frame's shape
      (cells are as near square as the frame allows). Every cell has a thin
      line of the palette's darkest color on its left and top (Gutter sets
      how thick), so the grid reads like stitches on canvas.
   2. Field: a smooth noise, stretched upright by Streak (tall streaks),
      sized by Scale, measured in frame widths from the top-left corner so a
      variation keeps its shapes in every frame shape and at any Columns.
      The rows are cut into bands (Band height rows each) and each band is
      slid sideways by its own amount (Slip): the glitch.
   3. Inks: the field is cut into Steps levels of about equal share. The
      lowest ones (Ground x Steps of them) show the ground; the others take
      the inks in turn, in an order of their own for every variation, so
      neighbouring levels make thin contour rings.
   4. Blobs: round patches of the second color laid over the field (Blobs
      sets how much they cover, Blob size how big they are). They aren't
      slipped. Stray cells: single cells in a random color of the palette,
      over everything (Stray cells sets how many).
   5. Animation: the view drifts once round a small circle. The field and
      the blobs drift with it (the field mostly up and down, as it is
      stretched), so cells step through the levels while the bands, stray
      cells and grid hold still. Steady speed all the way round; seamless;
      Amount 0 holds everything still.
   ========================================================================== */
(() => {
  const { hash } = PL.rng;

  // Ground, blobs, then the field inks. The default look's colors first.
  const PALETTES = [
    { name: 'Fern', colors: ['#F7FBF1', '#1ED001', '#1FAB46', '#2DCD8E', '#99EAEE', '#161616'] },
    { name: 'Ember', colors: ['#FBF4EA', '#FF5A1F', '#B8321E', '#FFB13B', '#F4D3A6', '#171211'] },
    { name: 'Lagoon', colors: ['#F1F7FA', '#2E5BFF', '#173C8C', '#36B6F0', '#A9DCF7', '#0F141C'] },
    { name: 'Candy', colors: ['#FFF4F8', '#FF3D9A', '#8A4DFF', '#FF9CCB', '#FFD76A', '#1B1320'] },
    { name: 'Triad', colors: ['#F6F5EF', '#C952A8', '#0095B5', '#E2CC47', '#EFCBE2', '#101D21'] }, // triad 340/100/220: blobs, two inks, a tint of the blobs; grid lines a deep shade
    { name: 'Reef', colors: ['#EEF7F6', '#EF675A', '#007176', '#41C1BA', '#F5C5B4', '#031A1E'] },
    { name: 'Plum', colors: ['#FAF5FF', '#8A3FFC', '#4B1D8F', '#D18BFF', '#FFB3D9', '#170F22'] },
    { name: 'Citrus', colors: ['#FFFBEA', '#FFB000', '#F05A28', '#FFE066', '#9BE15D', '#1A1712'] },
    { name: 'Mono', colors: ['#F3F3F0', '#E8432E', '#2A2A2A', '#7C7C7C', '#BEBEBE', '#121212'] },
    { name: 'Berry', colors: ['#FEF1F6', '#C5256D', '#60194E', '#EE8AB2', '#FCD1DC', '#EEB154', '#1F111A'] },
  ];

  /* ---- color roles -------------------------------------------------------------------- */
  const roles = (n) => ['Ground', 'Blobs', ...Array.from({ length: n - 2 }, (_, i) => (n === 3 ? 'Ink' : 'Ink ' + (i + 1)))];
  const spec = (n) => ({ ramp: 1, accents: Math.max(1, n - 1) });
  const isLight = (hex) => PL.color.luminance(hex) > 0.35;

  // "New colors": a pale ground (now and then a deep one), a vivid blob color, then inks in
  // neighbouring hues, light, mid and deep by turns, the last one near-black (on a deep
  // ground: near-white) for the darkest level and the grid lines.
  function generate(n, rng) {
    const C = PL.color;
    const dark = rng.chance(0.12);
    const hb = rng.float(0, 360);
    const out = [
      dark ? C.lch(rng.float(0.16, 0.21), rng.float(0.01, 0.03), hb) : C.lch(rng.float(0.965, 0.985), rng.float(0.01, 0.03), hb),
      C.lch(dark ? rng.float(0.82, 0.9) : rng.float(0.66, 0.78), rng.float(0.2, 0.27), hb),
    ];
    const m = n - 2;
    const Ls = [0.56, 0.78, 0.89];
    const off = rng.int(0, 2);
    for (let i = 0; i < m; i++) {
      if (i === m - 1 && m >= 2) {
        out.push(dark ? C.lch(rng.float(0.93, 0.96), rng.float(0.01, 0.03), hb) : C.lch(rng.float(0.16, 0.2), rng.float(0, 0.01), hb));
        continue;
      }
      const L = Ls[(i + off) % 3] + rng.float(-0.04, 0.04);
      out.push(C.lch(L, L > 0.85 ? rng.float(0.06, 0.1) : rng.float(0.13, 0.2), hb + rng.sign() * rng.float(25, 75))); // near the blobs' hue, never on it
    }

  }

  // + adds an ink in a hue the palette doesn't have yet.
  function add(colors) {
    const C = PL.color;
    const c = colors.slice();
    const hues = c.slice(1).filter((x) => C.hexToLch(x)[1] > 0.04).map((x) => C.hexToLch(x)[2]);
    let best = 0, bd = -1;
    for (let h = 0; h < 360; h += 10) {
      const d = hues.length ? Math.min(...hues.map((x) => Math.abs((((h - x) % 360) + 540) % 360 - 180))) : 180;
      if (d > bd) { bd = d; best = h; }

    return c;
  }

  function fit(colors, n) {
    let c = (colors || []).map(PL.color.normHex).filter(Boolean);
    if (!c.length) c = PALETTES[0].colors.slice();
    if (c.length === 1) c.push(PL.color.mix(c[0], isLight(c[0]) ? '#000000' : '#FFFFFF', 0.85));
    if (c.length >= n) return c.slice(0, n);
