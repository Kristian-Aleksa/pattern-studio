          const wu = K.aR * env * Math.sin(Math.PI * 2 * (v * fR + 0.35 * pu)); // shift along u, waving along v
          const wv = K.aR * env * Math.sin(Math.PI * 2 * (u * fR + 0.35 * pv));
          dx += wu * ct - wv * st;
          dy += wu * st + wv * ct;
        }
        Dx[k] = dx; Dy[k] = dy;
      }
    }
    const out = { Dx, Dy, cx, cy, c, m };
    if (warpCache.size > 8) warpCache.delete(warpCache.keys().next().value);
    warpCache.set(key, out);
    return out;
  }

  // Catmull-Rom weights.
  function crw(t, w) {
    const t2 = t * t, t3 = t2 * t;
    w[0] = -0.5 * t3 + t2 - 0.5 * t;
    w[1] = 1.5 * t3 - 2.5 * t2 + 1;
    w[2] = -1.5 * t3 + 2 * t2 + 0.5 * t;
    w[3] = 0.5 * t3 - 0.5 * t2;
  }

  /* ---- the field on the contour grid (cached) ---------------------------------- */
  // The frame (aw x ah, units of L), or with o (General's Rotation and Size) the part of the world from
  // (o.x, o.y), o.w x o.h: the centres stay where they are and the field runs on past the frame.
  const fieldCache = new Map();
  function fieldGrid(aw, ah, nx, ny, seed, p, o) {
    const ox = o ? o.x : 0, oy = o ? o.y : 0, rw = o ? o.w : aw, rh = o ? o.h : ah, zc = o ? Math.min(1, o.z) : 1;
    const key = [aw.toFixed(4), ah.toFixed(4), nx, ny, seed, p.centres, p.pull, p.push, p.count, p.kind, p.amount, p.detail, ox, oy, rw, rh, zc].join('|');
    const hit = fieldCache.get(key);
    if (hit) return hit;
    const P = (K.per * 16) / Math.max(1, p.count);
    const cs = centresFor(aw, ah, seed, p, P);
    const Wg = warpGrid(rw, rh, seed, p.kind, p.detail, ox, oy, zc);
    const A = p.amount / 100;
    const gx = rw / nx, gy = rh / ny;
    // Precompute the bicubic taps for every column and row.
    const colI = new Int32Array(nx + 1), colW = new Float64Array((nx + 1) * 4);
    const rowI = new Int32Array(ny + 1), rowW = new Float64Array((ny + 1) * 4);
    const w4 = [0, 0, 0, 0];
    for (let i = 0; i <= nx; i++) {
      const u = (i * gx) / Wg.c + Wg.m, i0 = Math.floor(u);
      colI[i] = i0 - 1; crw(u - i0, w4); colW.set(w4, i * 4);
    }
    for (let j = 0; j <= ny; j++) {
      const v = (j * gy) / Wg.c + Wg.m, j0 = Math.floor(v);
      rowI[j] = j0 - 1; crw(v - j0, w4); rowW.set(w4, j * 4);
    }
    const phi = new Float64Array((nx + 1) * (ny + 1));
    const stride = Wg.cx + 1, Dx = Wg.Dx, Dy = Wg.Dy;
    const nC = cs.length;
    const CX = cs.map((c) => c.x), CY = cs.map((c) => c.y), CM = cs.map((c) => c.m), CA = cs.map((c) => c.a), B = K.accel;
    // The field's value at the main centre: stripes are widest there and tighten with distance.
    let F0 = 0;
    const G = K.dense - 1, us = G / (2 * B); // g'(u) = 1 + G * tanh(|u| / us)
    for (let c = 0; c < nC; c++) { const ex = CX[0] - CX[c], ey = CY[0] - CY[c], a = CA[c]; F0 += CM[c] * (Math.sqrt(ex * ex + ey * ey + a * a) - a); }
    let lo = Infinity, hi = -Infinity;
    for (let j = 0; j <= ny; j++) {
      const y = oy + j * gy, rI = rowI[j], rw4 = j * 4;
      for (let i = 0; i <= nx; i++) {
        const x = ox + i * gx, cI = colI[i], cw = i * 4;
        let dx = 0, dy = 0;
        if (A > 0) {
          for (let b = 0; b < 4; b++) {
            const wy = rowW[rw4 + b], base = (rI + b) * stride + cI;
            const w0 = colW[cw], w1 = colW[cw + 1], w2 = colW[cw + 2], w3 = colW[cw + 3];
            dx += wy * (Dx[base] * w0 + Dx[base + 1] * w1 + Dx[base + 2] * w2 + Dx[base + 3] * w3);
            dy += wy * (Dy[base] * w0 + Dy[base + 1] * w1 + Dy[base + 2] * w2 + Dy[base + 3] * w3);
          }
        }
        const qx = x + A * dx, qy = y + A * dy;
        let f = 0;
        for (let c = 0; c < nC; c++) {
          const ex = qx - CX[c], ey = qy - CY[c], a = CA[c];
          f += CM[c] * (Math.sqrt(ex * ex + ey * ey + a * a) - a);
        }
        const u = f - F0, au = Math.min(40, Math.abs(u) / us);
        const v = (u + Math.sign(u) * G * us * (au + Math.log1p(Math.exp(-2 * au)) - Math.LN2)) / P; // g(u) = integral of 1 + G * tanh
        phi[j * (nx + 1) + i] = v;
        if (v < lo) lo = v;
        if (v > hi) hi = v;
      }
    }
    const out = { phi, lo, hi, centres: cs, P };
    if (fieldCache.size > 6) fieldCache.delete(fieldCache.keys().next().value);
    fieldCache.set(key, out);
    return out;
  }

  /* ---- band contours ------------------------------------------------------------
     Stripes are the bands where frac(phi) < w. Every band boundary is a contour
     line at level k (lower edge) or k + w (upper edge) of the bilinear surface
     through the grid values. Lower edges run with phi > level on their right,
     upper edges the other way, and lines that leave the frame are closed along
     its edge, so filling all loops with the nonzero rule paints exactly the
     bands, holes and all. Level index q: 2k = level k, 2k + 1 = level k + w.   */
  // (ox, oy): the grid's top-left corner (the frame: 0, 0); W x H: its size
  function bandContours(phi, nx, ny, W, H, w, shift, ox = 0, oy = 0) {
    const lv = (q) => (q >> 1) + (q & 1 ? w : 0);
    const qLo = (x) => { const k = Math.floor(x), fr = x - k; return fr === 0 ? 2 * k : fr <= w ? 2 * k + 1 : 2 * k + 2; };
    const qHi = (x) => { const k = Math.floor(x), fr = x - k; return fr > w ? 2 * k + 1 : fr > 0 ? 2 * k : 2 * k - 1; };
    const sx = W / nx, sy = H / ny, row = nx + 1;
    const V = (i, j) => phi[j * row + i] + shift;
    // Edges: horizontal (i, j)-(i+1, j) first, then vertical (i, j)-(i, j+1).
    const nH = nx * (ny + 1), nE = nH + row * ny;
    const off = new Int32Array(nE + 1), q0 = new Int32Array(nE);
    let M = 0;
    for (let e = 0; e < nE; e++) {
      let a, b;
      if (e < nH) { const j = (e / nx) | 0, i = e - j * nx; a = V(i, j); b = V(i + 1, j); }
      else { const r = e - nH, j = (r / row) | 0, i = r - j * row; a = V(i, j); b = V(i, j + 1); }
      off[e] = M;
      if (a === b) { q0[e] = 0; continue; }
      const lo = Math.min(a, b), hi = Math.max(a, b);
      const ql = qLo(lo), qh = qHi(hi);
      q0[e] = ql;
      if (qh >= ql) M += qh - ql + 1;
    }
    off[nE] = M;
    const X = new Float64Array(M), Y = new Float64Array(M), nq = new Int32Array(M), ne = new Int32Array(M);
    for (let e = 0; e < nE; e++) {
      const cnt = off[e + 1] - off[e];
      if (!cnt) continue;
      let ax, ay, bx, by, a, b;
      if (e < nH) { const j = (e / nx) | 0, i = e - j * nx; a = V(i, j); b = V(i + 1, j); ax = ox + i * sx; ay = oy + j * sy; bx = ax + sx; by = ay; }
      else { const r = e - nH, j = (r / row) | 0, i = r - j * row; a = V(i, j); b = V(i, j + 1); ax = ox + i * sx; ay = oy + j * sy; bx = ax; by = ay + sy; }
      for (let k = 0; k < cnt; k++) {
        const n = off[e] + k, q = q0[e] + k, t = (lv(q) - a) / (b - a);
        X[n] = ax + (bx - ax) * t; Y[n] = ay + (by - ay) * t; nq[n] = q; ne[n] = e;
      }
    }
    const next = new Int32Array(M).fill(-1), hasPrev = new Uint8Array(M);
    // One contour segment through a cell, from edge ea to edge eb (reversed for upper edges).
    const seg = (ea, eb, q) => {
      let s = off[ea] + (q - q0[ea]), t = off[eb] + (q - q0[eb]);
      if (q & 1) { const z = s; s = t; t = z; }
      next[s] = t; hasPrev[t] = 1;
    };
    for (let j = 0; j < ny; j++) {
      for (let i = 0; i < nx; i++) {
        const v0 = V(i, j), v1 = V(i + 1, j), v2 = V(i + 1, j + 1), v3 = V(i, j + 1);
        const lo = Math.min(v0, v1, v2, v3), hi = Math.max(v0, v1, v2, v3);
        if (lo === hi) continue;
        const ql = qLo(lo), qh = qHi(hi);
        if (qh < ql) continue;
        const eT = j * nx + i, eB = (j + 1) * nx + i, eL = nH + j * row + i, eR = eL + 1;
        for (let q = ql; q <= qh; q++) {
          const l = lv(q);
          const code = (v0 > l ? 8 : 0) | (v1 > l ? 4 : 0) | (v2 > l ? 2 : 0) | (v3 > l ? 1 : 0);
          switch (code) {
            case 8: seg(eT, eL, q); break;
            case 4: seg(eR, eT, q); break;
            case 2: seg(eB, eR, q); break;
            case 1: seg(eL, eB, q); break;
            case 7: seg(eL, eT, q); break;
            case 11: seg(eT, eR, q); break;
            case 13: seg(eR, eB, q); break;
            case 14: seg(eB, eL, q); break;
            case 12: seg(eR, eL, q); break;
            case 6: seg(eB, eT, q); break;
            case 3: seg(eL, eR, q); break;
            case 9: seg(eT, eB, q); break;
            case 10: if ((v0 + v1 + v2 + v3) / 4 > l) { seg(eT, eR, q); seg(eB, eL, q); } else { seg(eT, eL, q); seg(eB, eR, q); } break;
            case 5: if ((v0 + v1 + v2 + v3) / 4 > l) { seg(eL, eT, q); seg(eR, eB, q); } else { seg(eR, eT, q); seg(eL, eB, q); } break;
          }
        }
      }
    }
    // Trace: open pieces start on the frame edge (no predecessor); the rest are closed loops.
    const seen = new Uint8Array(M);
    const loops = [], loopQ = [];
    const open = new Map(); // level -> [{ pts, s0, s1 }]
    const per = (n) => { // position along the frame edge, clockwise from the top-left corner
      const e = ne[n];
      if (e < nH) return e < nx ? X[n] - ox : W + H + (W - (X[n] - ox));
      const r = e - nH, i = r % row;
      return i === nx ? W + (Y[n] - oy) : 2 * W + H + (H - (Y[n] - oy));
    };
    for (let n = 0; n < M; n++) {
      if (seen[n] || next[n] < 0 || hasPrev[n]) continue;
      const pts = [];
      let c = n, end = n;
      while (c >= 0 && !seen[c]) { seen[c] = 1; pts.push(X[c], Y[c]); end = c; c = next[c]; }
      const q = nq[n];
      if (!open.has(q)) open.set(q, []);
      open.get(q).push({ pts, s0: per(n), s1: per(end) });
    }
    for (let n = 0; n < M; n++) {
      if (seen[n] || next[n] < 0) continue;
      const pts = [];
      let c = n;
      while (c >= 0 && !seen[c]) { seen[c] = 1; pts.push(X[c], Y[c]); c = next[c]; }
      if (pts.length >= 6) { loops.push(pts); loopQ.push(nq[n]); }
    }
    // Close open pieces along the frame edge: clockwise for lower edges, anticlockwise for upper.
    const P4 = 2 * (W + H);
    const corners = [[0, ox, oy], [W, ox + W, oy], [W + H, ox + W, oy + H], [2 * W + H, ox, oy + H]];
    for (const [q, pieces] of open) {
      const cw = !(q & 1);
      const used = new Uint8Array(pieces.length);
      for (let s = 0; s < pieces.length; s++) {
        if (used[s]) continue;
        const pts = [];
        let cur = s, guard = 0;
        while (!used[cur] && guard++ < pieces.length + 2) {
          used[cur] = 1;
          const pc = pieces[cur];
          for (let k = 0; k < pc.pts.length; k++) pts.push(pc.pts[k]);
          // the next piece start along the edge in the walking direction
          let best = -1, bd = Infinity;
          for (let t = 0; t < pieces.length; t++) {
            const d = cw ? (pieces[t].s0 - pc.s1 + P4) % P4 : (pc.s1 - pieces[t].s0 + P4) % P4;
            if (d < bd && (t === s || !used[t])) { bd = d; best = t; }
          }
          if (best < 0) break;
          // corners passed on the way
          const from = pc.s1;
          const cs = corners.map((c) => [cw ? (c[0] - from + P4) % P4 : (from - c[0] + P4) % P4, c[1], c[2]]).filter((c) => c[0] > 0 && c[0] < bd).sort((a, b) => a[0] - b[0]);
          for (const c of cs) pts.push(c[1], c[2]);
          cur = best;
        }
        if (pts.length >= 6) { loops.push(pts); loopQ.push(q); }
      }
    }
    // Levels that never touch the frame edge but have it on their high side add the frame itself.
    let gLo = Infinity, gHi = -Infinity;
    for (let k = 0; k < phi.length; k++) { const v = phi[k] + shift; if (v < gLo) gLo = v; if (v > gHi) gHi = v; }
    const vEdge = V(0, 0);
    for (let q = 2 * Math.floor(gLo); q <= qHi(gHi); q++) {
      if (open.has(q) || !(vEdge > lv(q))) continue;
      loops.push(q & 1 ? [ox, oy, ox, oy + H, ox + W, oy + H, ox + W, oy] : [ox, oy, ox + W, oy, ox + W, oy + H, ox, oy + H]);
      loopQ.push(q);
    }
    return { loops, loopQ, crossings: M };
  }

  // Contour grid for a W x H render. The preview passes crisp: false.
  function gridFor(W, H, crisp) {
    let cell = crisp === false ? Math.max(K.cellPx, Math.max(W, H) / 520) : K.cellPxOut;
    if ((W / cell) * (H / cell) > K.maxCells) cell = Math.sqrt((W * H) / K.maxCells);
    return [Math.max(8, Math.round(W / cell)), Math.max(8, Math.round(H / cell))];
  }

  // Ramer-Douglas-Peucker on a closed loop (flat [x, y, ...]); keeps at least 3 points.
  function simplify(pts, tol) {
    const n = pts.length >> 1;
    if (n < 8) return pts;
    const keep = new Uint8Array(n);
    const t2 = tol * tol;
    // split the loop at its first point and the point farthest from it
    let far = 0, fd = -1;
    for (let i = 1; i < n; i++) { const d = (pts[2 * i] - pts[0]) ** 2 + (pts[2 * i + 1] - pts[1]) ** 2; if (d > fd) { fd = d; far = i; } }
    keep[0] = keep[far] = 1;
    const stack = [0, far, far, n];
    while (stack.length) {
      const b = stack.pop(), a = stack.pop();
      const ax = pts[2 * a], ay = pts[2 * a + 1], bi = b % n, bx = pts[2 * bi], by = pts[2 * bi + 1];
      const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy || 1e-12;
      let best = -1, bd = t2;
      for (let i = a + 1; i < b; i++) {
        const px = pts[2 * i] - ax, py = pts[2 * i + 1] - ay;
        const cr = px * dy - py * dx, d = (cr * cr) / len2;
        if (d > bd) { bd = d; best = i; }
      }
      if (best >= 0) { keep[best] = 1; stack.push(a, best, best, b); }
    }
    const out = [];
    for (let i = 0; i < n; i++) if (keep[i]) out.push(pts[2 * i], pts[2 * i + 1]);
    return out.length >= 6 ? out : pts;
  }

  /* ---- build ------------------------------------------------------------------- */
  // region (General's Rotation and Size): the part of the world to cover, its contour grid as fine on the
  // screen as the frame's (z: screen pixels per frame unit there).
  function build({ W, H, seed, p, colors, t = 0, anim, crisp, region }) {
    const n = colors.length;
    const scene = new PL.Scene(W, H, colors[0], 0);
    const L = Math.max(W, H), aw = W / L, ah = H / L;
    const R = region, z = R ? R.z || 1 : 1;
    const RW = R ? R.x1 - R.x0 : W, RH = R ? R.y1 - R.y0 : H;
    // Contour grid: about cellPx pixels per cell, within a budget.
    const [nx, ny] = R ? gridFor(RW * z, RH * z, crisp) : gridFor(W, H, crisp);
    const F = fieldGrid(aw, ah, nx, ny, seed, p, R ? { x: R.x0 / L, y: R.y0 / L, w: RW / L, h: RH / L, z } : undefined);
    // The loop moves whole color cycles (one stripe of each ink), so it ends where it began.
    const inks = Math.max(1, n - 1);
    const amt = Math.max(0, anim ? anim.amount : 0);
    const flow = Math.round(amt * 1.67) * inks * t;
    const w = Math.min(0.98, Math.max(0.02, p.weight / 100));
    const { loops, loopQ } = R ? bandContours(F.phi, nx, ny, RW, RH, w, flow, R.x0, R.y0) : bandContours(F.phi, nx, ny, W, H, w, flow);
    const layers = [];
    for (let k = 0; k < inks; k++) layers.push(scene.layer('stripes-' + (k + 1), colors[k + 1] || colors[0], inks > 1 ? `Stripes ${k + 1}` : 'Stripes', k + 1));
    const tol = crisp === false ? 0 : K.simplify / z;
    for (let i = 0; i < loops.length; i++) {
      const band = loopQ[i] >> 1;
      layers[((band % inks) + inks) % inks].p.push(tol > 0 ? simplify(loops[i], tol) : loops[i]);
    }
    return scene;
  }

  PL.tools.register({
    id: 'whorl',
    name: 'Whorl',
    kind: 'Backgrounds',
    tagline: 'Warped op-art',
    about: 'Stripes bend around invisible centres into rings, eyes and saddles, then a smooth, turbulent or rippled warp bends them further. Flat color, crisp vector edges.',
    inks: {
      min: 2, max: 6, roles, fit, spec, add, generate,
      span: () => 2, // Invert swaps the ground and the stripes
      hint: 'The first color is the ground; the others are the stripes, taking turns.',
    },
    palettes: PALETTES,
    params: PARAMS,
    defaults: {
      anim: { amount: 0.6, fps: 12, frames: 36 },
      fx: {},
    },
    build,
    zoom: true, // draws any region of its world (General's Rotation and Size)
    _K: K,
    _clear: () => { warpCache.clear(); fieldCache.clear(); },
    _field: (aw, ah, nx, ny, seed, p) => fieldGrid(aw, ah, nx, ny, seed, p),
    _grid: gridFor,
  });
})();
/* ==========================================================================
   tools/splice.js — Splice: cut-up riso.

   1. Field: one field of soft hills (fractal noise), banded into Steps inks.
   2. Cut: the frame is cut into columns, rows or blocks. Every piece prints
      the field slid along by its own amount (Shift) in its own inks, and most
      pieces (Mix) print through a screen: round dots, mountain lines or an
      ordered pixel mosaic. A screen spreads each step into the next, so the
      bands melt into each other in dots, lines or blocks.
   3. Outlines: the key ink (the first color) traces a contour line through
      the middle of every step. Lines thicken where the hills flatten out.
   4. Arcs: thin circular arcs in the inks run across the whole frame.
   5. Grain: a fine riso mottle in every ink.
   6. Animation: the field drifts slowly in one direction behind the cuts,
      screens and arcs, which stay put. Over a loop every hill drifts one
      stride and melts into the one that followed it, so the loop is seamless.
   General's Size and Rotation show more or less of the same world: the
   frame's cuts carry on past it at the same spacing (one piece: no cuts at
   all), every piece past the frame with its own screen, inks and slide, and
   arcs of their own (never a repeat); the mottle stays as fine at any Size.
   ========================================================================== */
(() => {
  const { hash } = PL.rng;

  // The key (outline) ink first, then the print inks.
  const PALETTES = [
    { name: 'Night', colors: ['#191919', '#FF2879', '#8B0051', '#ECC4F1', '#DABCE7', '#24148E', '#4064F6'] },
    { name: 'Sunset', colors: ['#1C111A', '#FC3162', '#FF574B', '#CA9874', '#F9CD6E', '#D4DBC2'] },
    { name: 'Mint', colors: ['#14211C', '#00A88F', '#7FE0C2', '#F4F1E4', '#FFB238', '#E8505B'] },
    { name: 'Cobalt', colors: ['#121426', '#2747D9', '#7FA4FF', '#F2EEE3', '#FF6B4A', '#FFD3C2'] },
    { name: 'Citrus', colors: ['#1E1A12', '#FFC933', '#FF7A1A', '#F6EFD8', '#8DC63F', '#2E7D5B'] },
    { name: 'Grape', colors: ['#1A1023', '#7B3FE4', '#C9A7FF', '#FF5FA2', '#FFE3F0', '#3A1A6B'] },
    { name: 'Lagoon', colors: ['#0E1D24', '#00B2C9', '#A6EEF5', '#F5F0E6', '#FF8C69', '#0B5D73'] },

    { name: 'Mono', colors: ['#141414', '#4A4A4A', '#8F8F8F', '#CFCFCF', '#F2F2F0'] },

  const roles = (n) => ['Key', ...Array.from({ length: n - 1 }, (_, i) => 'Ink ' + (i + 2))];
  const spec = (n) => ({ ramp: Math.min(3, n), accents: Math.max(0, n - 3) });

  // "New colors": riso sets: a near-black key, two vivid inks, a deep one and two pale ones.
  function generate(n, rng) {
    const C = PL.color;
    const h = rng.float(0, 360);
    const key = C.lch(rng.float(0.15, 0.2), rng.float(0.01, 0.04), h + rng.float(-40, 40));
    const pool = [
      C.lch(rng.float(0.62, 0.7), rng.float(0.2, 0.25), h),                       // vivid
      C.lch(rng.float(0.55, 0.68), rng.float(0.17, 0.24), h + rng.pick([120, 150, 180, 210])), // vivid, across the wheel
      C.lch(rng.float(0.3, 0.4), rng.float(0.12, 0.18), h + rng.float(-30, 30)),  // deep
      C.lch(rng.float(0.88, 0.94), rng.float(0.03, 0.07), h + rng.float(-40, 40)), // pale
      C.lch(rng.float(0.82, 0.9), rng.float(0.05, 0.1), h + rng.pick([90, 180, 270])), // pale, another hue
      C.lch(rng.float(0.74, 0.84), rng.float(0.12, 0.18), h + rng.float(40, 80)),  // bright
      C.lch(rng.float(0.45, 0.55), rng.float(0.15, 0.21), h + rng.float(200, 260)),
    ];
    const out = [key];
    for (let i = 0; out.length < n; i++) out.push(i < pool.length ? pool[i] : C.lch(rng.float(0.4, 0.9), rng.float(0.08, 0.22), rng.float(0, 360)));
    return out.slice(0, n);
  }

  // + adds an ink that stands apart from the others in hue and lightness.
  function add(colors) {
    const C = PL.color;
    const c = colors.slice();
    const hs = c.slice(1).map((x) => C.hexToLch(x)[2]);
    let best = 0, bd = -1;
    for (let k = 0; k < 24; k++) {
      const hh = k * 15;
      const d = hs.length ? Math.min(...hs.map((x) => Math.abs((((hh - x) % 360) + 540) % 360 - 180))) : 180;
      if (d > bd) { bd = d; best = hh; }
    }
    c.push(C.lch(c.length % 2 ? 0.66 : 0.86, c.length % 2 ? 0.2 : 0.08, best));
    return c;
  }

  function fit(colors, n) {
    let c = (colors || []).map(PL.color.normHex).filter(Boolean);
    if (!c.length) c = PALETTES[0].colors.slice();
    if (c.length > n) return c.slice(0, n);
    while (c.length < n) c = add(c);
    return c;
  }

  const S = (section, key, label, min, max, def, extra = {}) => ({ section, key, label, type: 'range', min, max, def, step: 1, ...extra });
  const PARAMS = [
    { section: 'Cut', key: 'into', label: 'Into', type: 'seg', def: 'columns', rand: false,
      options: [{ value: 'columns', label: 'Columns' }, { value: 'rows', label: 'Rows' }, { value: 'blocks', label: 'Blocks' }] },
    S('Cut', 'pieces', 'Pieces', 1, 32, 1, { rand: false, hint: 'How many pieces the frame is cut into' }),
    S('Cut', 'shift', 'Shift', 0, 100, 35, { unit: '%', rand: [20, 55], hint: 'How far each piece slides the field along its cut' }),
    S('Field', 'scale', 'Scale', 0, 100, 50, { unit: '%', rand: [35, 65], hint: 'Size of the hills' }),
    S('Field', 'steps', 'Steps', 2, 14, 5, { rand: false, hint: 'How many ink bands the hills are cut into' }),
    S('Field', 'outlines', 'Outlines', 0, 100, 40, { unit: '%', rand: [25, 55], hint: 'Weight of the contour lines in the key ink' }),
    S('Screen', 'size', 'Size', 0, 100, 40, { unit: '%', rand: [30, 55], hint: 'Size of the dots, lines and pixels' }),
    S('Screen', 'mix', 'Mix', 0, 100, 70, { unit: '%', rand: [55, 90], hint: 'How many pieces print through a screen (the rest print flat)' }),
    S('Screen', 'grain', 'Grain', 0, 100, 18, { unit: '%', rand: false, hint: 'Riso mottle in the inks' }),
    S('Arcs', 'arcs', 'Arcs', 0, 12, 5, { rand: [3, 7], hint: 'Thin arcs across the frame' }),
    S('Arcs', 'weight', 'Weight', 0, 100, 45, { unit: '%', rand: false, hint: 'Arc line weight' }),
    S('Arcs', 'bend', 'Bend', 0, 100, 55, { unit: '%', rand: [40, 70], hint: 'From straight lines to tight curves' }),
  ];

  // Shape constants: lengths in units of the frame's long edge (L).
  const K = {
    // field
    lam0: 0.2, lamK: 0.0065, // widest hills: lam0 + lamK * Scale (x L)
    oct: 5, gain: 0.55, warp: 0.25,
    band: 1.45,       // step width in standard deviations of the field (5 steps or fewer)
    cells: 7,         // field samples per finest wavelength
    // cut
    vary: 0.9,        // piece sizes vary by up to this much
    shift: 0.7,       // a piece slides up to Shift * this (x L)
    // screens
    p0: 0.006, pK: 0.00033, // screen period: p0 + pK * Size (x L)
    mults: [0.4, 0.7, 1, 1.35], multW: [0.12, 0.25, 0.33, 0.3],
    lineK: 1, pixK: 1, // lines and pixels relative to the dot pitch
    amp: [0.65, 0.85, 0.92], // how far each screen (dots, lines, pixels) spreads a step into its neighbours (in steps)
    // outlines
    out0: 0.006, outK: 0.1, // half-width of an outline in steps: out0 + outK * Outlines^1.2
    // arcs
    arcR: [4, 0.22],  // radius from Bend 0 to 100 (x L)
    arcLen: [0.45, 1.3],
    arcW0: 0.0006, arcWK: 0.005, // arc width: arcW0 + arcWK * Weight (x L)
    // grain
    grainRes: 900,    // grain cells across L
    grainA: 0.3,      // brightness swing at Grain 100 %
    // animation
    drift: 0.2,       // the field drifts Amount * this per loop (x L)
  };

  /* ---- layout: pieces, their screens, inks and slides ------------------------ */
  const layoutCache = new Map();
  function layoutFor(aw, ah, seed, p) {
    const key = [aw.toFixed(4), ah.toFixed(4), seed, p.into, p.pieces, p.shift, p.mix, p.size].join('|');
    const hit = layoutCache.get(key);
    if (hit) return hit;
    const r = PL.rng.create((seed ^ 0x2f6b9a13) >>> 0);
    const N = Math.max(1, Math.round(p.pieces));
    // n parts over [a, b] with varied sizes
    const split = (n, a, b) => {
      const w = [];
      for (let k = 0; k < n; k++) w.push(1 - K.vary / 2 + K.vary * r.next());
      const sum = w.reduce((x, y) => x + y, 0);
      const out = [a];
      let acc = 0;
      for (let k = 0; k < n; k++) { acc += w[k]; out.push(k === n - 1 ? b : a + ((b - a) * acc) / sum); }
      return out;
    };
    const rects = [];
    let C = 0, counts = null; // blocks: the columns and the blocks in each
    if (p.into === 'rows') {
      const ys = split(N, 0, ah);
      for (let k = 0; k < N; k++) rects.push([0, ys[k], aw, ys[k + 1], 'x']);
    } else if (p.into === 'blocks') {
      C = Math.max(1, Math.min(N, Math.round(Math.sqrt(1.5 * N * (aw / ah)))));
      counts = Array(C).fill(Math.floor(N / C));
      for (let k = 0; k < N - C * Math.floor(N / C); k++) counts[(k * 7 + Math.floor(r.next() * C)) % C]++;
      const xs = split(C, 0, aw);
      for (let c = 0; c < C; c++) {
        const ys = split(counts[c], 0, ah);
        for (let k = 0; k < counts[c]; k++) rects.push([xs[c], ys[k], xs[c + 1], ys[k + 1], 'xy']);
      }
    } else {
      const xs = split(N, 0, aw);
      for (let k = 0; k < N; k++) rects.push([xs[k], 0, xs[k + 1], ah, 'y']);
    }
    const base = K.p0 + K.pK * p.size;
    let prev = '';
    const pieces = rects.map(([x0, y0, x1, y1, axis]) => {
      const q = pieceProps(r, axis, prev, N, base, p);
      prev = q.screen;
      return Object.assign({ x0, y0, x1, y1 }, q);
    });
    const out = { pieces, dir: hash(seed, 5, 3, 0xd21f7) * Math.PI * 2, C, counts };
    if (layoutCache.size > 24) layoutCache.delete(layoutCache.keys().next().value);
    layoutCache.set(key, out);
    return out;
  }
  // A piece's screen, inks and slide, from r. Mix: the share of pieces that print through a screen;
  // neighbours (prev: the one before) rarely repeat one.
  const KINDS = ['dots', 'lines', 'pixels'];
  function pieceProps(r, axis, prev, N, base, p) {
    let screen = 'flat';
    const u0 = r.next(), u1 = r.next();
    if (u0 < p.mix / 100) {
      screen = KINDS[Math.floor(u1 * 3) % 3];
      if (screen === prev && r.next() < 0.7) screen = KINDS[(KINDS.indexOf(screen) + 1 + Math.floor(r.next() * 2)) % 3];
    }
    let u = r.next(), mult = K.mults[K.mults.length - 1];
    for (let k = 0; k < K.mults.length; k++) { if (u < K.multW[k]) { mult = K.mults[k]; break; } u -= K.multW[k]; }
    const period = base * mult * (screen === 'lines' ? K.lineK : screen === 'pixels' ? K.pixK : 1);
    // Slide: columns slide up or down, rows sideways, blocks any way.
    const mag = (N > 1 ? (p.shift / 100) * K.shift : 0) * (0.35 + 0.65 * r.next()) * (r.next() < 0.5 ? -1 : 1);
    const ang = r.next() * Math.PI * 2;
    const off = axis === 'x' ? [mag, 0] : axis === 'y' ? [0, mag] : [mag * Math.cos(ang), mag * Math.sin(ang)];
    return { screen, period, phase: [r.next(), r.next()], off, inkU: r.next(), inkDir: r.next() < 0.5 ? 1 : -1 };
  }

  // The world's pieces over a part of it, R (L units; General's Size and Rotation). The frame's cuts
  // carry on past it at the same spacing, the frame's outer pieces reaching on past its edges to the
  // next cut (so the frame's edges are no cuts); every piece past the frame takes its own screen, inks
  // and slide from its own hashes. One piece: no cuts at all, the frame's piece everywhere.
  function worldPieces(aw, ah, seed, p, R) {
    const lay = layoutFor(aw, ah, seed, p), fp = lay.pieces;
    const N = Math.max(1, Math.round(p.pieces));
    const at = (pc, x0, y0, x1, y1) => Object.assign({}, pc, { x0, y0, x1, y1, sx0: pc.x0, sy0: pc.y0 }); // (sx0, sy0: its screen's seed, the frame's)
    if (N === 1) return [at(fp[0], -Infinity, -Infinity, Infinity, Infinity)];
    const base = K.p0 + K.pK * p.size;
    const rngOf = (a, b) => PL.rng.create((Math.imul(seed | 0, 0x7feb352d) ^ Math.imul(a, 0x9e3779b1) ^ Math.imul(b, 0x85ebca77) ^ 0x2f6b9a13) >>> 0);
    const raw = (a, b) => { const r = rngOf(a, b), u0 = r.next(), u1 = r.next(); return u0 < p.mix / 100 ? KINDS[Math.floor(u1 * 3) % 3] : 'flat'; };
    // the cuts along one axis over [lo, hi]: the frame's (fc: 0 .. len; null for a strip that misses
    // the frame) carried on both ways, typ apart give or take Vary; strips numbered from the frame's first
    const strips = (fc, typ, lo, hi, salt) => {
      const step = (k) => typ * (1 - K.vary / 2 + K.vary * hash(seed, k, salt, 0x5b1));
      const n = fc ? fc.length - 1 : 0, len = fc ? fc[n] : 0;
      // the frame's outer strips reach past its edges by a share of a step (a strip off the frame: its
      // first cut anywhere within a step of 0)
      const left = fc ? -step(-1) * (0.15 + 0.85 * hash(seed, -1, salt, 0x5b2)) : -step(-1) * hash(seed, -1, salt, 0x5b2);
      const right = fc ? len + step(n) * (0.15 + 0.85 * hash(seed, n, salt, 0x5b2)) : left;
      const out = [];
      if (fc) for (let k = 0; k < n; k++) out.push({ k, a: k ? fc[k] : left, b: k < n - 1 ? fc[k + 1] : right });
      // on to the right, then to the left
      for (let k = n, a = right; a < hi && k < n + 4096; k++) { const b = a + step(k); if (b > lo) out.push({ k, a, b }); a = b; }
      for (let k = -1, b = left; b > lo && k > -4096; k--) { const a = b - step(k); if (a < hi) out.push({ k, a, b }); b = a; }
      return out.filter((q) => q.b > lo && q.a < hi);
    };
    const out = [];
    // a piece: the frame's own (own) or one of the world's (kx, ky: its strip and block numbers; prev:
    // the piece before it, the frame's own or one of the world's)
    const piece = (own, kx, ky, axis, x0, y0, x1, y1, prevOwn, pkx, pky) => {
      if (own) return out.push(at(own, x0, y0, x1, y1));
      const q = pieceProps(rngOf(kx, ky), axis, prevOwn ? prevOwn.screen : raw(pkx, pky), N, base, p);
      out.push(Object.assign(q, { x0, y0, x1, y1, sx0: 7.7 + 0.0131 * kx, sy0: 3.3 + 0.0173 * ky }));
    };
    if (p.into === 'rows') {
      const fc = fp.map((pc) => pc.y0).concat([fp[N - 1].y1]);
      for (const q of strips(fc, ah / N, R.y0, R.y1, 0x71)) piece(q.k >= 0 && q.k < N ? fp[q.k] : null, 0, q.k, 'x', -Infinity, q.a, Infinity, q.b, q.k === N ? fp[N - 1] : null, 0, q.k - 1);
    } else if (p.into === 'blocks') {
      const { C, counts } = lay;
      const firsts = counts.map((_, c) => counts.slice(0, c).reduce((a, b) => a + b, 0));
      const xc = firsts.map((i) => fp[i].x0).concat([fp[N - 1].x1]);
      for (const q of strips(xc, aw / C, R.x0, R.x1, 0x72)) {
        const own = q.k >= 0 && q.k < C;
        const cnt = own ? counts[q.k] : Math.max(1, Math.floor(N / C) + (hash(seed, q.k, 0x73, 0x5b3) < (N % C) / C ? 1 : 0));
        const yc = own ? fp.slice(firsts[q.k], firsts[q.k] + cnt).map((pc) => pc.y0).concat([ah]) : null;
        for (const v of strips(yc, ah / cnt, R.y0, R.y1, 0x9000 + q.k)) {
          piece(own && v.k >= 0 && v.k < cnt ? fp[firsts[q.k] + v.k] : null, q.k, v.k, 'xy', q.a, v.a, q.b, v.b, own && v.k === cnt ? fp[firsts[q.k] + cnt - 1] : null, q.k, v.k - 1);
        }
      }
    } else {
      const fc = fp.map((pc) => pc.x0).concat([fp[N - 1].x1]);
      for (const q of strips(fc, aw / N, R.x0, R.x1, 0x70)) piece(q.k >= 0 && q.k < N ? fp[q.k] : null, q.k, 0, 'y', q.a, -Infinity, q.b, Infinity, q.k === N ? fp[N - 1] : null, q.k - 1, 0);
    }
    return out;
  }

  // Each piece's inks: a run of neighbouring palette inks, starting anywhere and running
  // either way round the palette, one ink per step (wrapping round if there are more steps).
  function rampFor(piece, n, S) {
    const start = Math.floor(piece.inkU * n) % n, dir = piece.inkDir;
    return Int32Array.from({ length: S }, (_, k) => (((start + dir * k) % n) + n) % n);
  }

  // Round dots: the share of a screen cell a circle of radius r (r^2 indexed, cell units)
  // covers, so a dot's area grows in step with the field; past touching, the gaps shrink to stars.
  const DOT = (() => {
    const n = 1024, t = new Float32Array(n + 1);
    for (let k = 0; k <= n; k++) {
      const r2 = (k / n) * 0.5, r = Math.sqrt(r2);
      let a = Math.PI * r2;
      if (r > 0.5) a -= 4 * (r2 * Math.acos(0.5 / r) - 0.5 * Math.sqrt(r2 - 0.25));
      t[k] = 1 - Math.min(1, a);
    }
    return t;
  })();

  /* ---- the field ----------------------------------------------------------------
     Samples of the (standardised) field on a lattice of G points per L, shared by
     every piece, frame and export size. The lattice is computed in 32 x 32 tiles on
     demand and cached, so sliding a piece (Shift) or animating reuses what's there. */
  const TILE = 32;
  const statCache = new Map(), tileCache = new Map(), rhoCache = new Map();
  const fieldFn = (seed, scale) => {
    const N = PL.noise.get((seed ^ 0x6c8e9cf5) >>> 0);
    const f0 = 1 / (K.lam0 + K.lamK * scale);
    return (x, y) => {
      const u = x * f0, v = y * f0;
      const wx = N.fbm4(u * 0.9 + 31.7, v * 0.9 - 12.9, 4.1, 0, 2, 0.5), wy = N.fbm4(u * 0.9 - 17.3, v * 0.9 + 25.1, 7.3, 0, 2, 0.5);
      return N.fbm4(u + K.warp * wx, v + K.warp * wy, 0.37, 0, K.oct, K.gain);
    };
  };
  const gridRes = (scale) => {
    const finest = (K.lam0 + K.lamK * scale) / 2 ** (K.oct - 1);
    return Math.max(80, Math.min(420, Math.round(K.cells / finest)));
  };
  // Mean and spread of the field, so every piece and every export bands it the same way.
  function stats(seed, scale) {
    const key = seed + '|' + scale;
    let s = statCache.get(key);
    if (s) return s;
    const F = fieldFn(seed, scale), r = PL.rng.create(0x51a7);
    const M = 1200, xs = new Float64Array(M), ys = new Float64Array(M), vs = new Float64Array(M);
    let m = 0;
    for (let i = 0; i < M; i++) { xs[i] = r.float(-0.5, 1.5); ys[i] = r.float(-0.5, 1.5); vs[i] = F(xs[i], ys[i]); m += vs[i]; }
    m /= M;
    let v = 0;
    for (let i = 0; i < M; i++) v += (vs[i] - m) ** 2;
    s = { mu: m, sd: Math.sqrt(v / M) || 1, xs, ys, vs, F, G: gridRes(scale) };
    if (statCache.size > 16) statCache.delete(statCache.keys().next().value);
    statCache.set(key, s);
    return s;
  }
  // How alike the field is to itself one drift stride away (keeps the loop's contrast steady).
  function rhoAt(st, seed, scale, vx, vy) {
    const key = [seed, scale, vx.toFixed(5), vy.toFixed(5)].join('|');
    let r = rhoCache.get(key);
    if (r !== undefined) return r;
    let acc = 0;
    for (let i = 0; i < 300; i++) acc += ((st.vs[i] - st.mu) / st.sd) * ((st.F(st.xs[i] + vx, st.ys[i] + vy) - st.mu) / st.sd);
    r = Math.max(-0.5, Math.min(0.99, acc / 300));
    if (rhoCache.size > 32) rhoCache.delete(rhoCache.keys().next().value);
    rhoCache.set(key, r);
    return r;
  }
  function tile(st, seed, scale, ti, tj) {
    const key = seed + '|' + scale + '|' + ti + '|' + tj;
    let t = tileCache.get(key);
    if (t) { tileCache.delete(key); tileCache.set(key, t); return t; } // most recently used last
    const { F, mu, sd, G } = st, inv = 1 / sd;
    t = new Float32Array(TILE * TILE);
    for (let j = 0; j < TILE; j++) {
      const y = (tj * TILE + j) / G;
      for (let i = 0; i < TILE; i++) t[j * TILE + i] = (F((ti * TILE + i) / G, y) - mu) * inv;
    }
    if (tileCache.size > 900) tileCache.delete(tileCache.keys().next().value);
    tileCache.set(key, t);
    return t;
  }
  // The lattice over a window [wx0, wx1] x [wy0, wy1] (in L), with a margin for bicubic taps.
  // It's assembled in a scratch buffer that the next piece reuses.
  let gridBuf = new Float32Array(1 << 16), blendBuf = new Float32Array(1 << 16);
  function grid(st, seed, scale, wx0, wy0, wx1, wy1) {
    const G = st.G;
    const i0 = Math.floor(wx0 * G) - 2, j0 = Math.floor(wy0 * G) - 2, i1 = Math.ceil(wx1 * G) + 3, j1 = Math.ceil(wy1 * G) + 3;
    const gw = i1 - i0 + 1, gh = j1 - j0 + 1;
    if (gridBuf.length < gw * gh) gridBuf = new Float32Array(gw * gh * 1.25);
    const z = gridBuf;
    const ti0 = Math.floor(i0 / TILE), ti1 = Math.floor(i1 / TILE), tj0 = Math.floor(j0 / TILE), tj1 = Math.floor(j1 / TILE);
    for (let tj = tj0; tj <= tj1; tj++) {
      for (let ti = ti0; ti <= ti1; ti++) {
        const t = tile(st, seed, scale, ti, tj);
        const ia = Math.max(i0, ti * TILE), ib = Math.min(i1, ti * TILE + TILE - 1);
        const ja = Math.max(j0, tj * TILE), jb = Math.min(j1, tj * TILE + TILE - 1);
        for (let j = ja; j <= jb; j++) {
          const src = (j - tj * TILE) * TILE + (ia - ti * TILE);
          z.set(t.subarray(src, src + (ib - ia + 1)), (j - j0) * gw + (ia - i0));
        }
      }
    }
    return { z, i0, j0, gw, gh, G };
  }

  // A fine riso mottle: 256 x 256 levels (0-31), tiled.
  const GRAIN = (() => {
    const r = PL.rng.create(0x9a17), n = 256, a = new Float32Array(n * n), out = new Uint8Array(n * n);
    for (let k = 0; k < n * n; k++) a[k] = r.next();
    // a touch of clumping: blend each value with its neighbours
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const k = y * n + x, s = (a[k] * 2 + a[y * n + ((x + 1) & 255)] + a[((y + 1) & 255) * n + x]) / 4;
      out[k] = Math.max(0, Math.min(31, Math.round((s - 0.5) * 2.4 * 15.5 + 15.5)));
    }
    return out;
  })();

  /* ---- arcs ------------------------------------------------------------------------ */
  function arcsFor(aw, ah, seed, p, n) {
    const out = [];
    const bend = p.bend / 100;
    for (let i = 0; i < Math.round(p.arcs); i++) {
      const h = (k) => hash(seed, i, k, 0xa2c5);
      const R = K.arcR[0] * Math.pow(K.arcR[1] / K.arcR[0], Math.pow(bend, 0.8)) * (0.7 + 0.6 * h(1));
      const px = aw * (0.1 + 0.8 * h(2)), py = ah * (0.1 + 0.8 * h(3));
      const tang = h(4) * Math.PI * 2, side = h(5) < 0.5 ? -1 : 1;
      const cx = px - Math.sin(tang) * R * side, cy = py + Math.cos(tang) * R * side;
      const len = K.arcLen[0] + (K.arcLen[1] - K.arcLen[0]) * h(6);
      const sweep = Math.min(Math.PI * 1.8, len / R), at = Math.atan2(py - cy, px - cx), u = h(7);
      out.push({ cx, cy, R, a0: at - sweep * u, a1: at + sweep * (1 - u), ink: Math.floor(h(8) * n) % n, w: 0.8 + 0.4 * h(9) });
    }
    return out;
  }

  // The world's arcs over a part of it, R (L units; General's Size and Rotation): the frame's own, and past
  // it frame-sized tiles with arcs of their own (their own seeds). A tile's arc that would cross the
  // frame is left out, so the frame keeps just its own arcs at any Size.
  function worldArcs(aw, ah, seed, p, n, R) {

  const S = (section, key, label, min, max, def, extra = {}) => ({ section, key, label, type: 'range', min, max, def, step: 1, ...extra });
  const KINDS = [
    { value: 'ring', label: '○', title: 'Rings' },
    { value: 'arrow', label: '▲', title: 'Arrowheads' },
    { value: 'cross', label: '×', title: 'Crosses' },

    { value: 'arc', label: '◡', title: 'Arcs' },

  const PARAMS = [
    S('Field', 'fscale', 'Field scale', 0.2, 6, 1.9, { step: 0.05, rand: [1.3, 2.6], hint: 'Size of the swirls: higher packs more turns into the frame' }),
    S('Field', 'turn', 'Turn', 0, 500, 190, { unit: '%', rand: [130, 250], hint: 'How far the flow swings from place to place' }),
    S('Field', 'detail', 'Detail', 1, 6, 3, { rand: [2, 4], hint: 'Layers of finer swirls in the flow' }),
    S('Field', 'curl', 'Curl', 0, 100, 45, { unit: '%', rand: [25, 65], hint: 'Mixes in a broader swirl that bends the flow into hooks and loops' }),
    S('Field', 'tangle', 'Tangle', 0, 100, 0, { unit: '%', rand: false, hint: 'Lets every strand wander off on its own' }),
    S('Strands', 'bundles', 'Bundles', 1, 80, 26, { rand: [16, 34], hint: 'How many bundles of strands' }),

    S('Strands', 'spread', 'Bundle spread', 0, 20, 4, { unit: '%', step: 0.5, rand: [2.5, 6], hint: 'How widely the strands of a bundle start apart' }),

    S('Strands', 'step', 'Step', 1, 8, 3.4, { step: 0.1, rand: false, hint: 'Length of each step (in thousandths of the frame)' }),
    S('Line', 'weight', 'Weight', 0.2, 6, 1.6, { step: 0.1, rand: [1.1, 2.2], hint: 'Strand weight (in thousandths of the frame)' }),
    S('Line', 'wvar', 'Weight variation', 0, 100, 60, { unit: '%', rand: false, hint: 'How much strand weights differ' }),
    S('Line', 'hierarchy', 'Hierarchy', 0, 100, 55, { unit: '%', rand: false, hint: 'A few heavier lead strands in each bundle' }),
    S('Line', 'hairlines', 'Hairlines', 0, 100, 22, { unit: '%', rand: false, hint: 'Share of faint hairline strands in the palest strand ink' }),
    { section: 'Marks', key: 'style', label: 'Style', type: 'seg', def: 'along', rand: false,

  // Constants. Lengths are in thousandths of the frame's long edge unless noted.
  const K = {
    box: 0.12,          // strands are traced this far beyond the frame (x L)
    turnK: 1.15,        // direction swing: Turn x this x pi x noise
    freqK: 2.5,         // the noise runs at this / Field scale cycles per L
    curlF: 0.6,         // the curl noise's frequency relative to the main one
    curlA: 1,           // the curl noise's swing at 100 % (x pi)
    gain: 0.3,          // each finer layer of detail swings this much less
    gridK: 24,          // field samples per cycle of its finest detail
    aniso: 1.5,         // the noise is stretched this much along the flow's overall heading
    heading: 1,         // 1: every seed flows its own way overall (0: left to right)
    tangleA: [1.4, 0.55], tangleF: [3.5, 14], // tangle: two wander angles (radians at 100 %) and their frequencies (per L)
    cluster: 0.09,      // a clustered bundle starts this far (sd, x L) from an earlier one
    tries: 4,           // candidate starts per bundle (the one whose strands stay longest in the frame wins)
    goal: 0.85,         // ... or the first that keeps this share of Length in the frame
    spreadSd: 0.55,     // strands start Bundle spread x this (sd) from the bundle centre
    hair: [0.33, 0.6],  // hairline weight (x Weight)
    wMid: 1.15,         // typical strand weight (x Weight)
    lead: [1.45, 2.15], // lead strands are this much heavier
    leadP: 0.35,        // share of lead strands at Hierarchy 100 %
    inkW: 1.7,          // the first strand ink is this much more common than the others
    markRate: 0.1,      // marks per step at Symbols 100 % (more downstream: x (1 + 3 s) / 2.5)
    ring: 0.35, arrow: 0.8, cross: 1.1, tick: 0.92, arc: 0.36, // mark sizes (x Size)
    arcSpan: 200, arcTurn: 1, // arcs span this many degrees, their closed side this many radians off the strand
    markW: 0.16,        // mark line weight (x Size)
    dashK: 0.425,       // a moving strand's visible run: Amount x this of its path
    cyclesK: 2.5,       // runs per loop: Amount x this (at least 1)
    simplify: 0.12,     // static strands drop points within this many px of the line
    passes: [4, 8],     // strand and mark layers come in this many interleaved passes
  };

  /* ---- the field: a cached grid of directions ------------------------------------
     The direction at each point is an angle: Turn x pi x a smooth noise whose swirls
     are about Field scale x L across, plus (Curl) a second, broader noise that bends
     the flow round into loops and hooks. Both are smooth, so strands never kink.     */
  // o (General's Rotation and Size): the part of the world from (o.x, o.y), o.w x o.h (units of L), read
  // as finely on the screen as the frame (o.z: screen pixels per frame unit there)
  const fieldCache = new Map();
  function fieldGrid(aw, ah, seed, p, o) {
    const fs = Math.max(0.05, p.fscale), oct = Math.max(1, Math.round(p.detail));
    const key = [aw.toFixed(4), ah.toFixed(4), seed, fs, p.turn, oct, p.curl, K.aniso, K.heading, K.freqK, K.gain, K.turnK, o ? [o.x, o.y, o.w, o.h, o.z].join(',') : ''].join('|');
    const hit = fieldCache.get(key);
    if (hit) return hit;
    const f1 = K.freqK / fs, f2 = f1 * K.curlF;
    let R = Math.max(64, Math.min(400, Math.round(K.gridK * f1 * 2 ** (oct - 1))));
    if (o) R = Math.max(16, R * Math.min(1, o.z));
    const x0 = (o ? o.x : 0) - K.box - 2 / R, y0 = (o ? o.y : 0) - K.box - 2 / R;
    const nx = Math.ceil(((o ? o.w : aw) + 2 * K.box) * R) + 4, ny = Math.ceil(((o ? o.h : ah) + 2 * K.box) * R) + 4;
    const row = nx + 1, n = row * (ny + 1);
    const NA = PL.noise.get((seed ^ 0x2c1b3c6d) >>> 0), NB = PL.noise.get((seed ^ 0x297a2d39) >>> 0);
    const T = (p.turn / 100) * K.turnK * Math.PI, Cc = (p.curl / 100) * K.curlA * Math.PI;
    const dx = new Float32Array(n), dy = new Float32Array(n);
    // the flow's overall heading, and the noise stretched along it (so strands gather more than they turn)
    const h0 = K.heading ? hash(seed, 0x6ead) * Math.PI * 2 : 0, ch = Math.cos(h0), sh = Math.sin(h0);
    const sa = 1 / K.aniso, sb = K.aniso;
    for (let j = 0; j <= ny; j++) {
      const y = y0 + j / R;
      for (let i = 0; i <= nx; i++) {
        const x = x0 + i / R, k = j * row + i;
        const ax = (x * ch + y * sh) * sa, by = (-x * sh + y * ch) * sb;
        let a = h0 + T * NA.fbm4(ax * f1 + 3.1, by * f1 - 7.7, 0.5, 0, oct, K.gain);
        if (Cc) a += Cc * NB.fbm4(ax * f2 + 11.1, by * f2 + 2.3, 1.5, 0, 2, 0.5);
        dx[k] = Math.cos(a); dy[k] = Math.sin(a);
      }
    }
    const out = { dx, dy, x0, y0, R, nx, ny, row };
    if (fieldCache.size > 6) fieldCache.delete(fieldCache.keys().next().value);
    fieldCache.set(key, out);
    return out;
  }

  /* ---- strands: traced once per field / strand settings, in units of L -------------- */
  // o (General's Rotation and Size): the part of the world to cover. The frame's bundles are traced as at
  // 100 % and their strands carry on past the frame; the world past it is laid out in frame-sized tiles,
  // each with bundles of its own (a seed of its own) in the same field, so zooming out shows more of it.
  const strandCache = new Map();
  const sampler = (G) => (x, y, out) => {
    const { dx, dy, x0, y0, R, nx, ny, row } = G;
    let gx = (x - x0) * R, gy = (y - y0) * R;
    gx = gx < 0 ? 0 : gx > nx - 1.001 ? nx - 1.001 : gx;
    gy = gy < 0 ? 0 : gy > ny - 1.001 ? ny - 1.001 : gy;
    const i = gx | 0, j = gy | 0, fx = gx - i, fy = gy - j, k = j * row + i;
    const a = dx[k] + (dx[k + 1] - dx[k]) * fx, b = dx[k + row] + (dx[k + row + 1] - dx[k + row]) * fx;
    const c = dy[k] + (dy[k + 1] - dy[k]) * fx, d = dy[k + row] + (dy[k + row + 1] - dy[k + row]) * fx;
    out[0] = a + (b - a) * fy; out[1] = c + (d - c) * fy;
  };
  function traceStrands(aw, ah, seed, p, o) {
    const key = [aw.toFixed(4), ah.toFixed(4), seed, p.fscale, p.turn, p.detail, p.curl, p.tangle, p.bundles, p.per, p.clustering, p.spread, p.length, p.step, o ? [o.x, o.y, o.w, o.h, o.z].join(',') : ''].join('|');
    const hit = strandCache.get(key);
    if (hit) return hit;
    const dirF = sampler(fieldGrid(aw, ah, seed, p));
    let dir = dirF;
    if (o) {
      // the frame's own field where the frame's strands are traced at 100 %, the region's past it
      const dirR = sampler(fieldGrid(aw, ah, seed, p, o));
      dir = (x, y, out) => (x >= -K.box && x <= aw + K.box && y >= -K.box && y <= ah + K.box ? dirF : dirR)(x, y, out);
    }

    const tile = (ti, tj) => {
      const own = ti === 0 && tj === 0, tx = ti * aw, ty = tj * ah;
      const tseed = own ? seed : (Math.imul(seed | 0, 0x7feb352d) ^ Math.imul(ti, 0x9e3779b1) ^ Math.imul(tj, 0x85ebca77)) | 0;
      const idBase = own ? 0 : 1e6 * (1 + (((ti + 512) & 1023) << 10 | ((tj + 512) & 1023)));
      tileStrands(aw, ah, tseed, p, dir, tx, ty, own, idBase, strands, o);
    };
    if (!o) tile(0, 0);
    else {
      for (let tj = Math.floor((o.y - K.box) / ah) - 1; tj <= Math.floor((o.y + o.h + K.box) / ah) + 1; tj++) {
        for (let ti = Math.floor((o.x - K.box) / aw) - 1; ti <= Math.floor((o.x + o.w + K.box) / aw) + 1; ti++) tile(ti, tj);
      }
    }
    const out = { strands, steps: Math.max(2, Math.round(p.length)) };
    if (strandCache.size > 6) strandCache.delete(strandCache.keys().next().value);
    strandCache.set(key, out);
    return out;
  }
  // One tile's bundles (the frame's own: tile 0, 0), its strands traced in dir and kept to the tile's
  // box (the frame's own and, with o, carried on through the region).
  function tileStrands(aw, ah, seed, p, dir, tx, ty, own, idBase, strands, o) {
    const r = PL.rng.create((seed ^ 0x5be0cd19) >>> 0);
    const gauss = () => { let u = 0, v = 0; while (u === 0) u = r.next(); v = r.next(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    const NT = PL.noise.get((seed ^ 0x1f83d9ab) >>> 0);
    const B = Math.max(1, Math.round(p.bundles)), N = Math.max(1, Math.round(p.per));
    const h = p.step / 1000, steps = Math.max(2, Math.round(p.length));
    const sd = (p.spread / 100) * K.spreadSd, tg = p.tangle / 100;
    const bx0 = tx - K.box, by0 = ty - K.box, bx1 = tx + aw + K.box, by1 = ty + ah + K.box;
    // where strands may run: the tile's box, or with o the region's (the frame's strands just carry on)
    const ex0 = o ? o.x - K.box : bx0, ey0 = o ? o.y - K.box : by0, ex1 = o ? o.x + o.w + K.box : bx1, ey1 = o ? o.y + o.h + K.box : by1;
    const centres = [];
    const d1 = [0, 0], d2 = [0, 0];
    const inF = (x, y) => x >= tx && x <= tx + aw && y >= ty && y <= ty + ah;
    // The share of Length that a strand traced from (x, y) spends in the frame.
    const score = (x, y) => {
      let n = 0;
      for (let k = 0; k < steps; k++) {
        dir(x, y, d1); let l = Math.hypot(d1[0], d1[1]) || 1;
        const mx = x + (d1[0] / l) * h * 0.5, my = y + (d1[1] / l) * h * 0.5;
        dir(mx, my, d2); l = Math.hypot(d2[0], d2[1]) || 1;
        x += (d2[0] / l) * h; y += (d2[1] / l) * h;
        if (x < bx0 || x > bx1 || y < by0 || y > by1) break;
        if (inF(x, y)) n++;
      }
      return n / steps;
    };
    const tries = Math.max(K.tries, Math.ceil(24 / B)); // with only a few bundles, look harder
    for (let b = 0; b < B; b++) {
      const anchor = centres.length && r.next() < p.clustering / 100 ? centres[Math.floor(r.next() * centres.length)] : null;
      // A few candidate starts (near an earlier bundle when clustering); keep the one whose
      // strands stay longest in the frame, so most strands run through it from the upstream side.
      let cx = 0, cy = 0, best = -1;
      for (let t = 0; t < tries; t++) {
        let x, y;
        if (anchor) { x = anchor[0] + gauss() * K.cluster; y = anchor[1] + gauss() * K.cluster; }
        else { x = tx + r.float(-0.08, aw + 0.08); y = ty + r.float(-0.08, ah + 0.08); }
        x = Math.max(bx0, Math.min(bx1, x)); y = Math.max(by0, Math.min(by1, y));
        const sc = score(x, y);
        if (sc > best) { best = sc; cx = x; cy = y; }
        if (sc >= K.goal) break;
      }
      centres.push([cx, cy]);
      const bw = Math.exp(0.15 * gauss()); // bundles differ a little in weight
      for (let s = 0; s < N; s++) {
        const id = idBase + b * N + s;
        const sx = cx + gauss() * sd, sy = cy + gauss() * sd;
        const ph1 = id * 7.31 + 0.5, ph2 = id * 3.17 + 41.3;
        const turnAt = (q) => tg * (K.tangleA[0] * NT.noise4(q * K.tangleF[0] + ph1, ph1, 0.3, 0) + K.tangleA[1] * NT.noise4(q * K.tangleF[1] + ph2, ph2, 2.1, 0));
        // Trace downstream (RK2) for Length steps or until the strand leaves the box.
        const pts = [sx, sy];
        let x = sx, y = sy, px = 0, py = 0, inBox = true, np0 = 0;
        for (let k = 0; k < steps; k++) {
          dir(x, y, d1);
          let l = Math.hypot(d1[0], d1[1]);
          if (l < 1e-6) { if (!k) break; d1[0] = px; d1[1] = py; l = 1; }
          let ux = d1[0] / l, uy = d1[1] / l;
          if (tg > 0) { const a = turnAt(k * h), ca = Math.cos(a), sa = Math.sin(a); const t = ux * ca - uy * sa; uy = ux * sa + uy * ca; ux = t; }
          dir(x + ux * h * 0.5, y + uy * h * 0.5, d2);
          l = Math.hypot(d2[0], d2[1]);
          let vx = l > 1e-6 ? d2[0] / l : ux, vy = l > 1e-6 ? d2[1] / l : uy;
          if (tg > 0) { const a = turnAt((k + 0.5) * h), ca = Math.cos(a), sa = Math.sin(a); const t = vx * ca - vy * sa; vy = vx * sa + vy * ca; vx = t; }
          x += vx * h; y += vy * h;
          px = vx; py = vy;
          if (x < ex0 || x > ex1 || y < ey0 || y > ey1) break;
          // (where it leaves the tile's own box: a moving strand runs only that far, as at 100 %)
          if (inBox && (x < bx0 || x > bx1 || y < by0 || y > by1)) { inBox = false; np0 = pts.length >> 1; }
          pts.push(x, y);
        }
        strands.push({ id, bundle: b, bw, pts: Float64Array.from(pts), np0: inBox ? pts.length >> 1 : np0 });
      }
    }
  }

  // Ramer-Douglas-Peucker on an open polyline (flat [x, y, ...]).
  function simplify(pts, tol) {
    const n = pts.length >> 1;
    if (n < 4 || tol <= 0) return Array.from(pts);
    const keep = new Uint8Array(n);
    keep[0] = keep[n - 1] = 1;
    const t2 = tol * tol, stack = [0, n - 1];
    while (stack.length) {
      const b = stack.pop(), a = stack.pop();
      const ax = pts[2 * a], ay = pts[2 * a + 1], dx = pts[2 * b] - ax, dy = pts[2 * b + 1] - ay, l2 = dx * dx + dy * dy || 1e-12;
      let best = -1, bd = t2;
      for (let i = a + 1; i < b; i++) {
        const cr = (pts[2 * i] - ax) * dy - (pts[2 * i + 1] - ay) * dx, d = (cr * cr) / l2;
        if (d > bd) { bd = d; best = i; }
      }
      if (best >= 0) { keep[best] = 1; stack.push(a, best, best, b); }
    }
    const out = [];
    for (let i = 0; i < n; i++) if (keep[i]) out.push(pts[2 * i], pts[2 * i + 1]);
    return out;
  }

  // The part of a polyline between arc lengths s0 and s1 (cumulative lengths in `cum`).
  function slice(pts, cum, s0, s1) {
    const n = cum.length;
    if (s1 <= s0 || n < 2) return null;
    const at = (s) => {
      let lo = 0, hi = n - 1;
      while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
      const f = (s - cum[lo]) / (cum[hi] - cum[lo] || 1);
      return [lo, pts[2 * lo] + (pts[2 * hi] - pts[2 * lo]) * f, pts[2 * lo + 1] + (pts[2 * hi + 1] - pts[2 * lo + 1]) * f];
    };
    const [i0, ax, ay] = at(s0), [i1, bx, by] = at(s1);
    const out = [ax, ay];
    for (let i = i0 + 1; i <= i1; i++) out.push(pts[2 * i], pts[2 * i + 1]);
    out.push(bx, by);
    return out;
  }

  /* ---- build ------------------------------------------------------------------------ */
  // region (General's Rotation and Size): the part of the world to cover (see traceStrands)
  function build({ W, H, seed, p, colors, t = 0, anim, crisp, region }) {
    const n = colors.length;
    const scene = new PL.Scene(W, H, colors[0], 0);
    const L = Math.max(W, H), aw = W / L, ah = H / L, u = L / 1000;
    const C = PL.color;
    const { m: ms, k: mk } = split(n);
    const strandInks = Array.from({ length: ms }, (_, i) => 1 + i);
    const markInks = mk ? Array.from({ length: mk }, (_, i) => 1 + ms + i) : strandInks.slice();
    const o = region ? { x: region.x0 / L, y: region.y0 / L, w: (region.x1 - region.x0) / L, h: (region.y1 - region.y0) / L, z: region.z || 1 } : undefined;
    const { strands, steps } = traceStrands(aw, ah, seed, p, o);
    const light = isLight(colors[0]);
    const [gl] = C.hexToLch(colors[0]);

    // Layers come in a few passes, so inks interleave (no ink sits on top of every other)
    // as they would if every strand and mark were drawn in turn. In each strand pass the
    // faintest ink is at the bottom; the other inks take turns on top.
    const contrast = (ci) => { const [l, c] = C.hexToLch(colors[ci]); return Math.abs(l - gl) + 0.6 * c; };
    const order = strandInks.slice().sort((a, b) => contrast(a) - contrast(b));
    // Moving strands run in the palette's brightest inks (the lightest ones on a dark ground).
    const pop = (ci) => { const [l, c] = C.hexToLch(colors[ci]); return light ? c + 0.15 * (1 - Math.abs(l - 0.7)) : l + 0.2 * c; };
    const bright = strandInks.slice().sort((a, b) => pop(b) - pop(a)).slice(0, 2);
    const SP = K.passes[0], MP = K.passes[1];
    const rot = (arr, k) => arr.map((_, i) => arr[(i + k) % arr.length]);
    const tag = (G, g) => (G > 1 ? ` · ${g + 1}` : '');
    const sLayers = [], mLayers = [], kLayers = [];
    for (let g = 0; g < SP; g++) {
      const ord = order.length > 2 ? [order[0], ...rot(order.slice(1), g)] : rot(order, g);
      const S = {}, M = {};
      for (const ci of ord) S[ci] = scene.layer(`strands-${ci}-${g}`, colors[ci], (ms > 1 ? `Strands ${ci}` : 'Strands') + tag(SP, g), ci);
      for (const ci of rot(bright, g)) M[ci] = scene.layer(`moving-${ci}-${g}`, colors[ci], (bright.length > 1 ? `Moving strands ${ci}` : 'Moving strands') + tag(SP, g), ci);
      sLayers.push(S); mLayers.push(M);
    }
    for (let g = 0; g < MP; g++) {
      const K2 = {};
      for (const ci of rot(markInks, g)) {
        K2[ci] = scene.layer(`marks-${ci}-${g}`, colors[ci], (mk > 1 ? `Marks ${ci - ms}` : 'Marks') + tag(MP, g), ci);
        K2[ci].cap = 'butt';
      }
      kLayers.push(K2);
    }

    const hairP = p.hairlines / 100, sv = 0.5 * (p.wvar / 100), leadP = K.leadP * (p.hierarchy / 100), moveP = p.moving / 100;
    const inkWeights = strandInks.map((_, i) => (i === 0 ? K.inkW : 1));
    const inkSum = inkWeights.reduce((a, b) => a + b, 0);
    const amt = Math.max(0, anim ? anim.amount : 0);
    const cycles = Math.max(1, Math.round(amt * K.cyclesK));
    const dashF = Math.min(0.75, Math.max(0.08, K.dashK * amt));
    const tt = ((t % 1) + 1) % 1;
    const fx0 = o ? o.x : 0, fy0 = o ? o.y : 0, fx1 = o ? o.x + o.w : aw, fy1 = o ? o.y + o.h : ah;
    const inFrame = (x, y, m) => x > fx0 - m && x < fx1 + m && y > fy0 - m && y < fy1 + m;

    const kinds = (Array.isArray(p.kinds) ? p.kinds : []).filter((x) => KINDS.some((q) => q.value === x));
    const rate = (p.symbols / 100) * K.markRate;
    const size = p.size, mw = K.markW * size * u;

      const pts = st.pts, np = pts.length >> 1;

      // weight and ink

      if (h(1) < hairP) {

      } else {

      }
      const wpx = w * u;
      const px = new Float64Array(pts.length);
      for (let i = 0; i < pts.length; i++) px[i] = pts[i] * L;
      const pass = Math.floor(h(10) * SP) % SP;
      if (amt > 0 && h(8) < moveP) {
        // A moving strand: only a run of it shows, travelling from its start to its end (the end of its
        // tile's box, as at 100 %).
        const nm = Math.max(2, Math.min(np, st.np0 || np));
        const cum = new Float64Array(nm);
        for (let i = 1; i < nm; i++) cum[i] = cum[i - 1] + Math.hypot(px[2 * i] - px[2 * i - 2], px[2 * i + 1] - px[2 * i - 1]);
        const P = cum[nm - 1], D = dashF * P, s0 = ((cycles * tt) % 1) * P;

        if (s0 + D > P) { const b = slice(px, cum, 0, s0 + D - P); if (b) PL.Scene.stroke(layer, b, wpx); }
      } else {
        PL.Scene.stroke(sLayers[pass][ci], simplify(px, (crisp === false ? 0.3 : K.simplify) / (o ? o.z : 1)), wpx); // (as fine on the screen when zoomed)
      }
      // Marks along the strand, more of them downstream.
      if (!kinds.length || rate <= 0) continue;
      for (let i = 1; i < np - 1; i++) {
        const q = hash(st.id, i, seed, 0x3a7c);
        if (q >= rate * (1 + (3 * i) / steps) / 2.5) continue;
        const x = pts[2 * i], y = pts[2 * i + 1];
        if (!inFrame(x, y, size / 1000)) continue;
        const r2 = (k) => hash(st.id * 977 + i, k, seed, 0x51ab);
        const kind = kinds[Math.floor(r2(1) * kinds.length) % kinds.length];
        const lay = kLayers[Math.floor(r2(6) * MP) % MP][markInks[Math.floor(r2(2) * markInks.length) % markInks.length]];
        const f = 0.6 + 0.8 * r2(3);
        let ang = Math.atan2(pts[2 * i + 3] - pts[2 * i - 1], pts[2 * i + 2] - pts[2 * i - 2]);
        let cx = x * L, cy = y * L;
        if (p.style === 'upright') ang = -Math.PI / 2;
        else if (p.style === 'scatter') {
          ang = r2(4) * Math.PI * 2;
          const off = (r2(5) - 0.5) * 2.2 * size * u;
          cx += -Math.sin(ang) * off; cy += Math.cos(ang) * off;
        }
        const ca = Math.cos(ang), sa = Math.sin(ang);
        if (kind === 'ring') {
          const rr = K.ring * size * f * u, ring = [];
          for (let k = 0; k < 20; k++) { const a = (k / 20) * Math.PI * 2; ring.push(cx + rr * Math.cos(a), cy + rr * Math.sin(a)); }
          PL.Scene.stroke(lay, ring, mw, true);
        } else if (kind === 'arrow') {
          const sd = K.arrow * size * f * u, hgt = sd * 0.866;
          // equilateral, centroid on the strand, pointing downstream (clockwise winding)
          const tip = [cx + ca * hgt * (2 / 3), cy + sa * hgt * (2 / 3)];
          const bxm = cx - ca * hgt / 3, bym = cy - sa * hgt / 3;
          lay.p.push([tip[0], tip[1], bxm - sa * sd / 2, bym + ca * sd / 2, bxm + sa * sd / 2, bym - ca * sd / 2]);
        } else if (kind === 'cross') {

            const c2 = Math.cos(ang + da) * l2, s2 = Math.sin(ang + da) * l2;
            PL.Scene.stroke(lay, [cx - c2, cy - s2, cx + c2, cy + s2], mw);
          }
        } else if (kind === 'tick') {
          const l2 = K.tick * size * f * u / 2;
          PL.Scene.stroke(lay, [cx - sa * l2, cy + ca * l2, cx + sa * l2, cy - ca * l2], mw);

          for (let k = 0; k <= 12; k++) { const a = mid - span / 2 + (span * k) / 12; arc.push(cx + rr * Math.cos(a), cy + rr * Math.sin(a)); }

    return scene;

  PL.tools.register({
    id: 'filament',
    name: 'Filament',
    kind: 'Backgrounds',
    tagline: 'Thread field',
    about: 'Streamlines traced through a noise field, bundled into ropes, with small glyph marks strung along them. Part of the strands run along their paths in the animation.',
    inks: {
      min: 2, max: 9, roles, fit, spec, add, generate,
      span: () => 1,
      hint: 'Ground first, then the strand inks (the last one draws the hairlines), then the mark inks.',
    },
    palettes: PALETTES,
    params: PARAMS,
    animLabel: 'Intensity',
    animHint: 'How long the moving strands are and how many times they run per loop (0: everything still)',
    defaults: {
      anim: { amount: 0.8, fps: 16, frames: 30 },
      fx: {},
      palette: 'Lagoon', // the preset the style opens on (its card's colors)
    },
    build,
    zoom: true, // draws any region of its world (General's Rotation and Size)
    _K: K,
    _clear: () => { fieldCache.clear(); strandCache.clear(); },
    _trace: traceStrands,

})();
/* ==========================================================================
   tools/stipple.js — Stipple: halftone dots read from a noise field.

   1. Grid: Resolution dots across the width, on a square or hex lattice. The
      field is read in units of the frame's width from the top-left corner, so
      a taller frame shows more of the same pattern below.
   2. Field: domain-warped fractal noise (Field scale, Warp, Detail). It is
      stretched so its lowest and highest values in the frame become 0 and 1,
      pulled part of the way towards an even balance, and pushed apart about
      the middle by Contrast, giving a value v from 0 to 1 at every dot. The
      dot inks split v into bands: the first ink holds the lowest band, the
      last the highest. Symmetry mirrors the field left to right (Mirror) or
      into four (Quad).
   3. Lattice mode: every dot whose v is above Cutout is drawn, sized like a
      halftone: bigger where v is higher (Size variation sets how much).
   4. Contour mode: dots gather where the field changes fastest, which is
      along the band edges. Each cell has its own fixed random number and
      draws a dot when that is below
         Loose scatter + Edge pull x (a little + steepness + closeness to an edge),
      so edges fill in while the open areas keep a loose scatter. Dots on
      steep ground are drawn bigger.
   5. Accent rate: that share of the dots (fixed cells) take the accent ink.
   6. Animation: one steady speed all the way round the loop, with no pauses.
      The field moves round a small loop through the noise (so its fine detail
      shifts in place and Contour dots blink), and a broad wave rolls across
      it, every place a little behind its neighbours, so somewhere a band edge
      is always moving: dots change color and, in Lattice mode, swell, shrink
      and blink at the Cutout edge. Both come back to where they started, so
      the loop is seamless. Intensity sets how far things move (0 = still).
   ========================================================================== */
(() => {
  const { hash } = PL.rng;

    { name: 'Lagoon', colors: ['#12BBDA', '#12D473', '#63F1C6', '#599EE7', '#FF8421'] },
    { name: 'Midnight', colors: ['#0B132B', '#12D473', '#63F1C6', '#599EE7', '#FFD166'] },
    { name: 'Terracotta', colors: ['#F7EDE0', '#502515', '#A54A28', '#D78951', '#EEC59E', '#008287'] }, // a 40-65 ramp from deep brown to peach, a 200 teal accent across the wheel
    { name: 'Tidepool', colors: ['#ECF8F8', '#003441', '#00717A', '#30B4AD', '#A0E1CE', '#EF6856'] }, // a 220-175 ramp from deep sea to mint, a 30 coral accent across the wheel
    { name: 'Ember', colors: ['#1A0F0A', '#E85D04', '#F48C06', '#FFBA08', '#F1F1F1'] },
    { name: 'Forest', colors: ['#0F1A14', '#2D6A4F', '#52B788', '#B7E4C7', '#F4A261'] },
    { name: 'Ultraviolet', colors: ['#100A2B', '#7209B7', '#F72585', '#4CC9F0', '#FFD60A'] },
    { name: 'Blush', colors: ['#FDE2E4', '#B5838D', '#E5989B', '#6D6875', '#2A9D8F'] },
    { name: 'Iris', colors: ['#F3F0FB', '#2B1E66', '#6741B1', '#AC78D2', '#DFBCE7', '#D5D637'] }, // a 285-320 ramp from indigo to lilac, a 110 lime accent across the wheel

  const nDots = (n) => Math.max(1, n - 2);

    }
    out.push(apart(pale ? rng.float(0.6, 0.68) : rng.float(0.76, 0.86), rng.float(0.16, 0.2), hd + 180 + rng.float(-35, 35)));

  }

  // + adds a dot ink just before the accent: a step further round the dot inks' hue family
  // (a gentle one, so the inks stay a family), at their typical lightness and chroma, kept
  // clear of the ground.
  function add(colors) {
    const C = PL.color;
    const c = colors.slice();
    const dots = c.slice(1, -1).map((x) => C.hexToLch(x));
    const last = dots[dots.length - 1] || C.hexToLch(c[0]);
    const prev = dots.length > 1 ? dots[dots.length - 2] : null;
    const dh = prev ? ((((last[2] - prev[2]) % 360) + 540) % 360) - 180 : 30;
    const step = Math.sign(dh || 1) * Math.max(18, Math.min(36, Math.abs(dh)));
    const meanL = dots.reduce((a, d) => a + d[0], 0) / Math.max(1, dots.length);
    const meanC = dots.reduce((a, d) => a + d[1], 0) / Math.max(1, dots.length);
    const G = C.hexToLch(c[0]);
    let L = meanL + (dots.length % 2 ? 0.07 : -0.07);
    if (Math.abs(L - G[0]) < 0.1) L = G[0] + (G[0] > 0.6 ? -0.12 : 0.12);
    c.splice(c.length - 1, 0, C.lch(Math.min(0.94, Math.max(0.28, L)), Math.max(0.08, meanC), last[2] + step));
    return c;
  }

  function fit(colors, n) {
    let c = (colors || []).map(PL.color.normHex).filter(Boolean);
    if (!c.length) c = PALETTES[0].colors.slice();
    if (c.length === 1) c.push(PL.color.mix(c[0], isLight(c[0]) ? '#000000' : '#FFFFFF', 0.8));
    if (c.length === 2) c.push(PL.color.lch(0.72, 0.18, PL.color.hexToLch(c[1])[2] + 180));
    if (c.length === n) return c;
    if (c.length > n) {
      // keep the ground and the accent; take the dot inks evenly from the ones given
      const dots = c.slice(1, -1), m = nDots(n);
      const pick = Array.from({ length: m }, (_, i) => dots[Math.round((i * (dots.length - 1)) / Math.max(1, m - 1))]);
      return [c[0], ...pick, c[c.length - 1]];
    }
    while (c.length < n) c = add(c);
    return c;
  }

  const S = (section, key, label, min, max, def, extra = {}) => ({ section, key, label, type: 'range', min, max, def, step: 1, ...extra });
  const contour = (p) => p.mode !== 'lattice';
  const PARAMS = [
    { section: 'Dots', key: 'mode', label: 'Mode', type: 'seg', def: 'lattice', rand: false,
      options: [{ value: 'contour', label: 'Contour' }, { value: 'lattice', label: 'Lattice' }] },
    { section: 'Dots', key: 'lattice', label: 'Lattice', type: 'seg', def: 'square', rand: false,
      options: [{ value: 'square', label: 'Square' }, { value: 'hex', label: 'Hex' }] },
    { section: 'Dots', key: 'shape', label: 'Shape', type: 'seg', def: 'circle', rand: false,
      options: [{ value: 'circle', label: 'Circle' }, { value: 'square', label: 'Square' }, { value: 'diamond', label: 'Diamond' }] },
    S('Dots', 'res', 'Resolution', 12, 220, 84, { rand: [56, 96], hint: 'Dots across the width' }),
    S('Dots', 'dotsize', 'Dot size', 10, 150, 62, { unit: '%', rand: [50, 80], hint: 'Largest dot, as a share of the grid spacing' }),
    S('Dots', 'sizevar', 'Size variation', 0, 100, 48, { unit: '%', rand: [40, 85], hint: 'How much smaller dots get where the field is weak' }),
    S('Dots', 'cutout', 'Cutout', 0, 100, 29, { unit: '%', rand: [22, 46], hint: 'Leaves out dots where the field is below this' }),
    S('Dots', 'jitter', 'Jitter', 0, 100, 0, { unit: '%', rand: false, hint: 'Nudges each dot off the grid' }),
    S('Dots', 'edge', 'Edge pull', 0, 100, 85, { unit: '%', rand: [60, 100], when: contour, hint: 'Gathers dots along the band edges' }),
    S('Dots', 'loose', 'Loose scatter', 0, 100, 12, { unit: '%', rand: [5, 30], when: contour, hint: 'Loose dots scattered away from the edges' }),
    S('Field', 'fscale', 'Field scale', 0.3, 8, 2.0, { step: 0.1, rand: [1.6, 3.4], hint: 'Higher packs more, smaller regions into the frame' }),
    S('Field', 'warp', 'Warp', 0, 200, 70, { unit: '%', rand: [40, 130], hint: 'Swirls the regions' }),
    S('Field', 'detail', 'Detail', 1, 6, 4, { rand: false, hint: 'Layers of finer detail along the edges' }),
    S('Field', 'contrast', 'Contrast', 50, 300, 130, { unit: '%', rand: [120, 200], hint: 'Pushes the field apart into clearer regions' }),
    { section: 'Field', key: 'symmetry', label: 'Symmetry', type: 'seg', def: 'off', rand: false,
      options: [{ value: 'off', label: 'Off' }, { value: 'mirror', label: 'Mirror' }, { value: 'quad', label: 'Quad' }] },
    S('Color', 'accent', 'Accent rate', 0, 30, 5.5, { unit: '%', step: 0.5, rand: [3, 9], hint: 'Share of dots in the accent ink' }),
  ];

  // Constants. Field units: the frame's width = 1.
  const K = {
    freq: 0.42,         // noise cycles per frame width at Field scale 1
    warpA: 1.3,         // warp displacement (noise units) at Warp 100 %
    warpF: 0.7,         // the warp noise's frequency relative to the field's
    normN: 64,          // the field's range is measured on a grid this many samples wide
    cgain: 0.7,         // Contrast 100 % scales the stretched field by this (about the middle)
    recenter: 0.6,      // share of the field's off-centre average that is taken out
    gain: 0.4,          // each finer octave of Detail is this much weaker
    bandC: 0.488, bandS: 0.87, // band edges: bandC + (k / m - 0.5) * bandS
    dw: 2.32,           // closeness to a band edge falls off over this many cells
    lp: 1.027,          // loose dots: Loose scatter x this
    b0: 0.034,          // edge dots: Edge pull x (b0 + bg x steepness + be x closeness to a band edge)
    bg: 0.822, be: 0.062, //   steepness = 1 - exp(-(|gradient| / gs) ^ gk), closeness = exp(-(d / dw) ^ q)
    gs: 7.3, gk: 1.32, q: 2,
    uw: 0.98,           // dot strength mixes steepness (this share) and closeness
    u0: 0.665, du: 0.305, // contour dot strength (sizes them like v in Lattice mode)
    loopR: 0.07,        // Intensity 1 moves the field round a loop this big through the noise
    driftA: 0.2,        // ... and rolls a wave this high (v units) across it,
    driftF: 0.5,        //   its phase map's frequency relative to the field's,
    phaseK: 25,         //   and how far (radians per unit of noise) the phase turns across the frame

    const cols = Math.max(1, Math.round(p.res));
    const hex = p.lattice === 'hex';
    const rows = Math.max(1, Math.round((cols * H) / W / (hex ? Math.sqrt(3) / 2 : 1)));
    return { cols, rows, hex, cw: W / cols, ch: H / rows };

     The still field (warped fbm) is read once per seed and field setting at every grid
     point, plus a step right and a step down for the gradient. The animation adds a
     broad, slowly turning wash of noise on top, so the band edges shift (dots change
     band and blink along them) while the field's texture stays put.                    */

      const k0 = cache.keys().next().value;
      cachedCells -= cache.get(k0).n;
      cache.delete(k0);
    }
    cachedCells += n;
  };
  // The grid points to read: the frame's, or (General's Rotation and Size) every one region R reaches; the
  // grid and the field run on past the frame (Symmetry folds about the frame's middle, out to any distance).
  function span(g, R) {
    if (!R) return { c0: 0, c1: g.cols, r0: 0, r1: g.rows };
    return { c0: Math.floor(R.x0 / g.cw) - 1, c1: Math.ceil(R.x1 / g.cw) + 1, r0: Math.floor(R.y0 / g.ch) - 1, r1: Math.ceil(R.y1 / g.ch) + 1 };

  // Grid points in field units (width = 1), folded for Symmetry.
  function points(W, H, g, p, sp) {
    const { hex } = g, nc = sp.c1 - sp.c0, n = nc * (sp.r1 - sp.r0), ah = H / W, sym = p.symmetry;
    const X = new Float32Array(n), Y = new Float32Array(n);
    for (let j = sp.r0; j < sp.r1; j++) {

    }
    return { X, Y };
  }
  function still(W, H, seed, p, R) {
    const g = grid(W, H, p), sp = span(g, R);
    const key = [seed, g.cols, g.rows, g.hex, (H / W).toFixed(5), p.symmetry, sp.c0, sp.c1, sp.r0, sp.r1].join('|');
    const hit = stillCache.get(key);
    if (hit) return hit;
    // (the grid spacing is kept in field units: the cache serves every size of this frame shape)
    const out = Object.assign(points(W, H, g, p, sp), { g, sp, n: (sp.c1 - sp.c0) * (sp.r1 - sp.r0), dx: g.cw / W, dy: g.ch / W });
    trim(stillCache, out.n, 8);
    stillCache.set(key, out);
    return out;
  }
  // The raw field (warped fbm) at a point; z, w move it through the noise for the loop.
  function rawField(seed, p) {
    const NV = PL.noise.get((seed ^ 0x3c6ef372) >>> 0), NW = PL.noise.get((seed ^ 0x510e527f) >>> 0);
    const oct = Math.max(1, Math.min(6, Math.round(p.detail)));
    const f = K.freq * Math.max(0.05, p.fscale), fw = f * K.warpF;
    const wa = K.warpA * (p.warp / 100);
    const fn = (x, y, z, w) => {
      let px = x * f, py = y * f;
      if (wa > 0) {
        px += wa * NW.fbm4(x * fw + 13.1, y * fw + 7.3, z, w, 2, 0.5);
        py += wa * NW.fbm4(x * fw - 5.9, y * fw + 21.4, z + 9.7, w + 4.1, 2, 0.5);
      }
      return NV.fbm4(px + 31.7, py - 17.3, z + 3.3, w - 6.1, oct, K.gain);

  // The field is stretched so its lowest and highest values across the frame (sampled on
  // a fixed grid, so Resolution doesn't move the bands) become 0 and 1.
  const rangeCache = new Map();
  function fieldRange(W, H, seed, p) {
    const ah = H / W;
    const key = [seed, ah.toFixed(5), p.fscale, p.warp, p.detail, p.symmetry, K.freq, K.warpA, K.warpF, K.gain, K.normN, K.recenter].join('|');
    const hit = rangeCache.get(key);
    if (hit) return hit;
    const { fn } = rawField(seed, p);
    const nx = K.normN, ny = Math.max(2, Math.min(4 * nx, Math.round(nx * ah)));
    let lo = Infinity, hi = -Infinity, sum = 0;
    for (let j = 0; j < ny; j++) {
      for (let i = 0; i < nx; i++) {
        let x = (i + 0.5) / nx, y = ((j + 0.5) / ny) * ah;
        if (p.symmetry === 'mirror' || p.symmetry === 'quad') x = 0.5 - Math.abs(x - 0.5);
        if (p.symmetry === 'quad') y = ah / 2 - Math.abs(y - ah / 2);
        const v = fn(x, y, 0, 0);
        sum += v;
        if (v < lo) lo = v;
        if (v > hi) hi = v;
      }
    }
    // ... and is pulled part of the way (recenter) towards having its average in the middle.
    const span = Math.max(1e-6, hi - lo), mean = (sum / (nx * ny) - lo) / span;
    const out = { lo, span, shift: K.recenter * (mean - 0.5) };

    rangeCache.set(key, out);

  // v (0..1) and the size of its gradient at every grid point, for one frame. Contrast
  // pushes v away from the middle. The animation runs at one steady speed: the field moves
  // round a small loop through the noise (so it shifts a little in place, and dots blink),
  // and a broad wave rolls across it, each place a little behind its neighbours (a phase
  // map from a second noise), so band edges are shifting somewhere at every moment.
  function field(W, H, seed, p, t, amt, R) {
    const P0 = still(W, H, seed, p, R);
    const A = Math.max(0, amt || 0);
    const ang = A > 0 ? 2 * Math.PI * (((t % 1) + 1) % 1) : 0;
    const key = [seed, P0.g.cols, P0.g.rows, P0.g.hex, (H / W).toFixed(5), p.fscale, p.warp, p.detail, p.contrast, p.symmetry, A.toFixed(4), ang.toFixed(5), P0.sp.c0, P0.sp.c1, P0.sp.r0, P0.sp.r1,
      K.loopR, K.driftA, K.driftF, K.phaseK, K.freq, K.warpA, K.warpF, K.cgain, K.gain, K.normN, K.recenter].join('|');
    const hit = frameCache.get(key);
    if (hit) return hit;
    const { X, Y, g, sp, n, dx, dy } = P0;
    const { fn, f } = rawField(seed, p);
    const { lo, span, shift } = fieldRange(W, H, seed, p);
    const ND = PL.noise.get((seed ^ 0x6a09e667) >>> 0);
    const C = K.cgain * (p.contrast / 100), fd = f * K.driftF;
    // Both are the same at every moment of the loop (only shifted along it), so the motion
    // never speeds up or slows down, and t = 1 brings everything back to t = 0.
    const rho = K.loopR * A, z = rho * (Math.cos(ang) - 1), w = rho * Math.sin(ang);
    const drift = K.driftA * A;
    const cl = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
    // The rolling wave moves v (the bands and, in Lattice mode, the dot sizes) but not the
    // steepness the Contour dots gather on: its ripples would add steepness of their own.
    const B = new Float32Array(n), V = new Float32Array(n), G = new Float32Array(n);
    for (let k = 0; k < n; k++) {
      const x = X[k], y = Y[k];
      const v = 0.5 + ((fn(x, y, z, w) - lo) / span - 0.5 - shift) * C;
      const r = drift > 0 ? drift * Math.sin(ang + K.phaseK * ND.noise4(x * fd, y * fd, 0.37, 0.71)) : 0;
      B[k] = cl(v); V[k] = cl(v + r);
