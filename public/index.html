    const h0 = rng.float(0, 360);
    const ground = dark ? C.lch(rng.float(0.16, 0.22), rng.float(0.005, 0.025), h0) : C.lch(rng.float(0.94, 0.97), rng.float(0.005, 0.02), h0 + 40);
    const out = [ground, dark ? C.lch(rng.float(0.93, 0.97), rng.float(0.02, 0.05), h0 + 150) : C.lch(rng.float(0.18, 0.25), rng.float(0.01, 0.04), h0)];
    const k = n - 2;
    const step = 360 / Math.max(1, k), start = rng.float(0, 360);
    for (let i = 0; i < k; i++) {
      const hue = start + i * step + rng.float(-step * 0.25, step * 0.25);
      const L = dark ? rng.float(0.62, 0.86) : rng.float(0.45, 0.68);
      out.push(C.lch(L, rng.float(0.13, 0.21), hue));
    }
    return out.slice(0, Math.max(2, n));
  }

  // + adds an ink in the hue the palette is missing most.
  function add(colors) {
    const C = PL.color;
    const c = colors.slice();
    const inks = c.slice(1).map(C.hexToLch);
    const med = (a) => a.slice().sort((x, y) => x - y)[a.length >> 1];
    const L = inks.length ? med(inks.map((x) => x[0])) : 0.75;
    const Ch = inks.length ? Math.max(0.1, med(inks.map((x) => x[1]))) : 0.16;
    const lab = c.map(C.hexToOklab);
    let best = null, bestD = -1;
    for (let hue = 0; hue < 360; hue += 10) {
      const hex = C.lch(L, Ch, hue), o = C.hexToOklab(hex);
      const d = Math.min(...lab.map((x) => Math.hypot(x[0] - o[0], x[1] - o[1], x[2] - o[2])));
      if (d > bestD) { bestD = d; best = hex; }
    }
    c.push(best);
    return c;
  }

  function fit(colors, n) {
    const C = PL.color;
    let c = (colors || []).map(C.normHex).filter(Boolean);
    if (!c.length) c = PALETTES[0].colors.slice();
    if (c.length === 1) c.push(C.mix(c[0], C.luminance(c[0]) > 0.35 ? '#000000' : '#FFFFFF', 0.85));
    if (c.length > n) return c.slice(0, n);
    while (c.length < n) c = add(c);
    return c;
  }

  const S = (section, key, label, min, max, def, extra = {}) => ({ section, key, label, type: 'range', min, max, def, step: 1, ...extra });

  const PARAMS = [
    S('Grid', 'cells', 'Cells across', 12, 200, 80, { rand: [70, 100], hint: 'How many glyphs fit across the frame' }),
    S('Grid', 'bands', 'Bands', 2, 12, 5, { rand: [4, 6], hint: 'Ground plus the glyph bands nested in the river' }),
    S('Field', 'wave', 'Wave', 0, 100, 60, { unit: '%', rand: [25, 85], hint: 'How much the river bends and swells' }),
    S('Field', 'tilt', 'Tilt', 0, 100, 20, { unit: '%', rand: [0, 90], hint: 'How far the river leans from upright' }),
    S('Field', 'detail', 'Detail', 0, 100, 50, { unit: '%', rand: [30, 70], hint: 'Roughness of the band edges' }),
    S('Marks', 'size', 'Size', 20, 100, 80, { unit: '%', rand: [70, 90], hint: 'Glyph size within its cell' }),
    S('Marks', 'edges', 'Edges', 0, 100, 60, { unit: '%', rand: [40, 80], hint: 'How far neighbouring bands dither into each other' }),
    S('Marks', 'flecks', 'Flecks', 0, 40, 6, { unit: '%', rand: [3, 10], hint: 'Squares and x’s of random inks scattered everywhere' }),
    S('Marks', 'smears', 'Smears', 0, 100, 15, { unit: '%', rand: [8, 30], hint: 'Rows drawn as thin scanlines in the inks they cross' }),
    S('Marks', 'dots', 'Ground dots', 0, 100, 60, { unit: '%', rand: [40, 80], hint: 'Size of the dots in empty cells (0 % hides them)' }),
  ];

  // Shape constants (lengths in units of the frame's short edge unless noted).
  const K = {
    half: 0.31,       // river half-width
    shift: 0.12,      // random offset of the river from the centre
    lean: 45,         // degrees of lean at Tilt 100 %
    bend: 0.085,      // centre-line bends at Wave 100 %
    bendF: 0.75,      // bends per short edge
    swell: 0.2,       // width swelling at Wave 100 % (share of the half-width)
    rough: 0.16,      // edge noise at Detail 100 % (bites and bulges a few cells deep)
    roughF: 3.4,      // edge noise frequency (cycles per short edge)
    dither: 0.8,      // band-edge dither at Edges 100 % (in bands)
    fleck: 0.4,       // share of cells flecked at Flecks 100 %
    smear: 0.011,     // smear starts per cell at Smears 100 %
    smearLen: [6, 16],
    smearH: 0.36,     // scanline height (x cell)
    dot: 0.12,        // ground dot diameter at 100 % (x cell)
    sway: 0.08,       // sway (side to side) at Amount 1
    swayBend: 1.2,    // radians of phase across the frame, so the sway ripples a little
    diamond: 0.48,    // diamond half-diagonal (x glyph size)
    xHalf: 0.42,      // x half-extent (x glyph size)
    xStroke: 0.2,     // x stroke (x glyph size)
    ring: 0.16,       // ring stroke (x glyph size)
    core: 0.3,        // ringed square's centre (x glyph size)
  };

  const GLYPH = { square: 0, diamond: 1, x: 2, ring: 3 };

  // Glyph + ink for each band, from the centre outward (seeded, palette-size aware).
  function deal(seed, bands, nInks) {
    const r = PL.rng.create(seed ^ 0x3c6ef372);
    const glyphs = [], inks = [];
    for (let k = 0; k < bands; k++) {
      let g;
      if (k === 0) g = GLYPH.square;
      else if (k === 1) g = r.chance(0.85) ? GLYPH.diamond : GLYPH.ring;
      else {
        const outer = k === bands - 1;
        const pool = outer ? [2, 2, 2, 3, 3, 0] : [2, 2, 3, 3, 1, 0];
        do g = r.pick(pool); while (g === glyphs[k - 1] && r.next() < 0.85);
      }
      glyphs.push(g);
      let ink = 1;
      if (nInks > 1) {
        do ink = 1 + Math.floor(r.next() * nInks); while (k > 0 && ink === inks[k - 1]);
      }
      inks.push(ink);
    }
    return { glyphs, inks };
  }

  // region (General's Rotation and Size): the part of the world to cover; the grid and the river run on
  // past the frame, so zooming out shows more of the same picture.
  function build({ W, H, seed, p, colors, t = 0, anim, crisp = true, region }) {
    const n = colors.length;
    const nInks = Math.max(1, n - 1);
    const scene = new PL.Scene(W, H, colors[0], 0);
    const dotLayer = scene.layer('dots', colors[Math.min(1, n - 1)], 'Ground dots', Math.min(1, n - 1));
    const layers = [];
    for (let i = 1; i < n; i++) layers[i] = scene.layer('ink-' + i, colors[i], 'Ink ' + i, i);
    if (n < 2) layers[1] = dotLayer;

    // --- grid ------------------------------------------------------------------------
    const cols = Math.max(1, Math.round(p.cells));
    const c = W / cols; // square cells across the width
    const rows = Math.max(1, Math.ceil(H / c - 1e-6));
    const B = Math.max(2, Math.round(p.bands));
    const nb = B - 1; // glyph bands; the last band is the ground
    const { glyphs, inks } = deal(seed, nb, nInks);
    const c0 = region ? Math.floor(region.x0 / c) : 0, c1 = region ? Math.ceil(region.x1 / c) : cols;
    const r0 = region ? Math.floor(region.y0 / c) : 0, r1 = region ? Math.ceil(region.y1 / c) : rows;
    const nc = c1 - c0, nr = r1 - r0, Hc = region ? Infinity : H; // (the frame's last row is cut at its edge)

    // --- the river ---------------------------------------------------------------------
    const Sm = Math.min(W, H);
    const r = PL.rng.create(seed ^ 0x6c8e9cf5);
    const lean = ((p.tilt / 100) * K.lean * Math.PI) / 180 * (r.next() < 0.5 ? -1 : 1);
    const ax = Math.sin(lean), ay = Math.cos(lean); // along the river
    const nx = Math.cos(lean), ny = -Math.sin(lean); // across it
    const off = r.float(-K.shift, K.shift) * Sm;
    const cx0 = W / 2 + nx * off, cy0 = H / 2 + ny * off;
    const wv = p.wave / 100;
    const ph1 = r.float(0, Math.PI * 2), ph2 = r.float(0, Math.PI * 2), ph3 = r.float(0, Math.PI * 2);
    const N = PL.noise.get(seed);
    const ox = r.float(-200, 200), oy = r.float(-200, 200);
    const rough = (p.detail / 100) * K.rough * Sm;
    const R0 = K.half * Sm;
    const amt = Math.max(0, anim ? anim.amount : 0);
    const swayA = amt * K.sway * Sm, swayT = t * Math.PI * 2;
    const dz = (p.edges / 100) * K.dither;

    // Band index per cell (0 = centre ... nb - 1 = outermost glyph band, nb = ground).
    const band = new Int8Array(nc * nr);
    for (let j = r0; j < r1; j++) {
      const py = (j + 0.5) * c;
      for (let i = c0; i < c1; i++) {
        const px = (i + 0.5) * c;
        const dx = px - cx0, dy = py - cy0;
        const a = (dx * ax + dy * ay) / Sm; // along, in short edges
        let s = dx * nx + dy * ny;            // across, in px
        s -= wv * K.bend * Sm * (Math.sin(2 * Math.PI * K.bendF * a + ph1) + 0.45 * Math.sin(2 * Math.PI * K.bendF * 2.3 * a + ph2));
        if (swayA > 0) s -= swayA * (Math.sin(swayT + K.swayBend * a) - Math.sin(K.swayBend * a)); // 0 at frame 1
        if (rough > 0) s += rough * N.fbm4((px / Sm) * K.roughF + ox, (py / Sm) * K.roughF + oy, 0, 0, 2, 0.35);
        const R = R0 * (1 + wv * K.swell * Math.sin(2 * Math.PI * K.bendF * 0.6 * a + ph3));
        const z = (Math.abs(s) / R) * nb + (hash(i, j, seed, 11) - 0.5) * dz;
        band[(j - r0) * nc + (i - c0)] = z < 0 ? 0 : z >= nb ? nb : z | 0;
      }
    }

    // --- marks -----------------------------------------------------------------------------
    const size = p.size / 100;
    const fleckP = (p.flecks / 100) * K.fleck;
    const smearP = (p.smears / 100) * K.smear;
    const dotD = Math.pow(p.dots / 100, 2) * K.dot; // fine at the default: a faint dot grid
    const [sMin, sMax] = K.smearLen;

    const box = (i, j) => {
      if (crisp) {
        const x0 = Math.round(i * c), y0 = Math.round(j * c);
        return [x0, y0, Math.round((i + 1) * c) - x0, Math.min(Hc, Math.round((j + 1) * c)) - y0];
      }
      return [i * c, j * c, c, Math.min(c, Hc - j * c)];
    };
    const snap = (v) => (crisp ? Math.max(1, Math.round(v)) : v);

    function glyph(layer, g, i, j) {
      const [x0, y0, bw, bh] = box(i, j);
      const cell = Math.min(bw, bh);
      if (cell <= 0) return;
      const cx = x0 + bw / 2, cy = y0 + bh / 2;
      const s = snap(size * cell);
      const sx = crisp ? x0 + Math.floor((bw - s) / 2) : cx - s / 2;
      const sy = crisp ? y0 + Math.floor((bh - s) / 2) : cy - s / 2;
      if (g === GLYPH.square) {
        layer.r.push(sx, sy, s, s);
      } else if (g === GLYPH.diamond) {
        const hd = s * K.diamond;
        layer.q.push(cx, cy - hd, cx + hd, cy, cx, cy + hd, cx - hd, cy);
      } else if (g === GLYPH.ring) {
        const w = Math.min(s / 2, snap(s * K.ring));
        layer.r.push(sx, sy, s, w, sx, sy + s - w, s, w, sx, sy + w, w, s - 2 * w, sx + s - w, sy + w, w, s - 2 * w);
        const k = snap(s * K.core);
        const kx = crisp ? sx + Math.floor((s - k) / 2) : cx - k / 2, ky = crisp ? sy + Math.floor((s - k) / 2) : cy - k / 2;
        layer.r.push(kx, ky, k, k);
      } else {
        // x: two diagonal bars (clockwise quads); b is where each bar meets the box edge
        const a = s * K.xHalf, b = (s * K.xStroke) / Math.SQRT2;
        layer.q.push(cx - a, cy - a + b, cx - a + b, cy - a, cx + a, cy + a - b, cx + a - b, cy + a);
        layer.q.push(cx + a - b, cy - a, cx + a, cy - a + b, cx - a + b, cy + a, cx - a, cy + a - b);
      }
    }

    // Smears: fixed scanlines on the grid; they show only where they cross the river.
    // (past the frame they start further left too, so ones that run into the region show)
    const smeared = new Uint8Array(nc * nr);
    if (smearP > 0) {
      const s0 = region ? c0 - sMax : 0, s1 = region ? c1 : cols, e1 = region ? c1 : cols;
      for (let j = r0; j < r1; j++) {
        for (let i = s0; i < s1; i++) {
          if (hash(i, j, seed, 71) >= smearP) continue;
          const len = sMin + Math.floor(hash(i, j, seed, 73) * (sMax - sMin + 1));
          for (let k = Math.max(i, c0); k < Math.min(e1, i + len); k++) smeared[(j - r0) * nc + (k - c0)] = 1;
        }
      }
    }

    for (let j = r0; j < r1; j++) {
      for (let i = c0; i < c1; i++) {
        const k = (j - r0) * nc + (i - c0);
        const b = band[k];
        // Flecks: squares and x's of random inks, anywhere, holding still.
        const fleck = fleckP > 0 && hash(i, j, seed, 31) < fleckP;
        const fInk = fleck ? 1 + Math.floor(hash(i, j, seed, 37) * nInks) : 0;
        if (smeared[k] && b < nb) {
          // A thin bar across the whole cell, so neighbouring cells join into one scanline
          // that picks up the ink of every band (and fleck) it crosses.
          const [x0, y0, bw, bh] = box(i, j);
          const hh = snap(K.smearH * Math.min(bw, bh));
          (layers[fleck ? fInk : inks[b]] || layers[1]).r.push(x0, crisp ? y0 + Math.floor((bh - hh) / 2) : y0 + (bh - hh) / 2, bw, hh);
          continue;
        }
        if (fleck) {
          glyph(layers[fInk] || layers[1], hash(i, j, seed, 41) < 0.65 ? GLYPH.square : GLYPH.x, i, j);
          continue;
        }
        if (b >= nb) {
          if (dotD > 0) {
            const [x0, y0, bw, bh] = box(i, j);
            dotLayer.c.push(x0 + bw / 2, y0 + bh / 2, Math.max(0.1, (dotD * Math.min(bw, bh)) / 2)); // true size: faint when small
          }
          continue;
        }
        glyph(layers[inks[b]] || layers[1], glyphs[b], i, j);
      }
    }
    return scene;
  }

  PL.tools.register({
    id: 'cipher',
    name: 'Cipher',
    kind: 'Backgrounds',
    tagline: 'Glyph rivers',
    about: 'A river of glyphs on a dark grid: solid squares down the middle, diamonds, x’s and ringed squares toward the edges, each band in its own ink, with stray flecks and scanline smears.',
    inks: {
      min: 2, max: 8, roles, fit, spec, add, generate,
      span: () => 2, // Invert swaps the ground and ink 1 (dark ground <-> light ground)
      hint: 'The first card is the ground; bands, flecks and smears are dealt from the other inks. Ink 1 also draws the ground dots.',
    },
    palettes: PALETTES,
    params: PARAMS,
    defaults: {
      anim: { amount: 0.6, fps: 12, frames: 36 },
      fx: {},
    },
    build,
    zoom: true, // draws any region of its world (General's Rotation and Size)
    _K: K,
  });
})();
/* ==========================================================================
   tools/dahlia.js — Dahlia: burst posters.

   1. Rays fan out from a centre you can place anywhere (Centre across /
      down). Size sets the reach and Ragged cuts the rays to uneven lengths.
   2. Every ray is a row of short dashes, evenly spaced. A dash's width grows
      with its distance from the centre, like strokes rushing toward you:
      thin spokes at the heart, fat capsules at the rim.
   3. Stacked inks: each dash is printed as a little stack — the side inks a
      touch to either side, the stroke ink on top — so every stroke reads as
      a chunky 3D tube. Most dashes are capped with a bead at their outer end.
   4. Animation: the dashes stream outward along their rays, growing as they
      go, and shrink away when they reach the end of their ray. Exactly one
      dash spacing per loop (at Amount 0.6), so the loop is seamless.
   Print grain (Multiply) holds still on top, like ink on paper.
   ========================================================================== */
(() => {
  const { hash } = PL.rng;

  // Ground, stroke ink, the side inks of the stack, then the bead accent.
  const PALETTES = [
    { name: 'Garden', colors: ['#152112', '#C0D673', '#A2A13E', '#EFB088', '#DD4140'] },
    { name: 'Ember', colors: ['#1A1210', '#F2C14E', '#B5562B', '#F7E1B5', '#E03E36'] },
    { name: 'Lagoon', colors: ['#0B1D26', '#7ED6C9', '#2F7F8C', '#E9F2E6', '#F25C54'] },
    { name: 'Orchid', colors: ['#1B1023', '#D9A8F0', '#8A4BB5', '#FFD9EA', '#FF4F79'] },
    { name: 'Citrus', colors: ['#132018', '#F4D35E', '#C9772F', '#FAF0CA', '#F95738'] },
    { name: 'Night', colors: ['#0E1116', '#9DB4FF', '#4F5FA8', '#E6E9FF', '#FFC145'] },
    { name: 'Triad', colors: ['#F6F1E7', '#193990', '#E8605B', '#6DBA70', '#FFBEB8'] }, // triad 265/25/145: strokes, then the side inks; beads a tint of 25
    { name: 'Paper', colors: ['#EFE8DA', '#2B2D42', '#7D8597', '#D9DDE3', '#D90429'] },
    { name: 'Mono', colors: ['#121212', '#EEECE6', '#77756F', '#BAB8B2', '#FF4D2E'] },
    { name: 'Duo', colors: ['#14161B', '#F2E8CF', '#E63946'] },
    { name: 'Peony', colors: ['#FCE9EA', '#6B1346', '#E06C94', '#9DC494'] }, // rose and sage on a blush ground, deep magenta strokes
  ];

  /* ---- color roles ------------------------------------------------------------
     2 inks: ground, strokes (beads in the stroke ink) · 3: ground, strokes, beads
     4+:     ground, strokes, side inks of the stack, beads                        */
  function slots(n) {
    if (n <= 2) return { ground: 0, body: 1, sides: [], bead: 1 };
    return { ground: 0, body: 1, sides: Array.from({ length: n - 3 }, (_, i) => 2 + i), bead: n - 1 };
  }
  const SIDE_NAMES = ['Side A', 'Side B', 'Side C', 'Side D', 'Side E'];
  function roles(n) {
    if (n <= 2) return ['Ground', 'Strokes'];
    const ns = n - 3;
    return ['Ground', 'Strokes', ...Array.from({ length: ns }, (_, i) => (ns === 1 ? 'Side' : SIDE_NAMES[i])), 'Beads'];
  }
  const spec = (n) => (n <= 2 ? { ramp: 1, accents: 0 } : { ramp: Math.max(1, n - 2), accents: 1 });

  // Side k sits on alternate sides of the stroke, further out every two inks.
  const sideOffset = (k) => (k % 2 === 0 ? 1 : -1) * (1 + (k >> 1));

  // "New colors": a deep ground, a light stroke ink, a shadow side (same hue,
  // darker), a light side (warm tint), and a bead from across the wheel.
  function generate(n, rng) {
    const C = PL.color;
    const dark = rng.chance(0.8);
    const h = rng.float(0, 360);
    const ground = dark ? C.lch(rng.float(0.13, 0.2), rng.float(0.02, 0.05), h + rng.float(-20, 20)) : C.lch(rng.float(0.93, 0.96), rng.float(0.01, 0.03), rng.float(60, 100));
    const ch = rng.float(0.09, 0.16);
    const body = C.lch(dark ? rng.float(0.78, 0.88) : rng.float(0.42, 0.55), ch, h);
    const shadow = C.lch(dark ? rng.float(0.6, 0.68) : rng.float(0.3, 0.38), ch * 0.9, h - rng.float(5, 25));
    const light = C.lch(dark ? rng.float(0.8, 0.88) : rng.float(0.78, 0.86), rng.float(0.06, 0.1), h + rng.pick([150, 180, 210, -90]));
    const bead = C.lch(dark ? rng.float(0.56, 0.66) : rng.float(0.5, 0.6), rng.float(0.17, 0.22), h + rng.pick([150, 180, 200, 230]));
    if (n <= 2) return [ground, body];
    if (n === 3) return [ground, body, bead];
    const sides = [shadow, light];
    while (sides.length < n - 3) sides.push(C.mix(sides[sides.length - 2], ground, 0.25));
    return [ground, body, ...sides.slice(0, n - 3), bead];
  }

  const isLight = (hex) => PL.color.luminance(hex) > 0.35;

  // + adds a side ink just before the beads (a shadow first, then a highlight, ...).
  function add(colors) {
    const C = PL.color;
    const c = colors.slice();
    const n = c.length;
    if (n <= 2) {
      const [, , hue] = C.hexToLch(c[1] || '#C0D673');
      c.push(C.lch(isLight(c[0]) ? 0.5 : 0.62, 0.19, hue + 180));
      return c;
    }
    const body = c[1], k = n - 3; // index of the new side
    const next = k % 2 === 0
      ? C.mix(body, isLight(c[0]) ? '#FFFFFF' : '#000000', 0.28 + 0.1 * (k >> 1))   // shadow side
      : C.mix(body, isLight(c[0]) ? '#000000' : '#FFF4E8', 0.45 + 0.1 * (k >> 1));  // light side
    c.splice(n - 1, 0, next);
    return c;
  }

  function fit(colors, n) {
    const C = PL.color;
    let c = (colors || []).map(C.normHex).filter(Boolean);
    if (!c.length) c = PALETTES[0].colors.slice();
    if (c.length === 1) c.push(C.mix(c[0], isLight(c[0]) ? '#000000' : '#FFFFFF', 0.8));
    if (c.length === n) return c;
    if (c.length > n) {
      if (n <= 2) return [c[0], c[1]];
      return [...c.slice(0, n - 1), c[c.length - 1]];
    }
    while (c.length < n) c = add(c);
    return c;
  }

  const S = (section, key, label, min, max, def, extra = {}) => ({ section, key, label, type: 'range', min, max, def, step: 1, ...extra });

  const PARAMS = [
    S('Burst', 'rays', 'Rays', 12, 300, 160, { rand: [100, 170], hint: 'How many rays fan out from the centre' }),
    S('Burst', 'size', 'Size', 20, 150, 85, { unit: '%', rand: [60, 93], hint: 'How far the rays reach' }),
    S('Burst', 'ragged', 'Ragged', 0, 100, 40, { unit: '%', rand: [25, 65], hint: 'How uneven the ray lengths are' }),
    S('Burst', 'cx', 'Centre across', 0, 100, 50, { unit: '%', rand: [42, 58], hint: 'Where the centre sits, left to right' }),
    S('Burst', 'cy', 'Centre down', 0, 100, 50, { unit: '%', rand: [42, 60], hint: 'Where the centre sits, top to bottom' }),
    S('Strokes', 'width', 'Width', 5, 100, 60, { unit: '%', rand: [50, 70], hint: 'How fat the strokes grow toward the rim' }),
    S('Strokes', 'dash', 'Dash', 20, 100, 50, { unit: '%', rand: [40, 60], hint: 'Length of each dash' }),
    S('Strokes', 'gap', 'Gap', 0, 100, 40, { unit: '%', rand: [30, 50], hint: 'Space between dashes along a ray' }),
    S('Strokes', 'bend', 'Bend', 0, 100, 30, { unit: '%', rand: [20, 40], hint: 'How much each ray curves (every ray its own way)' }),
    S('Strokes', 'beads', 'Beads', 0, 100, 80, { unit: '%', rand: [70, 92], hint: 'Share of rays whose dashes end in a bead' }),
  ];

  // Shape constants (lengths in units of the frame's short edge unless noted;
  // "x" = position along the burst, 0 at the centre and 1 at the full reach).
  const K = {
    reach: 0.72,     // longest ray at Size 100 %
    size0: 0.5,      // share of the reach that doesn't depend on Size
    clump: 0.55,     // share of the raggedness shared by neighbouring rays (clumps of long / short rays)
    lobes: 2.2,      // how many such clumps around the burst
    ragPow: 1,       // > 1 keeps more rays long
    inner: 0.1,      // rays start between the centre and this share of their length
    r0: 0.004,       // the closest a ray starts to the centre
    l0: 0.03, l1: 0.05, // dash length at Dash 50 %: l0 + l1 * x (dashes lengthen outward)
    pVar: 0.35,      // per-ray spread of the dash spacing (rays drift at slightly different speeds)
    fVar: 0.5,       // per-ray spread of the dash length
    gap: 0.65,       // gap at Gap 40 %, relative to the dash length
    h0: 0.0026, h1: 0.0112, // stroke half-width at Width 60 % and 160 rays: h0 + h1 * x
    wVar: 0.4,       // per-ray width spread
    rayPow: 0.6,     // stroke width ~ (160 / Rays) ^ rayPow
    side: 0.75,      // side inks' offset (x stroke half-width)
    b0: 0.0042, b1: 0.0168, // bead radius at Width 60 % and 160 rays: b0 + b1 * x
    bVar: 0.3,       // per-ray bead size spread
    bend: 0.5,       // radians a ray turns by its full length at Bend 30 % (each ray its own way)
    fadeIn: 0.45,    // dashes grow in over this share of a dash spacing at the start of their ray
    fadeOut: 0.4,    // ... and shrink away over this share past its end
    groups: 8,       // rays are layered in this many interleaved groups
    sideFront: 1,    // of the groups, this many print a side ink in front of the stroke ink
  };

  function build({ W, H, seed, p, colors, t = 0, anim }) {
    const n = colors.length;
    const sl = slots(n);
    const scene = new PL.Scene(W, H, colors[sl.ground], sl.ground);
    const names = roles(n);
    const ns = sl.sides.length;
    // Within a stack: the outermost sides first, then the front ink, then the bead.
    const byDepth = sl.sides.map((ci, k) => k).sort((a, b) => Math.abs(sideOffset(b)) - Math.abs(sideOffset(a)) || sideOffset(a) - sideOffset(b));
    const G = K.groups;
    const groups = [];
    for (let g = 0; g < G; g++) {
      // Most groups print the stroke ink in front; a few put a side ink in front instead.
      const front = ns > 0 && g >= G - Math.min(K.sideFront, G - 1) ? (ns > 1 ? (1 + g - (G - K.sideFront)) % 2 : 0) : -1;
      const layers = { sides: [], body: null, bead: null };
      for (const k of byDepth) if (k !== front) layers.sides[k] = scene.layer(`g${g}-side${k}`, colors[sl.sides[k]], `${names[2 + k]} ${g + 1}`, sl.sides[k]);
      layers.body = scene.layer(`g${g}-body`, colors[sl.body], `Strokes ${g + 1}`, sl.body);
      if (front >= 0) layers.sides[front] = scene.layer(`g${g}-side${front}`, colors[sl.sides[front]], `${names[2 + front]} ${g + 1}`, sl.sides[front]);
      layers.bead = n <= 2 ? layers.body : scene.layer(`g${g}-bead`, colors[sl.bead], `Beads ${g + 1}`, sl.bead);
      groups.push(layers);
    }

    const Sm = Math.min(W, H);
    const cx = (p.cx / 100) * W, cy = (p.cy / 100) * H;
    const R = Math.max(1e-6, (K.size0 + (1 - K.size0) * (p.size / 100)) * K.reach * Sm);
    const N = Math.max(3, Math.round(p.rays));
    // Strokes thin out a little as rays get denser (more rays = finer strokes).
    const wk = (p.width / 60) * Math.pow(160 / N, K.rayPow);
    const dk = p.dash / 50, gk = (p.gap / 40) * K.gap;
    const Pf = Math.max(1e-3, dk + gk); // period (dash + gap) relative to the base length
    const fill = dk / Pf;               // share of each period that is a dash
    const rag = p.ragged / 100;
    const beadP = Math.pow(p.beads / 100, 0.6); // share of rays with beads (80 % -> ~9 in 10)
    const bend = (p.bend / 30) * K.bend;
    const r0 = K.r0 * Sm;
    const kU = (Sm * Pf * K.l1) / R;    // u(r) = ln(A(r) / A(start)) / kU, A(r) = l0 + l1 r / R
    const smooth = (a, b, x) => { const u = Math.min(1, Math.max(0, (x - a) / (b - a))); return u * u * (3 - 2 * u); };

    const amt = Math.max(0, anim ? anim.amount : 0);
    const flow = Math.round(amt * 1.67) * t; // whole dash spacings per loop: seamless
    const rnd = PL.rng.create(seed ^ 0x1b873593);
    const base = rnd.float(0, Math.PI * 2);
    const Nz = PL.noise.get(seed ^ 0x5f3759df);

    const capsule = PL.Scene.capsule; // a tapered, round-ended stroke from A to B

    for (let i = 0; i < N; i++) {
      // Rays scatter freely around the burst, so they bunch up and leave dark slits.
      const th0 = base + 2 * Math.PI * hash(i, seed, 1, 0);
      // Ragged: part shared by neighbouring rays (clumps of long and short rays), part per ray.
      const lobe = 0.5 + 0.5 * Nz.noise4(Math.cos(th0) * K.lobes, Math.sin(th0) * K.lobes, 1.3, 0.4);
      const len = R * (1 - rag * Math.pow(Math.min(1, K.clump * lobe * 1.25 + (1 - K.clump) * hash(i, seed, 2, 0)), K.ragPow));
      const start = Math.max(r0, len * K.inner * Math.pow(hash(i, seed, 7, 0), 1.6));
      if (len <= start) continue;
      const turn = bend * (2 * hash(i, seed, 11, 0) - 1); // each ray curls its own way
      const grp = groups[Math.floor(hash(i, seed, 3, 0) * G) % G];
      const wr = wk * (1 + K.wVar * (hash(i, seed, 8, 0) - 0.5));
      const br = wk * (1 + K.bVar * (hash(i, seed, 5, 0) - 0.5));
      const hasBead = hash(i, seed, 4, 0) < beadP;
      const ph = hash(i, seed, 6, 0);
      // Each ray has its own dash spacing and length (its own whole-spacing flow keeps the loop seamless).
      const kUi = kU * (1 + K.pVar * (hash(i, seed, 9, 0) - 0.5));
      const fl = Math.min(0.92, Math.max(0.12, fill * (1 + K.fVar * (hash(i, seed, 10, 0) - 0.5))));
      const A0 = K.l0 + (K.l1 * start) / R;
      const uEnd = Math.log((K.l0 + (K.l1 * len) / R) / A0) / kUi;
      const rOf = (u) => ((A0 * Math.exp(u * kUi) - K.l0) * R) / K.l1;
      const pt = (r) => {
        const a = th0 + turn * (r / R) * (r / R);
        return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
      };
      // Dash k covers u in [k + ph + flow, k + ph + flow + fill]; u = 0 is the ray's start.
      for (let k = Math.floor(-(ph + flow)) - 1; ; k++) {
        const ua = k + ph + flow, ub = ua + fl;
        if (ua > uEnd + K.fadeOut) break;
        if (ub <= 0) continue;
        const um = (ua + ub) / 2;
        // Grow in at the start of the ray, shrink away past its end (length and width alike).
        const f = smooth(-fl / 2, K.fadeIn, um) * (1 - smooth(uEnd, uEnd + K.fadeOut, um));
        if (f <= 0.02) continue;
        const half = (fl / 2) * f;
        const ra = rOf(Math.max(0, um - half)), rb = rOf(um + half);
        const xa = ra / R, xb = rb / R;
        const ha = Sm * (K.h0 + K.h1 * xa) * wr * f, hb = Sm * (K.h0 + K.h1 * xb) * wr * f;
        const [ax, ay] = pt(ra), [bx, by] = pt(rb);
        const dx = bx - ax, dy = by - ay, dl = Math.hypot(dx, dy) || 1;
        const vx = -dy / dl, vy = dx / dl; // clockwise side of the stroke
        for (let kk = 0; kk < ns; kk++) {
          const o = sideOffset(kk) * K.side;
          capsule(grp.sides[kk], ax + vx * o * ha, ay + vy * o * ha, ha, bx + vx * o * hb, by + vy * o * hb, hb);
        }
        capsule(grp.body, ax, ay, ha, bx, by, hb);
        if (hasBead) grp.bead.c.push(bx, by, Sm * (K.b0 + K.b1 * xb) * br * f);
      }
    }
    return scene;
  }

  PL.tools.register({
    id: 'dahlia',
    name: 'Dahlia',
    kind: 'Backgrounds',
    tagline: 'Burst posters',
    about: 'Rays of short dashes burst from a centre and grow as they reach the rim, each dash printed as a stack of offset inks and capped with a bead, under print grain.',
    inks: {
      min: 2, max: 8, roles, fit, spec, add, generate,
      span: () => 2, // Invert swaps the ground and the stroke ink
      hint: 'Order sets the role: ground, strokes, the side inks of each stack, then the beads.',
    },
    palettes: PALETTES,
    params: PARAMS,
    defaults: {
      anim: { amount: 0.6, fps: 12, frames: 36 },
      fx: { grainOn: true, grainBlend: 'multiply', grain: 22, grainSize: 1, grainSpecks: 50, vignette: 15 },
    },
    build,
    zoom: true, // one burst, every ray drawn whole: zoomed out, more of the ground round it (General's Rotation and Size)
    stillGrain: true, // print grain sits in the paper: it holds still while the dashes stream out
    _K: K,
  });
})();
/* ==========================================================================
   tools/coral.js — Coral: sea-fan textile.

   1. Fan: from a root at (or just beyond) one edge, Branches primary limbs
      fan out across Spread. Each ribbon widens as its share of the fan opens
      up, then splits lengthwise into two narrower ribbons that drift apart,
      the way a sea fan grows, so the frame fills with near-parallel ribbons
      about Spacing apart. A shared wobble field bends neighbouring ribbons
      together (zebra waves).
   2. Paper: one torn sheet with a dot screen. Cover sets how much of the
      frame it covers and Size the scale of its lobes. Beneath sets how much
      of the coral passes under it: whole stretches of ribbon go under or over
      together, so some lobes hide the ribbons and others carry them, and a
      ribbon that dives under the paper ends in a blunt cut on top of it.
   3. Print: ribs (stripes across each ribbon), the dot screen (dots grow
      toward the torn edges) and drop shadows from the top-left light.
   4. Animation: every ribbon segment sways side to side on its own slow
      rhythm, carrying the segments that grow from it; the paper stays put.
      Frame 1 is the still image and the loop is seamless.
   ========================================================================== */
(() => {
  const { hash } = PL.rng;

  // Ground, branches, ribs, paper, dots. The default look uses Mono (defaults.palette).
  const PALETTES = [
    { name: 'Reef', colors: ['#392911', '#FF6E2A', '#FF9DA7', '#BE226E', '#FC81D2'] },
    { name: 'Kelp', colors: ['#0F1E1A', '#D9A62E', '#F7E3A3', '#2C6B5E', '#8CC7B8'] },
    { name: 'Indigo', colors: ['#111628', '#F2C14E', '#FFF1C9', '#2B4C9B', '#8FA8F0'] },
    { name: 'Lagoon', colors: ['#06232A', '#FF6B5B', '#FFC2B8', '#0E7C86', '#7ED6C9'] },
    { name: 'Dusk', colors: ['#24101F', '#FF9F43', '#FFD6A5', '#6A2C91', '#C77DFF'] },
    { name: 'Moss', colors: ['#1A1F16', '#E07A5F', '#F2CC8F', '#55663F', '#9AAE6B'] },
    { name: 'Linen', colors: ['#F2EADF', '#C2452D', '#F6C3B3', '#1F3A5F', '#7FA3CC'] },
    { name: 'Complement', colors: ['#F8ECF1', '#D65194', '#F5C5D8', '#047B62', '#94D8C2'] }, // complement 352/172: branches and ribs on 352, paper and dots opposite
    { name: 'Mono', colors: ['#151515', '#EDEAE4', '#FFFFFF', '#5A5955', '#9C9A95'] },
    { name: 'Duo', colors: ['#1B1714', '#FF7A3D', '#B8245F'] },
    { name: 'Ink', colors: ['#EFEBE3', '#1A1A1A'] },
  ];

  /* ---- color roles -----------------------------------------------------------
     2: ground, branches (the paper is ground-coloured with branch-ink dots)
     3: ground, branches, paper (ribs in the paper ink, dots in the branch ink)
     4: ground, branches, ribs, paper (dots in the rib ink)
     5: ground, branches, ribs, paper, dots
     6+: ... extra branch inks, dealt out by limb                                 */
  function slots(n) {
    if (n <= 2) return { ground: 0, branch: [1], ribs: 0, paper: 0, dots: 1 };
    if (n === 3) return { ground: 0, branch: [1], ribs: 2, paper: 2, dots: 1 };
    if (n === 4) return { ground: 0, branch: [1], ribs: 2, paper: 3, dots: 2 };
    return { ground: 0, branch: [1, ...Array.from({ length: n - 5 }, (_, i) => 5 + i)], ribs: 2, paper: 3, dots: 4 };
  }
  function roles(n) {
    if (n <= 2) return ['Ground', 'Branches'];
    if (n === 3) return ['Ground', 'Branches', 'Paper'];
    if (n === 4) return ['Ground', 'Branches', 'Ribs', 'Paper'];
    return ['Ground', 'Branches', 'Ribs', 'Paper', 'Dots', ...Array.from({ length: n - 5 }, (_, i) => 'Branches ' + (i + 2))];
  }
  const spec = (n) => ({ ramp: 2, accents: Math.max(0, n - 3) });

  const isLight = (hex) => PL.color.luminance(hex) > 0.35;

  // "New colors": a deep ground, a hot branch ink with a pale rib tint, and a
  // paper ink from across the wheel with a lighter dot ink of the same hue.
  function generate(n, rng) {
    const C = PL.color;
    const dark = rng.chance(0.8);
    const h = rng.float(0, 360);
    const ground = dark ? C.lch(rng.float(0.17, 0.25), rng.float(0.02, 0.05), h + rng.float(-30, 30)) : C.lch(rng.float(0.93, 0.96), rng.float(0.01, 0.03), rng.float(60, 100));
    const branch = C.lch(dark ? rng.float(0.66, 0.76) : rng.float(0.52, 0.62), rng.float(0.15, 0.2), h + rng.float(20, 60));
    const ribs = C.mix(branch, '#FFFFFF', rng.float(0.45, 0.6));
    const ph = h + rng.pick([150, 180, 210, 240, 120]);
    const paper = C.lch(dark ? rng.float(0.4, 0.5) : rng.float(0.38, 0.5), rng.float(0.12, 0.18), ph);
    const dots = C.lch(dark ? rng.float(0.7, 0.8) : rng.float(0.7, 0.82), rng.float(0.1, 0.16), ph + rng.float(-15, 15));
    const base = [ground, branch, ribs, paper, dots];
    if (n <= 2) return [ground, branch];
    if (n === 3) return [ground, branch, paper];
    if (n === 4) return [ground, branch, ribs, paper];
    const out = base.slice();
    while (out.length < n) out.push(C.lch(dark ? rng.float(0.62, 0.78) : rng.float(0.5, 0.62), rng.float(0.13, 0.19), h + rng.float(-70, 70)));
    return out;
  }

  // + adds the next role: paper, then ribs, then dots, then extra branch inks.
  function add(colors) {
    const C = PL.color;
    const c = colors.slice();
    const n = c.length;
    const [, , hb] = C.hexToLch(c[1] || '#FF6E2A');
    if (n <= 2) c.push(C.lch(isLight(c[0]) ? 0.45 : 0.42, 0.16, hb + 200));           // paper
    else if (n === 3) c.splice(2, 0, C.mix(c[1], '#FFFFFF', 0.5));                    // ribs
    else if (n === 4) c.push(C.mix(c[3], '#FFFFFF', 0.45));                            // dots
    else c.push(C.lch(isLight(c[0]) ? 0.56 : 0.7, 0.17, hb + 35 * (n - 4)));           // another branch ink
    return c;
  }

  function fit(colors, n) {
    const C = PL.color;
    let c = (colors || []).map(C.normHex).filter(Boolean);
    if (!c.length) c = PALETTES[0].colors.slice();
    if (c.length === 1) c.push(C.mix(c[0], isLight(c[0]) ? '#000000' : '#FFFFFF', 0.75));
    if (c.length === n) return c;
    if (c.length > n) {
      if (n <= 2) return [c[0], c[1]];
      if (n === 3) return [c[0], c[1], c[Math.min(3, c.length - 1)]];
      if (n === 4) return c.slice(0, 4);
      return c.slice(0, n);
    }
    while (c.length < n) c = add(c);
    return c;
  }

  const S = (section, key, label, min, max, def, extra = {}) => ({ section, key, label, type: 'range', min, max, def, step: 1, ...extra });

  const PARAMS = [
    S('Fan', 'branches', 'Branches', 1, 12, 6, { rand: [4, 8], hint: 'Limbs growing from the root' }),
    S('Fan', 'spacing', 'Spacing', 0, 100, 50, { unit: '%', rand: [30, 70], hint: 'Gap between neighbouring branches' }),
    S('Fan', 'spread', 'Spread', 0, 100, 70, { unit: '%', rand: [45, 85], hint: 'How wide the fan opens' }),
    S('Fan', 'width', 'Width', 0, 100, 60, { unit: '%', rand: [50, 75], hint: 'Branch width' }),
    S('Fan', 'wobble', 'Wobble', 0, 100, 40, { unit: '%', rand: [25, 60], hint: 'How much the branches wave' }),
    S('Paper', 'cover', 'Cover', 0, 100, 50, { unit: '%', rand: [40, 65], hint: 'How much of the frame is torn paper' }),
    S('Paper', 'size', 'Size', 0, 100, 50, { unit: '%', rand: [30, 75], hint: 'Size of the paper lobes' }),
    S('Paper', 'beneath', 'Beneath', 0, 100, 35, { unit: '%', rand: [20, 55], hint: 'How much of the coral passes under the paper' }),
    S('Print', 'ribs', 'Ribs', 0, 100, 80, { unit: '%', rand: [60, 100], hint: 'Strength of the stripes across each branch' }),
    S('Print', 'dots', 'Dots', 0, 100, 70, { unit: '%', rand: [45, 90], hint: 'Size of the dot screen on the paper' }),
    S('Print', 'shadow', 'Shadow', 0, 100, 60, { unit: '%', rand: [40, 70], hint: 'Drop shadows and edge shading' }),
  ];

  // Shape constants: lengths in units of the frame's long edge (L).
  const K = {
    // fan
    rootOut: [0.1, 0.32], // how far outside its edge the root sits (x L)
    aim: 0.14,        // the fan aims at the frame centre, give or take this much (x L)
    fan0: 60, fanK: 170, // fan angle in degrees: fan0 + fanK * Spread
    s0: 0.0284, sK: 0.000354, // spacing between neighbours: s0 + sK * Spacing (x L)
    forkLo: 1.6, forkHi: 2.3, // a ribbon splits when its share of the fan is this many spacings wide
    minSeg: 0.14,     // shortest segment (x L): with few Branches the fan opens up slowly, like a trunk
    diverge: 5,       // the two halves of a split drift apart over this many spacings
    widen: 2,         // ... and grow to their own width over this many
    term: 0.2,        // chance a split is only a short side shoot (ending in a point, a round end or a cut)
    w0: 0.164, wK: 0.0037, // ribbon width: (w0 + wK * Width) * spacing at one spacing of share
    wPow: 0.75,       // ribbons widen as their share opens up, a little less than in proportion
    shareMax: 2.6,    // ... and never get wider than at this share (few Branches would otherwise make huge trunks)
    rootW: 0.7,       // the limbs keep at least this much width (x spacings of share) at the root, so they bunch up there
    wVar: 0.15,       // width spread between ribbons
    slit: 0.0014,     // the slit between the two halves of a split (x L)
    ov: 0.0008, ovW: 0.35, // a split half starts this far (x L, or x its parent's width if more) inside its parent, so joints never gap
    // wobble
    wob: 0.4,         // shared wave amplitude at Wobble 100 % (x L)
    wobL: 0.8,        // its wavelength (x L)
    wobWarp: 0.4,     // the wave field is warped by this much (sharper, more organic bends)
    envR: 0.12,       // waves fade in over this distance from the root (x L)
    // depth
    depthL: 0.4,      // size of the stretches that pass under or over the paper together (x L)
    depthK: 0.7,      // Beneath compounds with each split: P(under) = 1 - (1 - Beneath)^(depthK * (generation + 0.25))
    // sway (animation)
    sway: 0.022,      // each segment's own sway at Amount 1 (x L)
    swayL: 0.6,       // the sway travels outward along a branch with this wavelength (x L)
    swayIn: 0.25,     // a segment's sway fades in over this length from its start (x L)
    // print
    ribP0: 0.00357, ribPK: 0.0000856, // rib period: ribP0 + ribPK * Spacing (x L); finer ribs on closer branches
    ribW: 0.3,        // rib width (x period)
    rib0: 20,         // ribs start to show above this Ribs %
    ribA: 0.97,       // rib opacity at Ribs 100 %
    ribSkew: 0.12,    // ribs lean up to this much (radians) per segment
    shadeW: 0.24,     // edge shading band (x branch width)
    shadeA: 0.3,      // edge shading opacity at Shadow 100 %
    shA: 0.45,        // drop shadow opacity at Shadow 100 %
    shD: [0.0045, 0.0072], shD0: [0.001, 0.0015], // drop shadow offset: shD0 + shD * Shadow (x L)
    paperShA: 0.3,    // paper shadow opacity at Shadow 100 %
    // paper
    grid: 300,        // paper field samples across L
    lam0: 0.45, lamK: 0.006, // lobe scale: lam0 + lamK * Size (x L)
    oct: 4, gain: 0.5, warp: 0.2,
    cover: [0.8, 0.2], coverVar: 0.25, // paper area = Cover * (a + b * Cover), give or take coverVar per seed
    dotP: 1 / 105,    // dot screen period (x L)
    dotK: 0.33,       // dot radius at the torn edge: dotK * Dots * period
    dotIn: 0.22,      // dots shrink by up to this much deep inside the paper
    groups: 6,        // limbs are layered in this many groups (so they shade each other)
    dr: 0.0035,       // centreline sampling step (x L)
  };

  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  /* ---- the fan (structure only; positions are computed per frame) -------- */
  // R (General's Rotation and Size): the part of the world to cover. The fan is grown for the frame first
  // (exactly as at 100 %), then on past it: limbs that ran out of the frame carry on and split, and the
  // shoots it had no room for grow too, so zooming out shows more of the same fan.
  function buildTree(W, H, seed, p, R) {
    const L = Math.max(W, H);
    const r = PL.rng.create(seed ^ 0x6a09e667);
    // Root on an edge (left and bottom a little more likely), aimed across the frame.
    const e = r.next();
    const edge = e < 0.33 ? 'L' : e < 0.58 ? 'B' : e < 0.8 ? 'R' : 'T';
    const u = r.float(0.3, 0.7), out = r.float(K.rootOut[0], K.rootOut[1]) * L;
    const O = edge === 'L' ? [-out, u * H] : edge === 'R' ? [W + out, u * H] : edge === 'B' ? [u * W, H + out] : [u * W, -out];
    const aimX = W / 2 + r.float(-K.aim, K.aim) * L, aimY = H / 2 + r.float(-K.aim, K.aim) * L;
    const dir = Math.atan2(aimY - O[1], aimX - O[0]);
    const theta = ((K.fan0 + K.fanK * (p.spread / 100)) * Math.PI) / 180;
    const sp = (K.s0 + K.sK * p.spacing) * L;
    const wr = K.w0 + K.wK * p.width;
    const D = K.diverge * sp, Dw = K.widen * sp;
    // the box to grow into (the frame, or the region) and the farthest the fan need reach
    const reachOf = (x0, y0, x1, y1) => Math.max(...[[x0, y0], [x1, y0], [x0, y1], [x1, y1]].map(([x, y]) => Math.hypot(x - O[0], y - O[1]))) + 0.06 * L;
    const insideOf = (x0, y0, x1, y1) => (ang, ra, rb) => {
      for (let k = 0; k <= 6; k++) {
        const rr = ra + ((rb - ra) * k) / 6;
        const x = O[0] + rr * Math.cos(ang), y = O[1] + rr * Math.sin(ang);
        if (x > x0 - 0.12 * L && x < x1 + 0.12 * L && y > y0 - 0.12 * L && y < y1 + 0.12 * L) return true;
      }
      return false;
    };

    const nodes = [];
    // Width of a ribbon at radius rr: grows with its share of the fan; the two halves
    // of a split start exactly side by side (ws) and ease into their own width.
    const widthAt = (nd, rr) => {
      const share = Math.min(K.shareMax, Math.max(nd.parent < 0 ? K.rootW : 0, (rr * nd.d) / sp));
      const wn = wr * sp * nd.wf * Math.pow(share, K.wPow);
      if (nd.parent < 0) return wn;
      return nd.ws + (wn - nd.ws) * smooth(nd.r0, nd.r0 + Dw, rr);
    };
    // Direction (angle about the root) of a ribbon's unbent centreline at radius rr:
    // a split half starts beside its parent and eases onto its own share of the fan.
    const baseAt = (nd, rr) => {
      if (nd.parent < 0) return nd.c;
      const g = smooth(nd.r0, nd.r0 + D, rr);
      if (g >= 1) return nd.c;
      return (baseAt(nodes[nd.parent], rr) + nd.off) * (1 - g) + nd.c * g;
    };

    // A node's split: its two halves (or a side shoot and the carrying half).
    const splitOf = (nd, node, rf, h) => {
      const d = nd.a1 - nd.a0;
      const wp = widthAt(node, rf);
      const s = Math.min(K.slit * L, 0.3 * wp);
      const kids = [];
      if (h(2) < K.term) {
        const f = 0.3 + 0.12 * h(11), wS = f * wp - s / 2, wC = (1 - f) * wp - s / 2;
        if (h(12) < 0.5) kids.push({ a0: nd.a0, a1: nd.a0 + d * f, lo: -wp / 2 + wS / 2, ws: wS, stub: true }, { a0: nd.a0, a1: nd.a1, lo: wp / 2 - wC / 2, ws: wC });
        else kids.push({ a0: nd.a1 - d * f, a1: nd.a1, lo: wp / 2 - wS / 2, ws: wS, stub: true }, { a0: nd.a0, a1: nd.a1, lo: -wp / 2 + wC / 2, ws: wC });
      } else {
        const split = 0.38 + 0.24 * h(11), am = nd.a0 + d * split;
        const w1 = split * wp - s / 2, w2 = (1 - split) * wp - s / 2;
        kids.push({ a0: nd.a0, a1: am, lo: -wp / 2 + w1 / 2, ws: w1 }, { a0: am, a1: nd.a1, lo: wp / 2 - w2 / 2, ws: w2 });
      }
      return kids.map((k) => ({ a0: k.a0, a1: k.a1, stub: !!k.stub, r0: rf, parent: node.id, gen: nd.gen + 1, limb: nd.limb, off: k.lo / rf, lo: k.lo, ws: Math.max(0, k.ws), ov: Math.max(K.ov * L, K.ovW * wp) }));
    };
    // Grow every node on the stack (ids from nodes.length on), each splitting until it leaves the box.
    // Kids with no room in the box and limbs that ran out of it are noted, to carry on later.
    const pruned = [], exits = [];
    const grow = (stack, rMax, inside) => {
      while (stack.length) {
        const nd = stack.pop();
        const me = nodes.length;
        const h = (k) => hash(me, k, seed, 77);
        const d = nd.a1 - nd.a0;
        let rf = Math.max(nd.r0 + K.minSeg * L, (sp * (K.forkLo + (K.forkHi - K.forkLo) * h(1))) / Math.max(1e-4, d));
        let kind = 'fork';
        if (nd.stub) { // a side shoot runs a little way and ends in a point, a round end or a cut
          rf = nd.r0 + Math.max(0.03 * L, (rf - nd.r0) * (0.3 + 0.5 * h(3)));
          const q = h(4);
          kind = q < 0.45 ? 'point' : q < 0.75 ? 'round' : 'cut';
        }
        const node = {
          id: me, parent: nd.parent, gen: nd.gen, limb: nd.limb, c: (nd.a0 + nd.a1) / 2, d, r0: nd.r0, r1: rf, kind,
          off: nd.off, lo: nd.lo, ws: nd.ws, ov: nd.ov, kids: [], wf: 1 + K.wVar * (2 * h(5) - 1),
          ph: h(6) * Math.PI * 2, ribPh: h(8), skew: (h(9) * 2 - 1) * K.ribSkew, cutK: h(10) - 0.5,
          dv: 9, du: 1, wt: 0,
        };
        if (rf >= rMax) { exits.push({ id: me, nd, rf, kind }); node.r1 = rMax; node.kind = 'exit'; }
        node.r1f = node.r1; // (where it ends in the box it grew in)
        nodes[me] = node;
        if (nd.parent >= 0) nodes[nd.parent].kids.push(me);
        if (node.kind === 'fork') {
          for (const k of splitOf(nd, node, rf, h)) {
            if (!inside((k.a0 + k.a1) / 2, rf, rMax)) { pruned.push(k); continue; }
            stack.push(k);
          }
        }
      }
    };

    const B = Math.max(1, Math.round(p.branches));
    const stack = [];
    // Primary limbs share the fan unevenly, like a real one.
    const cuts = [0];
    for (let k = 1; k < B; k++) cuts.push((k + r.float(-0.3, 0.3)) / B);
    cuts.push(1);
    for (let k = 0; k < B; k++) {
      const a0 = dir - theta / 2 + cuts[k] * theta, a1 = dir - theta / 2 + cuts[k + 1] * theta;
      stack.push({ a0, a1, r0: 0, parent: -1, gen: 0, limb: k, off: 0, lo: 0, ws: 0, ov: 0 });
    }
    const rMax = reachOf(0, 0, W, H);
    grow(stack, rMax, insideOf(0, 0, W, H));
    const nFrame = nodes.length;
    if (R) {
      // on past the frame: limbs that ran out of it carry on (and split), shoots it had no room for grow
      const rMax2 = reachOf(R.x0, R.y0, R.x1, R.y1), inside2 = insideOf(R.x0, R.y0, R.x1, R.y1);
      const more = [];
      const ex = exits.splice(0), pr = pruned.splice(0);
      for (const x of ex) {
        if (x.rf <= rMax) continue;
        const node = nodes[x.id];
        if (x.rf >= rMax2) { node.r1 = rMax2; continue; }
        node.r1 = x.rf; node.kind = x.kind;
        if (x.kind === 'fork') {
          const h = (k) => hash(x.id, k, seed, 77);
          for (const k of splitOf(x.nd, node, x.rf, h)) if (inside2((k.a0 + k.a1) / 2, x.rf, rMax2)) more.push(k);
        }
      }
      for (const k of pr) if (inside2((k.a0 + k.a1) / 2, k.r0, rMax2)) more.push(k);
      grow(more.reverse(), rMax2, inside2);
    }
    // Which stretches pass under the paper is decided by a slow random field, so
    // neighbours go under or over together (see Beneath in build).
    const Nd = PL.noise.get(seed ^ 0x2545f491);
    const weigh = (nd, x0, y0, x1, y1, rEnd) => {
      let sx = 0, sy = 0, cnt = 0;
      for (let k = 0; k < 16; k++) {
        const rr = nd.r0 + ((rEnd - nd.r0) * (k + 0.5)) / 16;
        const x = O[0] + rr * Math.cos(nd.c), y = O[1] + rr * Math.sin(nd.c);
        if (x >= x0 && x <= x1 && y >= y0 && y <= y1) { sx += x; sy += y; cnt++; }
      }
      nd.wt = ((rEnd - nd.r0) * cnt) / 16;
      if (cnt) nd.dv = Nd.noise4(sx / cnt / (K.depthL * L), sy / cnt / (K.depthL * L), 0.5, 0);
    };
    for (let i = 0; i < nFrame; i++) weigh(nodes[i], 0, 0, W, H, Math.min(nodes[i].r1f, rMax));
    // Rank the field values so they're spread evenly over 0 … 1.
    const seen = nodes.slice(0, nFrame).filter((nd) => nd.wt > 0).sort((a, b) => a.dv - b.dv);
    seen.forEach((nd, i) => { nd.du = (i + 0.5) / seen.length; });
    if (R) {
      // the rest (all past the frame) take their place among the frame's ranks
      const dvs = seen.map((nd) => nd.dv), rMax2 = reachOf(R.x0, R.y0, R.x1, R.y1);
      for (const nd of nodes) {
        if (nd.wt > 0 && nd.id < nFrame) continue;
        weigh(nd, R.x0, R.y0, R.x1, R.y1, Math.min(nd.r1, rMax2));
        if (!(nd.wt > 0)) continue;
        let lo = 0, hi = dvs.length;
        while (lo < hi) { const m = (lo + hi) >> 1; if (dvs[m] < nd.dv) lo = m + 1; else hi = m; }
        nd.du = dvs.length ? (lo + 0.5) / (dvs.length + 1) : 0.5;
      }
    }
    return { O, nodes, L, sp, widthAt, baseAt };
  }

  /* ---- paper: one torn sheet with a dot screen ------------------------------ */
  // Marching squares on a grid of values (> 0 = inside). Returns closed loops
  // as flat [x, y, ...] arrays: outer edges clockwise, holes anticlockwise.
  function contours(v, nx, ny, x0, y0, g) {
    const at = (i, j) => v[j * (nx + 1) + i];
    const next = new Map(), pos = new Map();
    const edgePt = (i, j, horiz) => {
      const id = ((j * (nx + 1) + i) << 1) | (horiz ? 0 : 1);
      if (!pos.has(id)) {
        const a = at(i, j), b = horiz ? at(i + 1, j) : at(i, j + 1);
        const t = a / (a - b);
        pos.set(id, horiz ? [x0 + (i + t) * g, y0 + j * g] : [x0 + i * g, y0 + (j + t) * g]);
      }
      return id;
    };
    // Edge ids for a cell: T, R, B, Lf.
    for (let j = 0; j < ny; j++) {
      for (let i = 0; i < nx; i++) {
        const a = at(i, j), b = at(i + 1, j), c = at(i + 1, j + 1), d = at(i, j + 1);
        const code = (a > 0 ? 8 : 0) | (b > 0 ? 4 : 0) | (c > 0 ? 2 : 0) | (d > 0 ? 1 : 0);
        if (code === 0 || code === 15) continue;
        const T = () => edgePt(i, j, true), R = () => edgePt(i + 1, j, false), Bt = () => edgePt(i, j + 1, true), Lf = () => edgePt(i, j, false);
        // Directed so the inside is on the right of travel (y down): outer loops run clockwise.
        const seg = (s, e) => next.set(s, e);
        const centre = (a + b + c + d) / 4;
        switch (code) {
          case 8: seg(T(), Lf()); break;
          case 4: seg(R(), T()); break;
          case 2: seg(Bt(), R()); break;
          case 1: seg(Lf(), Bt()); break;
          case 7: seg(Lf(), T()); break;
          case 11: seg(T(), R()); break;
          case 13: seg(R(), Bt()); break;
          case 14: seg(Bt(), Lf()); break;
          case 12: seg(R(), Lf()); break;
          case 6: seg(Bt(), T()); break;
          case 3: seg(Lf(), R()); break;
          case 9: seg(T(), Bt()); break;
          case 10: // a + c inside: joined through the centre (cut off b and d) or apart
            if (centre > 0) { seg(T(), R()); seg(Bt(), Lf()); } else { seg(T(), Lf()); seg(Bt(), R()); }
            break;
          case 5: // b + d inside: joined (cut off a and c) or apart
            if (centre > 0) { seg(Lf(), T()); seg(R(), Bt()); } else { seg(R(), T()); seg(Lf(), Bt()); }
            break;
        }
      }
    }
    const loops = [];
    const seen = new Set();
    for (const start of next.keys()) {
      if (seen.has(start)) continue;
      const pts = [];
      let cur = start, guard = 0;
      while (!seen.has(cur) && guard++ < 1e6) {
        seen.add(cur);
        const pt = pos.get(cur);
        pts.push(pt[0], pt[1]);
        cur = next.get(cur);
        if (cur === undefined) break;
      }
      if (pts.length >= 6) loops.push(pts);
    }
    return loops;
  }

  // The noise field depends only on the seed, Size and the frame's shape, so it's
  // cached in frame-relative units: Cover only re-thresholds it, and every export
  // size cuts exactly the same shapes as the preview.
  // o (General's Rotation and Size): the part of the world from (o.x, o.y), o.w x o.h (units of L), read
  // as finely on the screen as the frame (o.z: screen pixels per frame unit there)
  const fieldCache = new Map(), paperCache = new Map();
  function paperField(aw, ah, seed, size, o) {
    const key = [aw.toFixed(4), ah.toFixed(4), seed, size, o ? [o.x, o.y, o.w, o.h, o.z].join(',') : ''].join('|');
    const hit = fieldCache.get(key);
    if (hit) return hit;
    const g = o ? 1 / (K.grid * Math.min(1, o.z)) : 1 / K.grid, m = 3;
    const nx = Math.ceil((o ? o.w : aw) / g) + 2 * m, ny = Math.ceil((o ? o.h : ah) / g) + 2 * m;
    const x0 = (o ? o.x : 0) - m * g, y0 = (o ? o.y : 0) - m * g;
    const f = 1 / (K.lam0 + K.lamK * size);
    const N = PL.noise.get(seed ^ 0x3c6ef372);
    const A = new Float32Array((nx + 1) * (ny + 1));
    for (let j = 0; j <= ny; j++) {
      const v = (y0 + j * g) * f;
      for (let i = 0; i <= nx; i++) {
        const uu = (x0 + i * g) * f;
        const wx = N.fbm4(uu * 1.7 + 11.3, v * 1.7 - 4.1, 2.2, 0, 2, 0.5), wy = N.fbm4(uu * 1.7 - 7.9, v * 1.7 + 13.7, 5.5, 0, 2, 0.5);
        A[j * (nx + 1) + i] = N.fbm4(uu + K.warp * wx, v + K.warp * wy, 0.7, 0, K.oct, K.gain);
      }
    }
    const inside = [];
    for (let j = m; j <= ny - m; j++) for (let i = m; i <= nx - m; i++) inside.push(A[j * (nx + 1) + i]);
    const out = { A, nx, ny, x0, y0, g, sorted: Float32Array.from(inside).sort() };
    if (fieldCache.size > 8) fieldCache.delete(fieldCache.keys().next().value);
    fieldCache.set(key, out);
    return out;
  }

  // R (General's Rotation and Size): the paper over that part of the world, cut at the frame's own level
  function buildPaper(W, H, seed, p, R) {
    const L = Math.max(W, H);
    const o = R ? { x: R.x0 / L, y: R.y0 / L, w: (R.x1 - R.x0) / L, h: (R.y1 - R.y0) / L, z: R.z || 1 } : undefined;
    const key = [W / L, H / L, seed, p.cover, p.size, o ? [o.x, o.y, o.w, o.h, o.z].join(',') : ''].join('|');
    let base = paperCache.get(key);
    if (!base) {
      const { sorted } = paperField(W / L, H / L, seed, p.size);
      const F = paperField(W / L, H / L, seed, p.size, o);
      const { A, nx, ny, x0, y0, g } = F;
      const c = p.cover / 100;
      const cover = Math.min(0.999, c * (K.cover[0] + K.cover[1] * c) * (1 + 4 * c * (1 - c) * K.coverVar * (2 * hash(seed, 5, 41, 3) - 1)));
      const t = cover <= 0 ? Infinity : sorted[Math.max(0, Math.floor((1 - cover) * (sorted.length - 1)))];
      const v = new Float32Array(A.length);
      for (let k = 0; k < A.length; k++) v[k] = A[k] - t;
      for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) {
        if (i === 0 || j === 0 || i === nx || j === ny) v[j * (nx + 1) + i] = -1;
      }
      const sample = (x, y) => {
        let gx = (x - x0) / g, gy = (y - y0) / g;
        gx = Math.max(0, Math.min(nx - 1.001, gx)); gy = Math.max(0, Math.min(ny - 1.001, gy));
        const i = gx | 0, j = gy | 0, fx = gx - i, fy = gy - j, k = j * (nx + 1) + i;
        const a = v[k] + (v[k + 1] - v[k]) * fx, b = v[k + nx + 1] + (v[k + nx + 2] - v[k + nx + 1]) * fx;
        return a + (b - a) * fy;
      };
      base = { loops: Number.isFinite(t) ? contours(v, nx, ny, x0, y0, g) : [], inside: sample };
      if (paperCache.size > 12) paperCache.delete(paperCache.keys().next().value);
      paperCache.set(key, base);
    }
    return { loops: base.loops.map((c) => c.map((q) => q * L)), inside: (x, y) => base.inside(x / L, y / L) };
  }

  /* ---- build ------------------------------------------------------------------- */
  const treeCache = new Map();
  // region (General's Rotation and Size): the part of the world to cover (see buildTree and buildPaper)
  function build({ W, H, seed, p, colors, t = 0, anim, region }) {
    const n = colors.length;
    const sl = slots(n);
    const scene = new PL.Scene(W, H, colors[sl.ground], sl.ground);
    const L = Math.max(W, H);
    const shadow = p.shadow / 100;
    const ox = (K.shD0[0] + K.shD[0] * shadow) * L, oy = (K.shD0[1] + K.shD[1] * shadow) * L;
    const BLACK = '#000000';
    const offset = (pts, dx, dy) => pts.map((v, i) => (i & 1 ? v + dy : v + dx));

    const tkey = [W, H, seed, p.branches, p.spacing, p.spread, p.width, region ? [region.x0, region.y0, region.x1, region.y1].join(',') : ''].join('|');
    let tree = treeCache.get(tkey);
    if (!tree) {
      tree = buildTree(W, H, seed, p, region);
      if (treeCache.size > 12) treeCache.delete(treeCache.keys().next().value);
      treeCache.set(tkey, tree);
    }
    const { O, nodes, widthAt, baseAt } = tree;

    // Beneath: the chance a stretch of coral dives under the paper grows with every
    // split, so the limbs at the root mostly lie on top and the outer reaches mostly
    // underneath. Neighbours share the same slow random field, so they dive together.
    const under = new Uint8Array(nodes.length);
    {
      const keep = 1 - Math.min(1, Math.max(0, p.beneath / 100));
      for (const nd of nodes) if (nd && nd.wt > 0 && nd.du < 1 - Math.pow(keep, K.depthK * (nd.gen + 0.25))) under[nd.id] = 1;
    }

    // Layers, bottom to top: coral under the paper, the paper, coral on top.
    const G = K.groups;
    const branchInks = sl.branch;
    const ribA = K.ribA * Math.min(1, Math.max(0, (p.ribs - K.rib0) / (100 - K.rib0)));
    const groupsFor = (tag, label) => {
      const out = [];
      for (let g = 0; g < G; g++) {
        out.push({
          shadow: shadow > 0 ? scene.layer(`${tag}${g}-shadow`, BLACK, `Branch shadows${label} ${g + 1}`, undefined, K.shA * shadow) : null,
          body: branchInks.map((ci, b) => scene.layer(`${tag}${g}-body${b}`, colors[ci], `Branches${label} ${g + 1}` + (branchInks.length > 1 ? ` (${b + 1})` : ''), ci)),
          shade: shadow > 0 ? scene.layer(`${tag}${g}-shade`, BLACK, `Branch shading${label} ${g + 1}`, undefined, K.shadeA * shadow) : null,
          ribs: ribA > 0 ? scene.layer(`${tag}${g}-ribs`, colors[sl.ribs], `Ribs${label} ${g + 1}`, sl.ribs, ribA) : null,
        });
      }
      return out;
    };
    const below = groupsFor('u', ' under paper');

    // --- paper (static) ---------------------------------------------------------
    const paper = buildPaper(W, H, seed, p, region);
    if (paper.loops.length) {
      const shA = K.paperShA * shadow;
      if (shA > 0) { const sh = scene.layer('paper-shadow', BLACK, 'Paper shadow', undefined, shA); for (const c of paper.loops) sh.p.push(offset(c, ox * 1.25, oy * 1.25)); }
      const pl = scene.layer('paper', colors[sl.paper], 'Paper', sl.paper);
      for (const c of paper.loops) pl.p.push(c);
      if (p.dots > 0) {
        const dl = scene.layer('dots', colors[sl.dots], 'Dots', sl.dots);
        const dotP = K.dotP * L, dotR = K.dotK * (p.dots / 100) * dotP;
        const cols = Math.ceil(W / dotP) + 1, rows = Math.ceil(H / dotP) + 1;
        const i0 = region ? Math.floor(region.x0 / dotP) - 1 : 0, i1 = region ? Math.ceil(region.x1 / dotP) + 1 : cols;
        const j0 = region ? Math.floor(region.y0 / dotP) - 1 : 0, j1 = region ? Math.ceil(region.y1 / dotP) + 1 : rows;
        for (let j = j0; j < j1; j++) {
          const y = (j + 0.5) * dotP;
          for (let i = i0; i < i1; i++) {
            const x = (i + 0.5) * dotP;
            const v = paper.inside(x, y);
            if (v <= 0.006) continue;
            // Dots are biggest along the torn edges.
            const rr = dotR * (1 - K.dotIn * smooth(0.01, 0.16, v));
            if (rr > 0.05) dl.c.push(x, y, rr);
          }
        }
      }
    }
    const above = groupsFor('o', '');

    // --- branches ------------------------------------------------------------------
    const Nz = PL.noise.get(seed ^ 0x1f83d9ab);
    const wobA = (p.wobble / 100) * K.wob * L, wobF = 1 / (K.wobL * L);
    const wobAt = (x, y) => {
      const a = x * wobF, b = y * wobF;
      const qx = Nz.noise4(a * 1.3 + 5.2, b * 1.3 + 1.3, 1.7, 0), qy = Nz.noise4(a * 1.3 - 3.1, b * 1.3 + 7.7, 2.9, 0);
      return Nz.noise4(a + K.wobWarp * qx, b + K.wobWarp * qy, 0.3, 0);
    };
    const amt = Math.max(0, anim ? anim.amount : 0);
    const sw = amt * K.sway * L, tw = t * Math.PI * 2, kap = (Math.PI * 2) / (K.swayL * L);

/* ==========================================================================
   tools/whorl.js — Whorl: warped op-art.

      stripes away into bulges and saddles. The field is a sum of cones with
      rounded tips, so rings open into a wide eye at the core, and the stripes
      tighten (up to 3x) away from the main centre. Pull and Push only set the
      balance between the centres; Count alone sets how dense the stripes are.
   2. Warp: the whole field is bent by a smooth, turbulent or rippled warp.
      Amount sets how far, Detail how fine.
   3. Stripes: Count sets how many, Weight how thick the stripe ink is. Every
      stripe is a filled band between two contour lines, so edges stay crisp
      at any size and the SVG is clean vector.
   4. Animation: the stripes flow into the pull centres, slowly far out and

  const { hash } = PL.rng;

    { name: 'Ink', colors: ['#121212', '#F2EEE6'] },
    { name: 'Flame', colors: ['#E23726', '#FAD957'] }, // no white or grey: vermilion and sun yellow
    { name: 'Cobalt', colors: ['#EEEBE4', '#2340C8'] },
    { name: 'Grape', colors: ['#2B1640', '#F6B9E6'] },
    { name: 'Mint', colors: ['#0D2B26', '#A6F2CF'] },
    { name: 'Ember', colors: ['#2A0E08', '#FF9442'] },
    { name: 'Sky', colors: ['#14284B', '#BFE3FF'] },
    { name: 'Complement', colors: ['#F5F1E9', '#D95448', '#0097A8'] }, // complement 28/208: two stripe inks at one lightness
    { name: 'Candy', colors: ['#FFF3E6', '#FF5D7A', '#FFB52E', '#2FA3FF'] },

  function generate(n, rng) {
    const C = PL.color;
    const h = rng.float(0, 360);
    const darkGround = rng.chance(0.6);
    const ground = darkGround
      ? C.lch(rng.float(0.17, 0.3), rng.float(0.03, 0.08), h)
      : C.lch(rng.float(0.93, 0.97), rng.float(0.01, 0.035), rng.float(60, 100));

    const stripeL = darkGround ? rng.float(0.86, 0.96) : rng.float(0.42, 0.62);
    const stripeC = darkGround ? rng.float(0.1, 0.19) : rng.float(0.15, 0.24);

    S('Stripes', 'weight', 'Weight', 5, 95, 50, { unit: '%', rand: false, hint: 'Thickness of the stripe ink' }),
