  }

  const S = (section, key, label, min, max, def, extra = {}) => ({ section, key, label, type: 'range', min, max, def, step: 1, ...extra });
  const PARAMS = [
    S('Grid', 'cols', 'Columns', 16, 96, 48, { rand: [34, 64], hint: 'Cells across the frame' }),
    S('Grid', 'gutter', 'Gutter', 0, 100, 20, { unit: '%', hint: 'Thickness of the grid lines between the cells' }),
    S('Field', 'streak', 'Streak', 0, 100, 80, { unit: '%', rand: [50, 92], hint: 'Stretches the field upright into tall streaks (0: round shapes)' }),
    S('Field', 'scale', 'Scale', 0, 100, 50, { unit: '%', rand: [33, 77], hint: 'Size of the shapes in the field' }),
    S('Field', 'slip', 'Slip', 0, 100, 40, { unit: '%', rand: [20, 70], hint: 'How far each band of rows slides sideways (0: no glitch)' }),
    S('Field', 'band', 'Band height', 1, 16, 5, { rand: [3, 10], hint: 'Rows in each sliding band' }),
    S('Field', 'blobs', 'Blobs', 0, 100, 35, { unit: '%', rand: [26, 60], hint: 'How much of the frame the round blobs cover (0: none)' }),
    S('Field', 'blobSize', 'Blob size', 0, 100, 50, { unit: '%', rand: [36, 79], hint: 'Size of the blobs: many small ones or a few big ones' }),
    S('Inks', 'steps', 'Steps', 2, 12, 7, { rand: [7, 10], hint: 'Levels the field is cut into; past the ground they take the inks in turn' }),
    S('Inks', 'ground', 'Ground', 0, 100, 35, { unit: '%', rand: [21, 47], hint: 'Share of the levels that show the ground' }),
    S('Inks', 'stray', 'Stray cells', 0, 100, 30, { unit: '%', rand: [12, 45], hint: 'Single cells in a random color, scattered over everything' }),
  ];

  // Constants. Lengths in frame widths unless noted.
  const K = {
    gutter: 0.39,         // line thickness: Gutter x this x the cell width (20 %: about 8 %)
    freq: [5.4, 1.8],     // field: noise frequency (per frame width) at Scale 0 -> 100 (log scale)
    oct: 3, gain: 0.5,    // field: fractal octaves and their fall-off
    noiseSd: 0.297,       // the spread of one octave of noise (for even levels)
    stretch: [6.5, 2.5],  // Streak: the field's shapes grow taller by 1 + a x Streak^b ...
    squeeze: 1.75,        // ... and narrower by 1 + this x Streak
    slip: 0.28,           // Slip 100 %: bands slide up to this far either way
    blobF: [7, 1.2],      // blobs: noise frequency at Blob size 0 -> 100 (log scale)
    blobT: [2.35, 1.9],   // blobs: they cover P(z > a - b x Blobs) of the frame (z: a normal variate) ...
    blobCover: [0.72, 0.56], // ... times a + b x Blob size (small blobs cover less) ...
    blobSd: 0.295,
    bar: [3.2, 1.6],      // ... a share of it in wide bars: a field this many times wider and less tall ...
    barShare: 0.25,       // ... (this share; the rest in round blobs)
    stray: 0.066,         // Stray cells 100 %: the chance a cell is stray
    drift: 0.18,          // animation: the view circles this far (in noise units) x Amount ...
    driftX: 1.5,          // ... the field's view this many times further across (it changes faster then)
  };

  const lerp = (a, b, t) => a + (b - a) * t;
  const loglerp = (a, b, t) => Math.exp(lerp(Math.log(a), Math.log(b), t));
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  // Normal CDF (a logistic fit, within 1 % everywhere): turns the noise into even levels.
  const Phi = (z) => 1 / (1 + Math.exp(-1.7017 * z - 0.0794 * z * z * z));
  // ... and its inverse (by halving the interval)
  const invPhi = (q) => { let a = -6, b = 6; for (let i = 0; i < 40; i++) { const m = (a + b) / 2; if (Phi(m) < q) a = m; else b = m; } return (a + b) / 2; };

  /* ---- grid ---------------------------------------------------------------------------- */
  // The rows go by the frame's exact shape (aspect, from the app), so the preview has the export's rows.
  function grid(W, H, p, aspect) {
    const cols = Math.max(2, Math.round(p.cols));
    const rows = Math.max(1, aspect > 0 ? Math.floor(cols / aspect + 0.5 + 1e-6) : Math.round((cols * H) / W));
    return { cols, rows, cw: W / cols, ch: H / rows };

  /* ---- per-variation settings (each from its own hash: changing one setting never
     reshuffles the others) ------------------------------------------------------------- */
  function setup(seed, p, n) {
    const u = (k) => hash(seed, 0x57c7, k, 5);
    const inks = Math.max(1, n - 2);
    // the inks' order through the levels: a shuffle of their own for every variation
    const order = Array.from({ length: inks }, (_, i) => i + 2);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(u(100 + i) * (i + 1));
      const t = order[i]; order[i] = order[j]; order[j] = t;
    }
    const scale = clamp01(p.scale / 100), streak = clamp01(p.streak / 100), bs = clamp01(p.blobSize / 100);
    return {
      order,
      F: loglerp(K.freq[0], K.freq[1], scale),
      squeeze: 1 + K.squeeze * streak,
      stretch: 1 + K.stretch[0] * Math.pow(streak, K.stretch[1]),
      Fb: loglerp(K.blobF[0], K.blobF[1], bs),
      // the noise views: a far-off corner of noise space for every variation
      fx: u(1) * 200 - 100, fy: u(2) * 200 - 100, bx: u(3) * 200 - 100, by: u(4) * 200 - 100,
      z: u(5) * 7, w: u(6) * 7,
    };
  }

  // The color index (0 ground, 1 blobs, 2.. inks) of every cell at time t: the frame's cells, or (General's
  // Rotation and Size) every cell of the grid running on past the frame that region R reaches.
  function cells(W, H, seed, p, n, t, amount, aspect, R) {
    const g = grid(W, H, p, aspect);
    const { cols, rows, cw, ch } = g;
    const c0 = R ? Math.floor(R.x0 / cw) : 0, c1 = R ? Math.ceil(R.x1 / cw) : cols, r0 = R ? Math.floor(R.y0 / ch) : 0, r1 = R ? Math.ceil(R.y1 / ch) : rows;

    const slip = clamp01(p.slip / 100) * K.slip;
    const band = Math.max(1, Math.round(p.band));
    const blobs = clamp01(p.blobs / 100);
    // blob thresholds: the round ones and the bars share the cover between them
    const cover = blobs > 0 ? Math.min(0.97, (1 - Phi(K.blobT[0] - K.blobT[1] * blobs)) * (K.blobCover[0] + K.blobCover[1] * clamp01(p.blobSize / 100))) : 0;
    const T = cover > 0 ? K.blobSd * invPhi(1 - cover * (1 - K.barShare)) : Infinity;

    let blobCells = 0;
    for (let r = r0; r < r1; r++) {
      const Y = ((r + 0.5) * ch) / W;
      const b = Math.floor(r / band);
      const off = slip * (2 * hash(seed, b, 0x51a9, 9) - 1);
      const yn = Y * Fy + P.fy + dy, yb = Y * Fb + P.by + dy, yb2 = (Y * Fb + dy) * K.bar[1] + P.by + 41.7;
      for (let c = c0; c < c1; c++) {
        const X = (c + 0.5) / cols;
        const k = (r - r0) * nc + (c - c0);
        // stray cells: fixed in place, over everything
        if (stray > 0 && hash(seed, c, r, 0x5e1f) < stray) { out[k] = Math.floor(hash(seed, c, r, 0x5e2f) * n); continue; }
        // blobs (not slipped)
        if (cover > 0 && (NB.noise4(X * Fb + P.bx + dx, yb, P.z + 3.3, P.w) > T || NB.noise4((X * Fb + dx) / K.bar[0] + P.bx - 37.3, yb2, P.z + 9.1, P.w) > T2)) { out[k] = 1; blobCells++; continue; }
        // the field: levels of about equal share; the lowest ones show the ground
        const v = NF.fbm4((X + off) * F + P.fx + dxf, yn, P.z, P.w, K.oct, K.gain);
        const q = Math.min(steps - 1, Math.floor(Phi(v / sd) * steps));
        out[k] = q < G ? 0 : P.order[(q - G) % P.order.length];
      }
    }
    return { g, out, steps, blobCells, c0, r0, c1, r1 };
  }

  /* ---- build ------------------------------------------------------------------------ */
  function build({ W, H, aspect, seed, p, colors, t = 0, anim, region }) {
    const n = colors.length;
    const { g, out, steps, c0, r0, c1, r1 } = cells(W, H, seed, p, n, t, anim ? anim.amount : 0, aspect, region);
    const { cols, rows, cw, ch } = g;
    // the grid lines: the palette's darkest color
    let dark = 0;
    for (let i = 1; i < n; i++) if (PL.color.luminance(colors[i]) < PL.color.luminance(colors[dark])) dark = i;
    const gw = Math.max(0, Math.min(100, p.gutter)) / 100;
    const gl = gw > 0 ? Math.max(Math.min(1, W / 900), K.gutter * gw * cw) : 0; // at least a hairline at small sizes
    const scene = new PL.Scene(W, H, colors[dark], dark);
    const names = roles(n);
    const layers = colors.map((col, i) => scene.layer(i === 0 ? 'ground' : i === 1 ? 'blobs' : 'ink-' + (i - 1), col, names[i], i));
    const seam = gl > 0 ? 0 : 0.5; // no gutter: overlap a hair so no seams show between cells
    const nc = c1 - c0;
    for (let r = r0; r < r1; r++) {
      const y0 = r * ch, y1 = r === rows - 1 ? H : (r + 1) * ch;
      for (let c = c0; c < c1; c++) {
        const x0 = c * cw, x1 = c === cols - 1 ? W : (c + 1) * cw;
        PL.Scene.rect(layers[out[(r - r0) * nc + (c - c0)]], x0 + gl, y0 + gl, x1 - x0 - gl + (c < c1 - 1 ? seam : 0), y1 - y0 - gl + (r < r1 - 1 ? seam : 0));
      }
    }
    scene.layers = scene.layers.filter((L) => L.r.length);
    scene.status = `${cols} × ${rows} cells · ${steps} steps`;
    return scene;
  }

  PL.tools.register({
    id: 'stitch',
    name: 'Stitch',
    kind: 'Backgrounds',
    tagline: 'Glitched pixel grid',
    about: 'A grid of square cells colored from a noise field cut into levels: tall streaks, bands of rows slid sideways like a glitch, round blobs of one color and a scatter of stray cells, all ruled with thin dark lines. In the animation the field drifts round a small circle, so the cells step through the colors.',
    inks: {
      min: 3, max: 12, roles, fit, spec, add, generate,
      span: () => 2, // Invert swaps the ground and the blobs
      hint: 'Ground first, then the blobs, then the inks the levels take in turn (in an order of their own for every variation). The darkest color also draws the grid lines.',
    },
    palettes: PALETTES,
    params: PARAMS,
    animLabel: 'Amount',
    animHint: 'How far the field drifts round its loop (0: still)',
    defaults: {
      anim: { amount: 0.6, fps: 12, frames: 36 },
      fx: {},
    },
    build,
    zoom: true, // draws any region of its world (General's Rotation and Size)
    _K: K,
    _cells: cells,
    _setup: setup,
  });
})();
/* ==========================================================================
   tools/quilt.js — Quilt: pixel blanket.

   1. Grid: Cells across the frame; the rows follow the frame's shape (cells
      fill the frame). Every style is drawn in folded coordinates (each cell's
      distance from the frame's centre across and up/down), so the whole
      blanket is mirrored left-right and top-bottom; shapes
      that straddle the middle merge with their mirror image.
   2. Style: thirteen blanket patterns (Cross, Bands, Tabs, Plaid, Dither, Steps,
      Zigzag, Diamond, Basket, Rings, Waves, Gingham, Star); Auto picks one per
      variation. Every variation draws its own sizes, colors and accents.
      Chunk scales every length (in cells); Cells sets the resolution.
   3. Colors: the ground, then three inks in fixed roles: the main
      ink, the second ink and an accent (thin lines, centres, sparkles). Waves
      take every ink in turn.
   4. Animation, stepped in whole cells: the woven styles
      flow toward the middle (stripes, waves, tabs, bands, baskets, zigzags),
      Steps flow toward the middle row, Rings ripple outward, Star and Diamond
      swap their two kinds of motif, Cross re-deals its accents and Dither's
      field slides through its threshold. Seamless; Intensity sets the speed
      (0 holds everything still).
   ========================================================================== */
(() => {
  const { hash } = PL.rng;

  // Ground, then the inks: main, second, accent. The default look's colors first.
  const PALETTES = [
    { name: 'Picnic', colors: ['#EDEDEB', '#EB9148', '#E7462C', '#F14762'] },
    { name: 'Lagoon', colors: ['#EEF2F1', '#2E9BFF', '#0E4C92', '#28D7C4'] },
    { name: 'Moss', colors: ['#F2F0E6', '#7FA33A', '#2F5D2A', '#E2C73A'] },
    { name: 'Plum', colors: ['#F4EEF1', '#B35CFF', '#5B1F8F', '#FF6FB5'] },
    { name: 'Sunny', colors: ['#FBF5E8', '#FFB000', '#F2541B', '#2B6BFF'] },
    { name: 'Night', colors: ['#15161A', '#EB9148', '#E7462C', '#F7E7C6'] },
    { name: 'Berry', colors: ['#FFF5F2', '#E0457B', '#7A1F4F', '#FFB36B'] },
    { name: 'Denim', colors: ['#EEF1F6', '#3A5BA0', '#1C2B4A', '#F2C14E'] },
    { name: 'Mono', colors: ['#F1F1EE', '#1C1C1C', '#7A7A7A', '#BDBDBA'] },
    { name: 'Marina', colors: ['#EEF7F8', '#00818C', '#0D2F4F', '#F66E5C'] },
  ];

  /* ---- color roles -------------------------------------------------------------------- */
  const roles = (n) => ['Ground', ...Array.from({ length: n - 1 }, (_, i) => (n === 2 ? 'Ink' : 'Ink ' + (i + 1)))];
  const spec = (n) => ({ ramp: 1, accents: Math.max(1, n - 1) });
  const isLight = (hex) => PL.color.luminance(hex) > 0.35;

  // "New colors": a pale ground (now and then a deep one), then warm-to-cool neighbours (orange,
  // red and pink, say): the main ink lightest, the second deeper, the accent vivid.
  function generate(n, rng) {
    const C = PL.color;
    const dark = rng.chance(0.12);
    const h0 = rng.float(0, 360), dir = rng.sign(), step = rng.float(24, 42);
    const out = [dark ? C.lch(rng.float(0.17, 0.22), rng.float(0.01, 0.03), h0) : C.lch(rng.float(0.94, 0.965), rng.float(0.003, 0.012), h0)];
    const Ls = [0.75, 0.58, 0.66];
    for (let i = 0; i < n - 1; i++) {
      const L = (i < 3 ? Ls[i] : rng.float(0.5, 0.78)) + rng.float(-0.03, 0.03) + (dark ? 0.06 : 0);
      out.push(C.lch(L, i === 2 ? rng.float(0.19, 0.24) : rng.float(0.14, 0.2), h0 + dir * step * i + rng.float(-6, 6)));
    }
    return out;
  }

  // + adds an ink in a hue the palette doesn't have yet.
  function add(colors) {
    const C = PL.color;
    const c = colors.slice();
    const hues = c.slice(1).filter((x) => C.hexToLch(x)[1] > 0.04).map((x) => C.hexToLch(x)[2]);
    let best = 0, bd = -1;
    for (let h = 0; h < 360; h += 10) {
      const d = hues.length ? Math.min(...hues.map((x) => Math.abs((((h - x) % 360) + 540) % 360 - 180))) : 180;
      if (d > bd) { bd = d; best = h; }
    }
    c.push(C.lch(isLight(c[0]) ? 0.64 : 0.8, 0.17, best));
    return c;
  }

  function fit(colors, n) {
    let c = (colors || []).map(PL.color.normHex).filter(Boolean);
    if (!c.length) c = PALETTES[0].colors.slice();
    if (c.length === 1) c.push(PL.color.mix(c[0], isLight(c[0]) ? '#000000' : '#FFFFFF', 0.85));
    if (c.length >= n) return c.slice(0, n);
    while (c.length < n) c = add(c);
    return c;
  }

  const STYLES = ['cross', 'bands', 'tabs', 'plaid', 'dither', 'steps', 'zigzag', 'diamond', 'basket', 'rings', 'waves', 'gingham', 'star'];
  const LABEL = { auto: 'Auto', cross: 'Cross', bands: 'Bands', tabs: 'Tabs', plaid: 'Plaid', dither: 'Dither', steps: 'Steps', zigzag: 'Zigzag',
    diamond: 'Diamond', basket: 'Basket', rings: 'Rings', waves: 'Waves', gingham: 'Gingham', star: 'Star' };
  const S = (section, key, label, min, max, def, extra = {}) => ({ section, key, label, type: 'range', min, max, def, step: 1, ...extra });
  const PARAMS = [
    { section: 'Pattern', key: 'style', label: 'Style', type: 'select', def: 'auto', options: ['auto', ...STYLES].map((v) => ({ value: v, label: LABEL[v] })) },
    S('Pattern', 'cells', 'Cells', 28, 72, 58, { rand: [34, 66], hint: 'Cells across the frame (the rows follow its shape)' }),
    S('Pattern', 'chunk', 'Chunk', 0.7, 1.8, 0.9, { step: 0.05, rand: [0.75, 1.35], hint: 'Size of the shapes, in cells' }),
  ];

  // Constants (lengths in cells at Chunk 1).
  const K = {
    flowPer: 2.5,    // flowing styles travel round(Intensity x this) of their repeats per loop (2 at .8)
    bandsPer: 1.25,  // Bands: round(Intensity x this) repeats per loop
    blink: 10,       // Cross, Star, Diamond: round(Intensity x this) steps per loop (8 at .8)
    ditherPer: 2.5,  // Dither: the field slides round(Intensity x this) times per loop
    ditherK: 1.4,    // Dither: contrast of the field (most cells come out solid or empty, dithered in between)
    margin: 0.5,     // Star, Diamond: a motif is drawn only if it fits this far inside the frame
  };

  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
  const mod = (a, n) => ((a % n) + n) % n;

  /* ---- grid ---------------------------------------------------------------------------- */
  // The rows go by the frame's exact shape (aspect, from the app), so a preview canvas a pixel off the
  // ratio gets the same rows as the export; halves round up (46 -> 35 rows at 4:3).
  function grid(W, H, p, aspect) {
    const cols = Math.max(4, Math.round(p.cells));
    const rows = Math.max(2, aspect > 0 ? Math.floor(cols / aspect + 0.5 + 1e-6) : Math.floor((cols * H) / W + 0.52));
    return { cols, rows };
  }

  // A band sequence (roles and widths) for Rings, Steps and Zigzag: two colored bands, an accent
  // line or two, and a ground gap, repeating.
  function bandSeq(u, k, minQ, maxQ) {
    const W = (x) => Math.max(1, Math.round(x * k));
    const seq = [];
    const AB = u(1) < 0.5 ? [1, 2] : [2, 1];
    if (u(2) < 0.35) seq.push([3, W(1)]);
    seq.push([AB[0], W(lerp(3, 4.6, u(3)))]);
    const mid = u(4);
    if (mid < 0.3) seq.push([3, W(1)]); else if (mid < 0.6) seq.push([0, W(lerp(2, 4, u(5)))]);
    seq.push([AB[1], W(lerp(3, 4.6, u(6)))]);
    if (u(7) < 0.8) seq.push([3, W(1)]);
    const used = seq.reduce((s, b) => s + b[1], 0);
    const Q = Math.max(used + W(3), Math.round(lerp(minQ, maxQ, u(8)) * k));
    seq.push([0, Q - used]);
    return { seq, Q };
  }
  const lookup = (seq, Q, x) => { let a = mod(x, Q); for (const [r, w] of seq) { if (a < w) return r; a -= w; } return 0; };

  /* ---- per-variation settings ------------------------------------------------------------ */
  function setup(seed, p, n, cols, rows) {
    const u = (i) => hash(seed, 0x9a17, i, 11);
    const style = STYLES.includes(p.style) ? p.style : STYLES[Math.floor(hash(seed, 0x51e7, 1, 0) * STYLES.length) % STYLES.length];
    const k = Math.max(0.5, Math.min(2, p.chunk || 1));
    const R = (x) => Math.max(1, Math.round(x * k));
    const P = { style, k, seed };
    switch (style) {
      case 'cross': {
        const b = lerp(7, 8.4, u(1)), r = lerp(0.3, 0.42, u(2));
        P.P = Math.max(3, Math.round(b * k)); P.A = Math.max(1.05, r * b * k); P.T = Math.max(0.55, 0.95 * k);
        P.swap = u(3) < 0.3; P.pa = lerp(0.06, 0.24, u(5)); // accents: re-dealt at every step of the animation
        break;
      }
      case 'star': {
        // an eight-pointed star: a diamond and a square, the orange ones with a pink diamond centre
        P.P = Math.max(4, Math.round(lerp(10, 14, u(1)) * k));
        P.rho = 0.44 * P.P; P.sq = 0.26 * P.P; P.rin = 0.19 * P.P;
        break;
      }
      case 'diamond': {
        // concentric diamonds, now and then squashed (wider than tall); the pitch follows their size
        P.a = Math.max(1.5, lerp(4, 5.2, u(1)) * k); P.b = P.a * (u(3) < 0.5 ? 1 : lerp(0.7, 0.95, u(4)));
        P.Px = Math.max(3, Math.round(2 * P.a + 0.4)); P.Py = Math.max(3, Math.round(2 * P.b + 0.4)); P.cin = 0.48;
        P.flip = u(2) < 0.5 ? 1 : 0;
        break;
      }
      case 'plaid':
        P.Pp = Math.max(5, Math.round((u(1) < 0.55 ? 10 : lerp(9, 12.4, u(6))) * k)); P.w = Math.max(1, Math.round((u(2) < 0.7 ? 2 : 3) * k));
        P.line = Math.round((u(3) < 0.6 ? 0.6 : lerp(0.48, 0.74, u(5))) * P.Pp); P.lw = R(1); P.line2 = u(4) < 0.25;
        break;
      case 'gingham':
        P.Pp = Math.max(4, Math.round(lerp(7.6, 10.4, u(1)) * k));
        break;
      case 'basket':
        P.B = Math.max(2, Math.round(lerp(4.6, 6.4, u(1)) * k)); P.q = Math.max(1, Math.round(k)); P.swap = u(2) < 0.25;
        break;
      case 'rings': Object.assign(P, bandSeq(u, k, 9, 16)); P.off = P.seq[P.seq.length - 1][1]; break; // a ground core in the middle
      case 'steps': {
        Object.assign(P, bandSeq(u, k, 15, 20));
        P.w = Math.max(2, Math.round(lerp(2.6, 4.4, u(20)) * k)); P.h = Math.max(1, Math.round(2 * k)); P.ph = u(21) < 0.5 ? P.w / 2 : 0;
        P.off = Math.floor(u(22) * P.Q);
        break;
      }
      case 'zigzag': {
        Object.assign(P, bandSeq(u, k, 11, 15));
        P.Pz = 2 * Math.max(3, Math.round(lerp(6, 8, u(20)) * k)); P.a = lerp(0.6, 1, u(21)); P.off = Math.floor(u(22) * P.Q);
        break;
      }
      case 'waves':
        // the usual waves most of the time (crests every 13 cells, a wave every 4 rows, 2 thick), varied now and then
        P.Pw = Math.max(6, Math.round((u(1) < 0.5 ? 13 : lerp(11, 16.4, u(3))) * k)); P.Q = Math.max(2, Math.round((u(4) < 0.7 ? 4 : 5) * k));
        P.T = Math.max(1, (P.Q >= 5 * k && u(5) < 0.4 ? 3 : 2) * k);
        P.top = 0.97 * k; P.depth = (u(6) < 0.5 ? 1.9 : lerp(1.4, 2.6, u(7))) * k; P.first = u(2) < 0.75 ? 2 : 1;
        break;
      case 'tabs': {
        P.a = Math.max(2, Math.round(lerp(2.6, 5.4, u(1)) * k)); P.g = Math.max(1, Math.round(2 * k)); P.p = P.a + P.g;
        P.h = Math.max(1, Math.round(2 * k)); P.rp = P.h + Math.max(1, Math.round(k)); P.pa = lerp(0.35, 0.65, u(2));
        break;
      }
      case 'bands': {
        P.hb = Math.max(1, Math.round(2 * k)); P.Lb = Math.max(8, Math.round(lerp(22, 30, u(1)) * k));
        P.bands = new Map();
        break;
      }
      case 'dither': {
        // three waves in folded coordinates: diagonals (an X through the middle), diamonds, and
        // ellipses round the centre; their sum is printed through a 2 x 2 ordered dither
        P.p1 = lerp(12, 22, u(1)) * k; P.p2 = lerp(14, 26, u(2)) * k; P.p3 = lerp(10, 18, u(3)) * k; P.ex = lerp(0.6, 1.5, u(9));
        P.f1 = u(4); P.f2 = u(5); P.f3 = u(6);
        P.w1 = lerp(0.5, 1, u(7)); P.w2 = lerp(0.2, 0.9, u(10)); P.w3 = lerp(0.3, 1, u(11)); P.bias = lerp(-0.08, 0.08, u(8));
        break;
      }
    }
    return P;
  }

  // Settings that follow from others and from the grid (after any test override).
  function derive(P, cols, rows) {
    if (P.style === 'cross') {
      // only whole crosses: the outer ones' arms end inside the frame
      P.maxI = Math.max(0, Math.floor((cols + 0.5 - 2 * P.A) / (2 * P.P))); P.maxJ = Math.max(0, Math.floor((rows + 0.5 - 2 * P.A) / (2 * P.P)));
      // accents: a shuffled round of the (mirrored) cross positions; every step of the loop moves on
      // to the next few, so the sparkles never sit still and never repeat within a loop
      const ni = P.maxI + 1, keys = [];
      for (let j = 0; j <= P.maxJ; j++) for (let i = 0; i <= P.maxI; i++) keys.push([hash(P.seed, i, j, 0xa11), j * ni + i]);
      keys.sort((a, b) => a[0] - b[0]);
      P.rank = new Int16Array(keys.length); keys.forEach(([, id], r) => { P.rank[id] = r; });
      P.npos = keys.length; P.nacc = P.pa > 0 ? Math.max(1, Math.round(P.pa * P.npos)) : 0;
    } else if (P.style === 'star') {
      // only motifs that fit inside the frame (with a small margin)
      P.maxI = Math.max(0, Math.floor((cols / 2 - K.margin - P.rho) / P.P)); P.maxJ = Math.max(0, Math.floor((rows / 2 - K.margin - P.rho) / P.P));
    } else if (P.style === 'diamond') {
      P.maxI = Math.max(0, Math.floor((cols / 2 - K.margin - P.a) / P.Px)); P.maxJ = Math.max(0, Math.floor((rows / 2 - K.margin - P.b) / P.Py));
    }
    return P;
  }

  // Bands: one periodic run sequence per band (built once per band, then reused)
  function bandRow(P, seed, j) {
    let s = P.bands.get(j);
    if (s) return s;
    const k = P.k, L = P.Lb, runs = [];
    let len = 0, prev = -1, i = 0;
    const h = (a) => hash(seed, j, 0xba7d + i * 7 + a, 13);
    while (len < L) {
      let role;
      const x = h(1);
      role = x < 0.3 ? 0 : x < 0.65 ? 1 : 2;
      if (role === prev) role = role === 0 ? (h(2) < 0.5 ? 1 : 2) : 0;
      let w = Math.max(2, Math.round((role === 0 ? lerp(4, 14, h(3)) : lerp(3, 13, h(3))) * k));
      w = Math.min(w, L - len);
      if (role > 0 && w >= Math.round(6 * k) && h(4) < 0.4) {
        const pw = Math.max(1, Math.round(2 * k)), at = Math.max(1, Math.min(w - pw - 1, Math.round(lerp(0.2, 0.7, h(5)) * (w - pw))));
        runs.push([role, at], [3, pw], [role, w - at - pw]);
      } else runs.push([role, w]);
      len += w; prev = role; i++;
    }
    s = { runs, L };
    P.bands.set(j, s);
    return s;
  }

  // Steps per loop for the stepped styles, and the step at time t.
  function stepsPerLoop(P, amount) {
    const a = Math.max(0, amount || 0);
    if (a === 0) return 0;
    const st = P.style, m = (per) => Math.max(1, Math.round(a * per));
    switch (st) {
      case 'cross': return Math.max(1, Math.round(a * K.blink));
      case 'star': case 'diamond': return 2 * Math.max(1, Math.round((a * K.blink) / 2)); // even, so the swap loops
      case 'bands': return m(K.bandsPer) * P.Lb;
      case 'gingham': case 'plaid': return m(K.flowPer) * P.Pp;
      case 'basket': return m(K.flowPer) * 2 * P.B;
      case 'waves': return m(K.flowPer) * P.Pw;
      case 'zigzag': return m(K.flowPer) * P.Pz;
      case 'tabs': return m(K.flowPer) * P.p;
      case 'rings': case 'steps': return m(K.flowPer) * P.Q;
      default: return 0;
    }
  }

  /* ---- the cells ----------------------------------------------------------------------- */
  // Role of every cell (0 ground, 1 main ink, 2 second ink, 3 accent, 4+ more inks) at time t: the
  // frame's cells, or (General's Rotation and Size) every cell region R reaches. Past the frame the blanket
  // runs on (its folded coordinates just grow), and the motifs that only whole ones show in the frame
  // (crosses, stars, diamonds) carry on too.
  function cells(W, H, seed, p, n, t, amount, aspect, R) {
    const g = grid(W, H, p, aspect);
    const { cols, rows } = g;
    const P = derive(Object.assign(setup(seed, p, n, cols, rows), FORCE || {}), cols, rows);
    const cwd = W / cols, chd = H / rows;
    const c0 = R ? Math.floor(R.x0 / cwd) : 0, c1 = R ? Math.ceil(R.x1 / cwd) : cols, r0 = R ? Math.floor(R.y0 / chd) : 0, r1 = R ? Math.ceil(R.y1 / chd) : rows;
    const nc = c1 - c0;
    const maxI0 = P.maxI, maxJ0 = P.maxJ;
    if (R && (R.x0 < 0 || R.y0 < 0 || R.x1 > W || R.y1 > H)) { P.maxI = Infinity; P.maxJ = Infinity; }
    // a cross's place in the accents' round (crosses past the frame's own: a place of their own)
    const rankOf = (i, j) => (i <= maxI0 && j <= maxJ0 ? P.rank[j * (maxI0 + 1) + i] : Math.floor(hash(P.seed, i, j, 0xa12) * P.npos));
    const tt = ((t % 1) + 1) % 1;
    const N = stepsPerLoop(P, amount);
    const s = N ? Math.floor(N * tt + 1e-9) : 0;
    const out = new Uint8Array(nc * (r1 - r0));
    const cx = cols / 2, cy = rows / 2, k = P.k;
    const nInk = Math.max(1, n - 1);
    // the inks that alternate in cycling styles: main and second, then any inks past the accent
    const cyc = [1, 2]; for (let i = 4; i <= nInk; i++) cyc.push(i);
    const cyclic = (i) => cyc[mod(i, cyc.length)];
    for (let y = r0; y < r1; y++) {
      const v = Math.abs(y + 0.5 - cy);
      for (let x = c0; x < c1; x++) {
        const uu = Math.abs(x + 0.5 - cx);
        let r = 0;
        switch (P.style) {
          case 'cross': {
            const i = Math.round(uu / P.P), j = Math.round(v / P.P);
            if (i > P.maxI || j > P.maxJ) break;
            const du = Math.abs(uu - i * P.P), dv = Math.abs(v - j * P.P);
            if ((du < P.A && dv < P.T) || (du < P.T && dv < P.A)) {
              r = ((i + j) & 1) === (P.swap ? 1 : 0) ? 2 : 1;
              if (P.nacc && mod(rankOf(i, j) - (N ? mod(s, N) : 0) * P.nacc, P.npos) < P.nacc) r = 3;
            }
            break;
          }
          case 'star': {
            const i = Math.round(uu / P.P), j = Math.round(v / P.P);
            if (i > P.maxI || j > P.maxJ) break;
            const du = Math.abs(uu - i * P.P), dv = Math.abs(v - j * P.P);
            const kind = (i + j + s) & 1; // the two kinds swap at every step of the animation
            if (du + dv <= P.rho || (du <= P.sq && dv <= P.sq)) r = kind ? (du + dv <= P.rin ? 3 : 1) : 2;
            break;
          }
          case 'diamond': {
            const i = Math.round(uu / P.Px), j = Math.round(v / P.Py);
            if (i > P.maxI || j > P.maxJ) break;
            const e = Math.abs(uu - i * P.Px) / P.a + Math.abs(v - j * P.Py) / P.b;
            if (e <= 1) {
              const kind = (i + j + s + P.flip) & 1, inner = e <= P.cin;
              r = kind ? (inner ? 3 : 1) : (inner ? 1 : 2);
            }
            break;
          }
          case 'plaid': {
            const a = mod(uu + s, P.Pp), b = mod(v, P.Pp);
            const sa = a < P.w, sb = b < P.w;
            if (sa && sb) r = 2;
            else if (sa || sb) r = 1;
            else {
              const la = (a >= P.line && a < P.line + P.lw) || (P.line2 && a >= P.Pp - P.lw - 1 && a < P.Pp - 1);
              const lb = (b >= P.line && b < P.line + P.lw) || (P.line2 && b >= P.Pp - P.lw - 1 && b < P.Pp - 1);
              if (la || lb) r = 3;
            }
            break;
          }
          case 'gingham': {
            const sa = mod(uu + s, P.Pp) >= P.Pp / 2, sb = mod(v, P.Pp) >= P.Pp / 2;
            r = sa && sb ? 2 : sa || sb ? 1 : 0;
            break;
          }
          case 'basket': {
            const U = uu + s, half = P.q;
            const blk = (Math.floor(U / P.B) + Math.floor(v / P.B)) & 1;
            if (blk === 0) { if ((Math.floor(U / half) & 1) === 0) r = P.swap ? 1 : 2; }
            else if ((Math.floor(v / half) & 1) === 0) r = P.swap ? 2 : 1;
            break;
          }
          case 'rings': {
            const d = Math.max(v, (uu * rows) / cols);
            r = lookup(P.seq, P.Q, d - s - P.off);
            break;
          }
          case 'steps': {
            const D = P.h * Math.floor((uu + P.ph) / P.w) + v + s;
            r = lookup(P.seq, P.Q, D + P.off);
            break;
          }
          case 'zigzag': {
            const half = P.Pz / 2, tri = Math.abs(mod(uu + s, P.Pz) - half);
            r = lookup(P.seq, P.Q, v + P.a * tri + P.off);
            break;
          }
          case 'waves': {
            const du = Math.abs(mod(uu + s, P.Pw) - P.Pw / 2); // distance to the nearest crest
            const c = P.depth / ((P.Pw / 2) * (P.Pw / 2));
            const top = P.top + c * du * du;
            const w0 = Math.floor((v - top - P.T) / P.Q) + 1; // the lowest wave whose band could reach v
            for (let w = w0; w <= w0 + 1; w++) {
              const rel = v - w * P.Q;
              if (rel >= top && rel < top + P.T) { r = cyclic(w + (P.first === 2 ? 1 : 0)); break; }
            }
            break;
          }
          case 'tabs': {
            const j = Math.floor(v / P.rp);
            if (v - j * P.rp >= P.h) break;
            const ph = (j & 1) ? Math.floor(P.p / 2) : 0;
            const U = uu + s + ph;
            if (mod(U, P.p) >= P.a) break;
            // accents stay put on the frame: the tab's current slot decides its color
            const slot = Math.round((Math.floor(U / P.p) * P.p - ph - s + P.a / 2) / P.p);
            r = hash(seed, Math.abs(slot), j, 0x7ab5) < P.pa * Math.max(0, 1 - 0.2 * (Math.abs(slot) + j)) ? 2 : 1;
            break;
          }
          case 'bands': {
            const j = Math.floor(v / P.hb);
            const row = bandRow(P, seed, j);
            let a = mod(uu + s, row.L);
            for (const [role, w] of row.runs) { if (a < w) { r = role; break; } a -= w; }

            // a knitted field (diagonals and diamonds, mirrored) printed through a 2 x 2 ordered dither
            const tp = Math.round(Math.max(0, amount || 0) * K.ditherPer) * tt;
            const f = P.w1 * Math.cos(2 * Math.PI * ((uu - v) / P.p1 + P.f1 + tp)) + P.w2 * Math.cos(2 * Math.PI * ((uu + v) / P.p2 + P.f2))
              + P.w3 * Math.cos(2 * Math.PI * (Math.hypot(uu / P.ex, v * P.ex) / P.p3 + P.f3 - tp));
            const level = clamp01(0.5 + (K.ditherK * f) / (P.w1 + P.w2 + P.w3) + P.bias);
            const bx = Math.floor(uu) & 1, by = Math.floor(v) & 1;
            const thr = (bx === 0 ? (by === 0 ? 0.125 : 0.875) : (by === 0 ? 0.625 : 0.375));
            r = level > thr ? 1 : 0;
            break;
          }
        }
        out[(y - r0) * nc + (x - c0)] = r;
      }
    }
    return { g, out, P, N, s, c0, c1, r0, r1 };
  }

  /* ---- build ------------------------------------------------------------------------ */
  let FORCE = null; // tests: override per-variation settings
  function build({ W, H, aspect, seed, p, colors, t = 0, anim, region }) {
    const n = colors.length;
    const { g, out, P, c0, c1, r0, r1 } = cells(W, H, seed, p, n, t, anim ? anim.amount : 0, aspect, region);
    const nc = c1 - c0;
    const { cols, rows } = g;
    const nInk = Math.max(1, n - 1);
    const pal = (r) => (r === 0 ? 0 : 1 + ((r - 1) % nInk));
    const scene = new PL.Scene(W, H, colors[0], 0);
    const names = roles(n);
    const layers = [];
    const layerFor = (ci) => layers[ci] || (layers[ci] = scene.layer('ink-' + ci, colors[ci], names[ci], ci));
    // cells snap to the output's whole pixels: zs of them to a frame pixel (zoomed in by General's Size, more)
    const zs = region && region.z > 1 ? region.z : 1;

    for (let y = r0; y < r1; y++) {
      const y0 = Y(y), y1 = Y(y + 1), row = (y - r0) * nc - c0;
      let x = c0;
      while (x < c1) {
        const ci = pal(out[row + x]);
        let e = x + 1;
        while (e < c1 && pal(out[row + e]) === ci) e++;
        if (ci > 0) { PL.Scene.rect(layerFor(ci), X(x), y0, X(e) - X(x), y1 - y0); painted += e - x; }
        x = e;
      }
    }
    scene.layers = scene.layers.filter((L) => L.r.length).sort((a, b) => a.ci - b.ci);
    scene.status = `${LABEL[P.style].toLowerCase()} · ${cols} × ${rows} cells`;
    return scene;
  }

  PL.tools.register({
    id: 'quilt',
    name: 'Quilt',
    kind: 'Backgrounds',
    tagline: 'Pixel blanket',
    about: 'Woven pixel blankets, mirrored from the middle: crosses, stars and diamonds, plaid, gingham, basket weave, bands, tabs, steps, zigzags, waves, rings and a knitted dither. In the animation the weave flows toward the middle, the rings ripple out and the motifs swap colors, one cell at a time.',
    inks: {
      min: 2, max: 8, roles, fit, spec, add, generate,
      span: () => 2, // Invert swaps the ground and the main ink
      hint: 'Ground first, then the inks: the main ink, the second ink and the accent (thin lines, centres, sparkles). Waves take every ink in turn.',
    },
    palettes: PALETTES,
    params: PARAMS,
    animLabel: 'Intensity',
    animHint: 'How fast the blanket moves (0: still)',
    defaults: {
      anim: { amount: 0.8, fps: 10, frames: 60 },
      fx: {},
    },
    build,
    zoom: true, // draws any region of its world (General's Rotation and Size)
    _K: K,
    _cells: cells,
    _setup: setup,
    _force: (f) => { FORCE = f; },
  });
})();
/* ==========================================================================
   tools/modular.js — Modular: modular grid.

   1. Grid: Modules across the frame; the rows follow its shape (modules fill
      the frame, halves round up). Every module is cut into Units per module
      across and down, and Merging joins neighbouring modules into 2 x 1, 1 x 2
      and 2 x 2 pieces.
   2. Treatments: every piece draws one of six, picked by the Treatments weights
      (each piece keeps its place along the weights, so moving one slider only
      shifts the pieces near that boundary): Empty (the
      background), Solid (one ink), Blocks (a two-colour pixel field on the unit
      grid), Dot matrix (dots where the field is on), Line grid (thin lines on
      the unit grid) and Gradient (two inks across, down or corner to corner).
      A piece keeps its two colours whatever its treatment.
   3. Detail: Block fill sets how much of the field is on, Dot size the dots,
      Grid lines how strongly the rules between the modules show, Line weight
      the rules and the line grids (in px at a 2400 px frame).
   4. Animation: the field under the blocks and the
      dots drifts, so units flick on and off, in four eased beats per loop
      (slow at each beat, quick between). Seamless; Intensity sets how far the
      field moves (0 holds everything still).
   ========================================================================== */
(() => {
  const { hash } = PL.rng;

  // Background, rules, then the inks. The default look uses Bauhaus (defaults.palette).
  const PALETTES = [
    { name: 'Clay', colors: ['#2B1D16', '#F1E4D8', '#D9734E', '#E8B04B', '#8FB59A', '#F4E9D8'] },
    { name: 'Sorbet', colors: ['#151316', '#EEE8EA', '#E36487', '#D76632', '#EFEA75', '#E6FCA3'] },
    { name: 'Midnight', colors: ['#000000', '#FFFFFF', '#E36487', '#D76632', '#EFEA75', '#E6FCA3'] },
    { name: 'Tetrad', colors: ['#F6F3EC', '#1B1D23', '#E36650', '#EBC751', '#0097AC', '#39489E'] }, // rectangle tetrad 32/92/212/272
    { name: 'Ocean', colors: ['#0B1320', '#D7E3F4', '#1F6FEB', '#58A6FF', '#A5D6FF', '#F78166'] },
    { name: 'Mint', colors: ['#0F1A17', '#DDEDE6', '#3DDC97', '#1B998B', '#F7F7F2', '#FFC857'] },
    { name: 'Bauhaus', colors: ['#F3EEE4', '#161616', '#E2432C', '#2450C8', '#F4B400', '#1F8A5B'] },
    { name: 'Dusk', colors: ['#1B1530', '#F4E8FF', '#FF7A9A', '#FFB86B', '#7C6CFF', '#3DD6C6'] },
    { name: 'Mono', colors: ['#111111', '#F5F5F5', '#FFFFFF', '#BBBBBB', '#6B6B6B', '#2E2E2E'] },
    { name: 'Duo', colors: ['#F2EEE6', '#1B1B1B', '#1B3BFF', '#FF5A36'] },
  ];

  /* ---- colour roles -------------------------------------------------------------------- */
  const roles = (n) => ['Background', 'Rules', ...Array.from({ length: n - 2 }, (_, i) => (n === 3 ? 'Ink' : 'Ink ' + (i + 1)))];
  const spec = (n) => ({ ramp: 1, accents: Math.max(1, n - 2) });
  const isLight = (hex) => PL.color.luminance(hex) > 0.35;

  // "New colors": a deep background (now and then a pale one) with rules in its opposite, then
  // inks round one part of the colour wheel (pink, orange, yellow and lime, say):
  // two mid inks and two light ones by turns.
  function generate(n, rng) {
    const C = PL.color;
    const light = rng.chance(0.2);
    const h0 = rng.float(0, 360), dir = rng.sign(), step = rng.float(22, 48);
    const out = light
      ? [C.lch(rng.float(0.94, 0.97), rng.float(0.005, 0.02), h0), C.lch(rng.float(0.16, 0.22), rng.float(0.005, 0.02), h0)]
      : [C.lch(rng.float(0.12, 0.17), rng.float(0.005, 0.015), h0), C.lch(rng.float(0.92, 0.95), rng.float(0.006, 0.015), h0)];
    const Ls = light ? [0.62, 0.5, 0.74, 0.4] : [0.62, 0.6, 0.91, 0.95]; // on a pale ground: mid and deep inks
    for (let i = 0; i < n - 2; i++) {
      const L = (i < 4 ? Ls[i] : light ? rng.float(0.4, 0.75) : rng.float(0.6, 0.93)) + rng.float(-0.03, 0.03);
      out.push(C.lch(L, L > 0.85 ? rng.float(0.12, 0.17) : rng.float(0.15, 0.2), h0 + dir * step * i + rng.float(-8, 8)));
    }
    return out;
  }

  // + adds an ink in a hue the palette doesn't have yet.
  function add(colors) {
    const C = PL.color;
    const c = colors.slice();
    const hues = c.slice(2).filter((x) => C.hexToLch(x)[1] > 0.04).map((x) => C.hexToLch(x)[2]);
    let best = 0, bd = -1;
    for (let h = 0; h < 360; h += 10) {
      const d = hues.length ? Math.min(...hues.map((x) => Math.abs((((h - x) % 360) + 540) % 360 - 180))) : 180;
      if (d > bd) { bd = d; best = h; }

    c.push(C.lch(0.72, 0.16, best));
    return c;
  }

  function fit(colors, n) {
    let c = (colors || []).map(PL.color.normHex).filter(Boolean);
    if (!c.length) c = PALETTES[0].colors.slice();
    if (c.length === 1) c.push(PL.color.mix(c[0], isLight(c[0]) ? '#000000' : '#FFFFFF', 0.9));
    if (c.length >= n) return c.slice(0, n);

    return c;
  }

  /* ---- settings -------------------------------------------------------------------------- */
  const S = (section, key, label, min, max, def, extra = {}) => ({ section, key, label, type: 'range', min, max, def, step: 1, ...extra });
  const W8 = 'Weight: how often a piece gets this treatment';
  const PARAMS = [
    S('Layout', 'modules', 'Modules across', 2, 12, 9, { rand: [6, 12], hint: 'Modules across the frame (the rows follow its shape)' }),
    S('Layout', 'units', 'Units', 2, 12, 7, { rand: [4, 12], hint: 'Units per module: each module is cut into this many across and down' }),
    S('Layout', 'merging', 'Merging', 0, 100, 45, { unit: '%', rand: [25, 65], hint: 'Share of modules joined into 2 x 1, 1 x 2 and 2 x 2 pieces' }),
    S('Treatments', 'empty', 'Empty', 0, 100, 34, { rand: [20, 45], hint: W8 + ' (the background shows)' }),
    S('Treatments', 'solid', 'Solid', 0, 100, 20, { rand: [10, 32], hint: W8 + ' (one ink)' }),
    S('Treatments', 'blocks', 'Blocks', 0, 100, 24, { rand: [14, 34], hint: W8 + ' (a two-color pixel field)' }),
    S('Treatments', 'dots', 'Dot matrix', 0, 100, 11, { rand: [6, 22], hint: W8 + ' (dots on the unit grid)' }),
    S('Treatments', 'lines', 'Line grid', 0, 100, 0, { rand: [0, 18], hint: W8 + ' (thin lines on the unit grid)' }),
    S('Treatments', 'gradient', 'Gradient', 0, 100, 10, { rand: [4, 16], hint: W8 + ' (two inks blended)' }),
    S('Detail', 'fill', 'Block fill', 10, 90, 50, { unit: '%', rand: [35, 65], hint: 'How much of the blocks and dot matrices is on' }),
    S('Detail', 'dot', 'Dot size', 20, 100, 76, { unit: '%', rand: [50, 90], hint: 'Dot diameter, as a share of a unit' }),
    S('Detail', 'grid', 'Grid lines', 0, 100, 32, { unit: '%', rand: [12, 45], hint: 'How strongly the rules between the modules show' }),
    S('Detail', 'weight', 'Line weight', 0.5, 4, 1, { step: 0.5, rand: [0.5, 1.5], hint: 'Thickness of the rules and the line grids (px at 2400 px)' }),
  ];
  const TREAT = ['empty', 'solid', 'blocks', 'dots', 'lines', 'gradient'];

  const K = {
    freq: 0.3,        // field frequency, per unit: neighbouring units share a colour about 68 % of the time,
                      // two apart 53 %, then no more than chance (whatever the units per module)
    oct: 1,           // octaves of the field
    gain: 0.5,
    levels: 4000,     // samples of the field behind its fill levels (Block fill = the share on)
    merge: [0.5, 0.25, 0.25], // a merged piece: 2 x 2, 2 x 1 or 1 x 2
    bgBase: 0.4,      // share of blocks, dot matrices and line grids drawn on the background
    beats: 4,         // the field moves in this many eased beats per loop
    radius: 0.6,      // how far the field travels round the loop at Intensity 1 (noise units); at the
                      // default 0.5 a unit flicks on and off about once a loop (2.2 changes)
    lineAlpha: 0.85,  // line grid opacity
    ref: 2400,        // Line weight is in px at a frame this size
  };

  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);

  // The field's levels: sorted samples of it (far apart, at random times), so a share of units
  // on maps to a threshold exactly (Block fill 10 % turns a tenth of the units on).
  let LEVELS = null;
  function cutFor(fill) {
    if (!LEVELS) {
      const NF = PL.noise.get(0x2b1d), v = new Float64Array(K.levels);
      for (let i = 0; i < K.levels; i++) {
        const h = (k) => hash(0x2b1d, i, k, 3) * 1000;
        v[i] = NF.fbm4(h(1), h(2), h(3), h(4), K.oct, K.gain);
      }

    }
    const q = clamp01(1 - fill) * (LEVELS.length - 1), i = Math.floor(q), f = q - i;
    return i >= LEVELS.length - 1 ? LEVELS[LEVELS.length - 1] + 1 : LEVELS[i] + (LEVELS[i + 1] - LEVELS[i]) * f;

  /* ---- grid and pieces ---------------------------------------------------------------- */
  // The rows go by the frame's exact shape (aspect, from the app); halves round up
  // (12 -> 21 rows at 9:16, 10 at 5:4, 7 at 16:9; 2 -> 2 and 7 -> 5 at 4:3).
  function grid(W, H, p, aspect) {
    const cols = Math.max(1, Math.round(p.modules));
    const a = aspect > 0 ? aspect : W / H;

    return { cols, rows, U: Math.max(1, Math.round(p.units)) };

  // under Merging (the shape by a second number, the first that fits), else stays single.
  // (ox, oy): past the frame (General's Rotation and Size) the grid carries on in frame-sized blocks of
  // modules, each merged the same way from its own place in the grid (so no two blocks are alike).
  function pieces(seed, cols, rows, merging, ox = 0, oy = 0) {
    const own = new Int32Array(cols * rows).fill(-1);
    const out = [];
    const free = (x, y, w, h) => {
      if (x + w > cols || y + h > rows) return false;
      for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (own[(y + j) * cols + x + i] >= 0) return false;
      return true;
    };
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        if (own[y * cols + x] >= 0) continue;
        let w = 1, h = 1;
        if (hash(seed, ox + x, oy + y, 0x3e17) < merging) {
          const r = hash(seed, ox + x, oy + y, 0x3e18), m = K.merge;
          const order = r < m[0] ? [[2, 2], [2, 1], [1, 2]] : r < m[0] + m[1] ? [[2, 1], [1, 2], [2, 2]] : [[1, 2], [2, 1], [2, 2]];
          for (const [sw, sh] of order) if (free(x, y, sw, sh)) { w = sw; h = sh; break; }
        }
        for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) own[(y + j) * cols + x + i] = out.length;

  }

  // Each piece: a treatment from its place along the weights, an ink, a base (the background
  // or a second ink), a gradient direction and its own patch of the field.
  function dress(seed, P, p, nInk) {
    const wts = TREAT.map((k) => Math.max(0, +p[k] || 0));
    const tot = wts.reduce((a, b) => a + b, 0);
    const u = (k) => hash(seed, P.x, P.y, 0x7a10 + k);
    let t = 'empty';
    if (tot > 0) {
      let v = u(0) * tot;
      for (let i = 0; i < TREAT.length; i++) { if (v < wts[i] || i === TREAT.length - 1) { t = TREAT[i]; break; } v -= wts[i]; }
    }
    const a = Math.floor(u(1) * nInk) % nInk;
    const other = nInk > 1 ? (a + 1 + Math.floor(u(3) * (nInk - 1))) % nInk : a;
    const onBg = nInk < 2 || u(2) < K.bgBase;

      t,
      ink: 2 + a,                              // palette index of the piece's ink
      base: onBg ? 0 : 2 + other,              // under the blocks, dots and lines
      ink2: 2 + other,                         // the gradient's second ink
      dir: Math.floor(u(4) * 4) % 4,           // across, down, corner to corner either way
      ox: u(5) * 97.3, oy: u(6) * 61.7, oz: u(7) * 37.1, ow: u(8) * 53.9,
    };
  }

    const tt = ((t % 1) + 1) % 1, b = tt * K.beats, k = Math.floor(b), f = b - k;

  // The field's on / off state for every unit of a piece at time t (Block fill = share on).
  function field(NF, D, P, U, fill, t, amount) {
    const nx = P.w * U, ny = P.h * U, out = new Uint8Array(nx * ny);
    const th = 2 * Math.PI * beatTime(t), R = K.radius * Math.max(0, amount || 0);
    const z = D.oz + R * (Math.cos(th) - 1), w = D.ow + R * Math.sin(th);
    const cut = cutFor(fill);
    for (let j = 0; j < ny; j++) {
      const Y = (P.y * U + j + 0.5) * K.freq + D.oy;
      for (let i = 0; i < nx; i++) {
        const X = (P.x * U + i + 0.5) * K.freq + D.ox;
        if (NF.fbm4(X, Y, z, w, K.oct, K.gain) > cut) out[j * nx + i] = 1;
      }

  }

  /* ---- build ---------------------------------------------------------------------------- */
  // region (General's Rotation and Size): the part of the world to cover (see pieces)
  function build({ W, H, aspect, seed, p, colors, t = 0, anim, crisp, refL, region }) {
    const n = colors.length, nInk = Math.max(1, n - 2);
    const { cols, rows, U } = grid(W, H, p, aspect);
    const mw = W / cols, mh = H / rows, uw = mw / U, uh = mh / U;
    const snap = crisp !== false;
    const zs = region && region.z > 1 ? region.z : 1; // output pixels to a frame pixel (zoomed in by General's Size, more)
    const X = (v) => (snap ? Math.round(v * uw * zs) / zs : v * uw); // v in units, from the left edge (on whole output pixels)
    const Y = (v) => (snap ? Math.round(v * uh * zs) / zs : v * uh);
    const L = Math.max(W, H);
    const weight = Math.max(0.1, +p.weight || 1);
    // line width: true to the frame in exports; previews keep the rules visible (a pixel at least)
    let lw = (weight * L) / K.ref;
    if (refL && L < 0.95 * refL) lw = Math.max(lw, Math.min(1, weight, 0.22 * Math.min(uw, uh))); // never more than a fifth of a unit
    const NF = PL.noise.get((seed ^ 0x4d0d1a7) >>> 0);
    const merging = clamp01((+p.merging || 0) / 100);
    let list;
    const R = region;
    const mx0 = R ? Math.floor(R.x0 / mw) : 0, mx1 = R ? Math.ceil(R.x1 / mw) : cols, my0 = R ? Math.floor(R.y0 / mh) : 0, my1 = R ? Math.ceil(R.y1 / mh) : rows;
    if (!R) list = pieces(seed, cols, rows, merging);
    else {
      list = [];
      for (let tj = Math.floor(my0 / rows); tj <= Math.floor((my1 - 1) / rows); tj++) {
        for (let ti = Math.floor(mx0 / cols); ti <= Math.floor((mx1 - 1) / cols); ti++) {
          for (const P of pieces(seed, cols, rows, merging, ti * cols, tj * rows)) if (P.x + P.w > mx0 && P.x < mx1 && P.y + P.h > my0 && P.y < my1) list.push(P);
        }
      }
    }
    const fill = clamp01((p.fill == null ? 50 : p.fill) / 100);
    const amount = anim ? anim.amount : 0;
    const rDot = (clamp01((p.dot == null ? 62 : p.dot) / 100) * Math.min(uw, uh)) / 2;

    // collect the geometry first, then make the layers in drawing order:
    // fills, gradients, blocks and dots, line grids, rules
    const fills = new Map(), marks = new Map(), lines = new Map(), grads = [];
    const get = (m, ci) => { let a = m.get(ci); if (!a) m.set(ci, (a = { r: [], c: [], s: [] })); return a; };
    let count = { empty: 0, solid: 0, blocks: 0, dots: 0, lines: 0, gradient: 0 };
    for (const P of list) {
      const D = dress(seed, P, p, nInk);
      count[D.t]++;
      const x0 = X(P.x * U), x1 = X((P.x + P.w) * U), y0 = Y(P.y * U), y1 = Y((P.y + P.h) * U);
      if (D.t === 'empty') continue;
      if (D.t === 'solid') { get(fills, D.ink).r.push(x0, y0, x1 - x0, y1 - y0); continue; }
      if (D.t === 'gradient') {
        const c0 = D.ink, c1 = D.ink2 === D.ink ? 0 : D.ink2;
        const g = [[x0, y0, x1, y0], [x0, y0, x0, y1], [x0, y0, x1, y1], [x1, y0, x0, y1]][D.dir];
        grads.push({ rect: [x0, y0, x1 - x0, y1 - y0], g, c0, c1 });
        continue;
      }
      if (D.base) get(fills, D.base).r.push(x0, y0, x1 - x0, y1 - y0);
      if (D.t === 'lines') {
        const S = get(lines, D.ink).s;
        for (let i = 1; i < P.w * U; i++) { const x = X(P.x * U + i); S.push([x, y0, x, y1]); }
        for (let j = 1; j < P.h * U; j++) { const y = Y(P.y * U + j); S.push([x0, y, x1, y]); }
        continue;
      }
      const on = field(NF, D, P, U, fill, t, amount);
      const nx = P.w * U, ny = P.h * U, M = get(marks, D.ink);
      if (D.t === 'blocks') {
        for (let j = 0; j < ny; j++) {
          let i = 0;
          while (i < nx) {
            if (!on[j * nx + i]) { i++; continue; }
            let e = i + 1;
            while (e < nx && on[j * nx + e]) e++;
            const a = X(P.x * U + i), b = X(P.x * U + e), c = Y(P.y * U + j), d = Y(P.y * U + j + 1);
            M.r.push(a, c, b - a, d - c);
            i = e;
          }
        }
      } else {
        for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
          if (on[j * nx + i]) M.c.push((P.x * U + i + 0.5) * uw, (P.y * U + j + 0.5) * uh, rDot);
        }
      }
    }

    const scene = new PL.Scene(W, H, colors[0], 0);
    const role = (ci) => roles(n)[ci] || 'Ink';
    for (const [ci, a] of [...fills].sort((p1, p2) => p1[0] - p2[0])) {
      const Ly = scene.layer('fill-' + ci, colors[ci], 'Fill ' + role(ci), ci);
      Ly.r.push(...a.r);
    }
    grads.forEach((G, k) => {
      const Ly = scene.layer('gradient-' + k, colors[G.c0], 'Gradient ' + (k + 1), G.c0);
      Ly.r.push(...G.rect);
      PL.Scene.gradient(Ly, G.g[0], G.g[1], G.g[2], G.g[3], colors[G.c0], colors[G.c1], G.c0, G.c1);
    });
    for (const [ci, a] of [...marks].sort((p1, p2) => p1[0] - p2[0])) {
      if (!a.r.length && !a.c.length) continue;
      const Ly = scene.layer('marks-' + ci, colors[ci], 'Blocks and dots ' + role(ci), ci);
      Ly.r.push(...a.r);
      Ly.c.push(...a.c);
    }
    // thin lines: centred on a whole pixel when they are about one pixel wide, so they stay sharp
    const lz = lw * zs, half = snap && Math.abs(lz - Math.round(lz)) < 0.05 && Math.round(lz) % 2 === 1 ? 0.5 / zs : 0;
    for (const [ci, a] of [...lines].sort((p1, p2) => p1[0] - p2[0])) {
      const Ly = scene.layer('lines-' + ci, colors[ci], 'Line grid ' + role(ci), ci, K.lineAlpha);
      Ly.cap = 'butt';
      for (const [ax, ay, bx, by] of a.s) PL.Scene.stroke(Ly, ax === bx ? [ax - half, ay, bx - half, by] : [ax, ay - half, bx, by - half], lw);
    }
    const ruleA = clamp01((p.grid == null ? 22 : p.grid) / 100);
    if (ruleA > 0 && n > 1) {
      const Ly = scene.layer('rules', colors[1], 'Rules', 1, ruleA);
      Ly.cap = 'butt';
      if (!R) {
        for (let c = 1; c < cols; c++) { const x = X(c * U) - half; PL.Scene.stroke(Ly, [x, 0, x, H], lw); }
        for (let r = 1; r < rows; r++) { const y = Y(r * U) - half; PL.Scene.stroke(Ly, [0, y, W, y], lw); }
      } else { // every module edge in the region
        for (let c = mx0; c <= mx1; c++) { const x = X(c * U) - half; PL.Scene.stroke(Ly, [x, R.y0, x, R.y1], lw); }
        for (let r = my0; r <= my1; r++) { const y = Y(r * U) - half; PL.Scene.stroke(Ly, [R.x0, y, R.x1, y], lw); }
      }
    }
    scene.status = `${cols} × ${rows} modules · ${list.length} pieces`;
    scene._count = count;
    return scene;
  }

  PL.tools.register({
    id: 'modular',
    name: 'Modular',
    kind: 'Backgrounds',
    tagline: 'Modular grid',
    about: 'A modular grid: modules joined into bigger pieces, each one empty, solid, a pixel field, a dot matrix, a line grid or a gradient, over fine rules. In the animation the pixel fields and the dots flicker as their field drifts, in four soft beats per loop.',
    inks: {
      min: 4, max: 10, roles, fit, spec, add, generate,
      span: () => 2,      // Invert swaps the background and the rules
      rotateFrom: 2,      // Rotate deals the inks only (background and rules stay)
      hint: 'Background, then Rules (the lines between the modules), then the inks: every piece takes one ink, or two.',
    },
    palettes: PALETTES,
    params: PARAMS,
    animLabel: 'Intensity',
    animHint: 'How far the pixel fields and the dots move (0: still)',
    defaults: {
      anim: { amount: 0.5, fps: 6, frames: 24 },
      fx: {},
      palette: 'Bauhaus', // the preset the style opens on (its card's colors)
    },
    build,
    zoom: true, // draws any region of its world (General's Rotation and Size)
    _K: K,
    _pieces: pieces,
    _dress: dress,
    _field: field,
    _grid: grid,
    _beat: beatTime,
  });
})();
/* ==========================================================================
   tools/husk.js — Husk: husk scatter (pixel texture: PNG, video).

   1. Husks: Count lumpy blobs are scattered over the frame. Their centres go
      with the frame (a share of its width and height), their sizes with its
      area, so another frame shape crops or extends the same scatter. Size sets
      the average, Size range how much they vary, Lumpiness how far a smooth
      noise pushes each oval's outline in and out (rounded lobes and fingers).
   2. Bite: every husk is a dark skin over a kernel of the third ink. The depth
      of a point (0 at the husk's edge, 1 at its centre; overlapping husks
      deepen each other) decides how much kernel shows there: Dots prints it
      as a dot screen fixed to the frame, each dot as big as the depth allows;
      Crumble lets it break through in crumbs (a fixed noise, thresholded by
      the depth). Amount: how much of the kernel the skin covers (0: an
      outline). Texture: the dot spacing, or the crumbs' size (a fine stipple
      at 0, big ragged crumbs at 100).
   3. Finish: Grain, a fine grain printed over everything (it stays put).
   General's Size and Rotation show more or less of the same world: past the
   frame the scatter goes on in tiles the size of its own box, every tile
   with husks of its own (never a repeat); the dot screen and the crumbs are
   the world's, and the grain stays one dot per pixel.
   4. Animation: every husk circles its own loop path (the same reach across
      and down, each with its own timing, so the paths range from circles to
      slanted lines) once per loop, through the fixed screen and crumbs: the
      dots swell and shrink and the crumbs open and close as they pass.
      Seamless; Intensity sets how far the husks travel (0 holds them still).
   ========================================================================== */
(() => {
  const { hash } = PL.rng;

  // Ground, husk, then the kernel ink(s). The default look uses Rust (defaults.palette).
  const PALETTES = [
    { name: 'Bubblegum', colors: ['#FC58AC', '#181718', '#DE5EF6'] },
    { name: 'Sky', colors: ['#7AC8F5', '#0B1723', '#F67F2F'] },
    { name: 'Paper', colors: ['#F1ECE2', '#1D1B1A', '#E8452C'] },
    { name: 'Lagoon', colors: ['#20B6C8', '#0D1A22', '#F6E35A'] },
    { name: 'Rust', colors: ['#E8572A', '#1A1110', '#F5C8A3'] },
    { name: 'Mint', colors: ['#8FE3C8', '#11201B', '#FF6B6B'] },
    { name: 'Forest', colors: ['#032617', '#F1EBD5', '#F66D67'] },
    { name: 'Peach', colors: ['#FFB49A', '#2A1416', '#FFF3E6'] },
    { name: 'Violet', colors: ['#8B5CF6', '#140F24', '#C6F432'] },
    { name: 'Mono', colors: ['#EDEDEB', '#151515', '#8C8C8C'] },
  ];

  /* ---- colour roles -------------------------------------------------------------------- */
  const roles = (n) => ['Ground', 'Husk', ...(n === 3 ? ['Kernel'] : Array.from({ length: n - 2 }, (_, i) => 'Kernel ' + (i + 1)))];
  const spec = (n) => ({ ramp: 1, accents: Math.max(1, n - 2) });
  const isLight = (hex) => PL.color.luminance(hex) > 0.35;

  // "New colors": a vivid ground, a near-black husk (now and then the other way round: a deep
  // ground and pale husks), and vivid kernels a step round the colour wheel from the ground.
  function generate(n, rng) {
    const C = PL.color;
    const h0 = rng.float(0, 360);
    const dark = rng.chance(0.15);
    const out = dark
      ? [C.lch(rng.float(0.14, 0.2), rng.float(0.01, 0.03), h0), C.lch(rng.float(0.93, 0.96), rng.float(0.01, 0.03), h0 + 30)]
      : [C.lch(rng.float(0.66, 0.8), rng.float(0.16, 0.24), h0), C.lch(rng.float(0.15, 0.2), rng.float(0.005, 0.02), h0)];
    const dir = rng.sign();
    for (let i = 0; i < n - 2; i++) {
      const hk = h0 + dir * (rng.float(35, 80) + i * rng.float(40, 70));
      out.push(C.lch(rng.float(0.62, 0.74), rng.float(0.17, 0.25), hk));
    }
    return out;
  }

  // + adds a kernel ink in a hue the palette doesn't have yet.
  function add(colors) {
    const C = PL.color;
    const c = colors.slice();
    const hues = c.filter((x) => C.hexToLch(x)[1] > 0.04).map((x) => C.hexToLch(x)[2]);
    let best = 0, bd = -1;
    for (let h = 0; h < 360; h += 10) {
      const d = hues.length ? Math.min(...hues.map((x) => Math.abs((((h - x) % 360) + 540) % 360 - 180))) : 180;
      if (d > bd) { bd = d; best = h; }
    }
    c.push(C.lch(0.68, 0.2, best));
    return c;
  }

  function fit(colors, n) {
    let c = (colors || []).map(PL.color.normHex).filter(Boolean);
    if (!c.length) c = PALETTES[0].colors.slice();
    if (c.length === 1) c.push(PL.color.mix(c[0], isLight(c[0]) ? '#000000' : '#FFFFFF', 0.9));
    if (c.length >= n) return c.slice(0, n);
    while (c.length < n) c = add(c);
    return c;
  }

  /* ---- settings -------------------------------------------------------------------------- */
  const S = (section, key, label, min, max, def, extra = {}) => ({ section, key, label, type: 'range', min, max, def, step: 1, ...extra });
  const PARAMS = [
    S('Husks', 'count', 'Count', 1, 70, 48, { rand: [26, 60], hint: 'How many husks are scattered over the frame' }),
    S('Husks', 'size', 'Size', 0, 100, 34, { unit: '%', rand: [26, 66], hint: 'Their average size' }),
    S('Husks', 'range', 'Size range', 0, 100, 100, { unit: '%', rand: [35, 100], hint: 'How much their sizes vary (0: all the same size)' }),
    S('Husks', 'lump', 'Lumpiness', 0, 100, 39, { unit: '%', rand: [22, 66], hint: 'From smooth ovals to lumpy, fingered shapes' }),
    { section: 'Bite', key: 'kind', label: 'Kind', type: 'select', def: 'dots', options: [{ value: 'dots', label: 'Dots' }, { value: 'crumble', label: 'Crumble' }], hint: 'How the kernel shows through the husk' },
    S('Bite', 'amount', 'Amount', 0, 100, 74, { unit: '%', rand: [30, 86], hint: 'How much of the kernel the husk covers (0: just an outline)' }),
    S('Bite', 'texture', 'Texture', 0, 100, 45, { unit: '%', rand: [24, 76], hint: 'Dots: their spacing. Crumble: from a fine stipple to smooth crumbs' }),
    S('Finish', 'grain', 'Grain', 0, 100, 49, { unit: '%', rand: [24, 62], hint: 'A fine grain printed over everything' }),
  ];

  // Constants. Lengths: a share of sqrt(W x H) (s) for the husks, of min(W, H) (m) for the bite.
  const K = {
    margin: 0.06,              // husk centres scatter this far past the frame's edges (share of its width / height)
    r0: 0.051, r1: 0.091,      // average radius (equal-area) at Size 0 and the rise to Size 100, x s
    spread: 1.0,               // Size range 100 %: radii from 0.5 to 1.5 x the average
    elong: [0.04, 0.18],       // stretch of the oval (a share of the radius), plus ...
    elongL: 0.8,               // ... this much more at Lumpiness 100
    lumpF: 0.85,               // lump noise: lattice cells per husk radius (and twice that for the finer octave)
    lumpGain: 0.5,             // the finer octave's weight
    lumpA: 1.4,                // how hard the noise pushes the outline at Lumpiness 100 ...
    lumpPow: 0.65,             // ... growing like Lumpiness^this
    orbit: 0.0692,             // how far a husk swings across and down on its loop path at Intensity 1, x s (46 px at 1280 x 960 at 0.6)
    pitch: [0.004208, 0.029347, 0.000445], // dot spacing: a + b Texture + c Texture^2, x m (3 px at 713 at Texture 0)
    dotCore: [1.03, -0.8, 0.145], // dot size at the husk's centre: a + b A + c A^2 (share of the cell's half diagonal)
    dotGamma: 0.65,            // dots grow with the depth like depth^this
    crumbCell: 0.010,          // the crumbs' coarsest noise cell, x m, at Texture 0 ...
    crumbCellT: 0.045,         // ... plus this much more at Texture 100 (bigger crumbs) ...
    crumbStop: 0.0028,         // ... halving down to this, x m (2 px at 713)
    crumbGain: [0.66, 0.48],   // their roughness at Texture 0 and 100 (gain from one octave to the next)
    crumbDot: 0.0022,          // the stipple's cell, x m (1.6 px at 713) ...
    crumbFine: [0.9, 0.106],   // ... its share of the noise: a exp(-Texture / b) (all stipple at 0, gone by 50)
    cth: [0.0, 0.93],          // crumble: depth where half the kernel shows, at Amount 0 / rise to 100
    cjit: [0.02, 1.1],         // crumble: depth spread of the crumbs, at Amount 0 / rise to 100
    outline: 0.0025,           // the skin is never thinner than this, x s (a 2 px outline at 950 x 713)
    union: 1,                  // where husks overlap, each deepens the other (1 - (1 - a)(1 - b)); 0: the deeper one
    grain: 9.5,                // grain std in levels at Grain 100 %
    nt: 512,                   // samples in each husk's outline table
  };

  const lerp = (a, b, t) => a + (b - a) * t;
  const pitch = (m, T) => Math.max(1.5, m * (K.pitch[0] + K.pitch[1] * T + K.pitch[2] * T * T)); // the dot spacing in px
  const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);

  /* ---- husks ----------------------------------------------------------------------------- */
  // A husk is an oval whose outline a smooth noise pushes in and out: in every direction its radius
  // is the oval's times (1 - lump x noise), the noise being two octaves of gradient noise read round
  // a circle (so it closes on itself), in the husk's own units: a husk keeps its lumps whatever its
  // size. The depth of a point is 1 - its distance from the centre / the radius that way.
  // Directions are looked up by the "diamond angle" (dy / (|dx| + |dy|), no trig per pixel); the
  // outline table holds the radius at the true angle of each diamond-angle step.
  const NT = K.nt;
  const DIA = new Float64Array(NT + 1);
  for (let k = 0; k <= NT; k++) {
    const a = (4 * k) / NT;
    let x, y;
    if (a < 1) { x = 1 - a; y = a; } else if (a < 2) { x = 1 - a; y = 2 - a; } else if (a < 3) { x = a - 3; y = 2 - a; } else { x = a - 3; y = a - 4; }
    DIA[k] = Math.atan2(y, x);
  }
  const dia = (dx, dy) => (dy >= 0 ? (dx >= 0 ? dy / (dx + dy) : 1 - dx / (dy - dx)) : dx < 0 ? 2 - dy / (-dx - dy) : 3 + dx / (dx - dy));

  function lattice(seed, i, oct, gs) {
    const G = new Float32Array(gs * gs * 2);
    for (let b = 0; b < gs; b++) for (let a = 0; a < gs; a++) {
      const ang = 2 * Math.PI * hash(seed, i, b * 131 + a, 0x6c0 + oct);
      G[(b * gs + a) * 2] = Math.cos(ang); G[(b * gs + a) * 2 + 1] = Math.sin(ang);
    }
    return G;
  }
  function grad(G, gs, ux, uy) {
    const i = ux | 0, j = uy | 0, fx = ux - i, fy = uy - j;
    const k = (j * gs + i) * 2, k2 = k + gs * 2;
    const n00 = G[k] * fx + G[k + 1] * fy, n10 = G[k + 2] * (fx - 1) + G[k + 3] * fy;
    const n01 = G[k2] * fx + G[k2 + 1] * (fy - 1), n11 = G[k2 + 2] * (fx - 1) + G[k2 + 3] * (fy - 1);
    const sx = fx * fx * fx * (fx * (fx * 6 - 15) + 10), sy = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
    const a = n00 + (n10 - n00) * sx;
    return a + (n01 + (n11 - n01) * sx - a) * sy;
  }

  // The husks' shapes (cached: only their places change from frame to frame; one entry per tile of
  // the scatter). Every husk from its own hashes: adding husks (Count) never changes the others.
  const SH = new Map();
  function shapes(seed, p, W, H) {
    const N = Math.max(1, Math.min(70, Math.round(p.count)));
    const key = [seed, N, p.size, p.range, p.lump, W, H].join('|');
    const hit = SH.get(key);
    if (hit) return hit;
    const s = Math.sqrt(W * H);
    const L = clamp01(p.lump / 100), range = clamp01(p.range / 100);
    const R0 = s * (K.r0 + K.r1 * clamp01(p.size / 100));
    const amp = K.lumpA * Math.pow(L, K.lumpPow);
    const list = [];
    for (let i = 0; i < N; i++) {
      const u = (k) => hash(seed, i, k, 0x4b5);
      const R = R0 * Math.max(0.15, 1 + range * K.spread * (u(3) - 0.5));
      const e = lerp(K.elong[0], K.elong[1], u(4)) * (1 + K.elongL * L), te = 2 * Math.PI * u(5);
      const ea = 1 + e, eb = 1 - e;
      const oct = [];
      if (amp) for (let o = 0; o < 2; o++) {
        const f = K.lumpF * (o + 1), gs = Math.ceil(2 * f) + 4;
        oct.push({ f, gs, G: lattice(seed, i, o, gs), ox: f + 1.5 + u(50 + 2 * o), oy: f + 1.5 + u(51 + 2 * o), w: o ? K.lumpGain : 1 });
      }
      const shape = (a) => {
        const c = Math.cos(a - te), sn = Math.sin(a - te), ca = Math.cos(a), sa = Math.sin(a);
        let n = 0;
        for (const q of oct) n += q.w * grad(q.G, q.gs, q.ox + ca * q.f, q.oy + sa * q.f);
        const x = -amp * n; // pushed out where the noise is low, in where it is high (never below 0.4, softly)
        const g = x >= -0.6 ? 1 + x : 0.4 * Math.exp((x + 0.6) / 0.4);
        return ((ea * eb) / Math.sqrt(eb * eb * c * c + ea * ea * sn * sn)) * g;
      };
      // equal area: scale so that the outline encloses pi R^2 whatever its lumps
      let m2 = 0;
      for (let k = 0; k < 256; k++) { const v = shape((2 * Math.PI * k) / 256); m2 += v * v; }
      const sc = R / Math.sqrt(m2 / 256);
      const lut = new Float32Array(NT + 1);
      let rmax = 0;
      for (let k = 0; k <= NT; k++) { const r = sc * shape(DIA[k]); lut[k] = r; if (r > rmax) rmax = r; }
      list.push({ i, R, lut, rmax: rmax * 1.01 + 1, u1: u(1), u2: u(2), ph1: 2 * Math.PI * u(14), ph2: 2 * Math.PI * u(15) });
    }
    if (SH.size >= 160) SH.delete(SH.keys().next().value);
    SH.set(key, list);
    return list;
  }

  // The husks at time t: each circles its own loop path (cos with its own phase in x and in y).
  // R (a part of the world, frame units; General's Size and Rotation): the husks that reach into it.
  // The scatter fills a box (1 + 2 margin) times the frame; past it the plane is cut into tiles of
  // that size, each with a scatter of its own (its own seed; the frame's tile keeps the style's seed): new
  // husks everywhere, at the same density, never a repeat.
  const TILE = 1 + 2 * K.margin;
  const tileSeed = (seed, ti, tj) => (ti || tj ? (Math.imul(seed | 0, 0x2545f491) ^ Math.imul(ti, 0x9e3779b1) ^ Math.imul(tj, 0x85ebca77)) | 0 : seed);
  function setup(seed, p, W, H, t, amount, R) {
    const s = Math.sqrt(W * H);
    const orb = K.orbit * Math.max(0, amount || 0) * s;
    const th = 2 * Math.PI * (((t % 1) + 1) % 1);
    const place = (list, ox, oy) => list.map((h) => {
      const x0 = (-K.margin + TILE * h.u1) * W + ox, y0 = (-K.margin + TILE * h.u2) * H + oy;
      return { i: h.i, R: h.R, lut: h.lut, rmax: h.rmax, x0, y0, cx: x0 + orb * Math.cos(th + h.ph1), cy: y0 + orb * Math.cos(th + h.ph2) };
    });
    if (!R) return place(shapes(seed, p, W, H), 0, 0);
    // no husk reaches further than 2.5 x its radius (3 x, to be safe) or its radius 1.5 x the average
    const R0 = s * (K.r0 + K.r1 * clamp01(p.size / 100));
    const reach = 3 * R0 * (1 + 0.5 * clamp01(p.range / 100) * K.spread) + orb + 2;
    const TW = TILE * W, TH = TILE * H, mW = K.margin * W, mH = K.margin * H;
    const ia = Math.ceil((R.x0 - reach + mW) / TW - 1), ib = Math.floor((R.x1 + reach + mW) / TW);
    const ja = Math.ceil((R.y0 - reach + mH) / TH - 1), jb = Math.floor((R.y1 + reach + mH) / TH);
    const out = [];
    for (let tj = ja; tj <= jb; tj++) for (let ti = ia; ti <= ib; ti++) {
      for (const h of place(shapes(tileSeed(seed, ti, tj), p, W, H), ti * TW, tj * TH)) {
        if (h.cx + h.rmax < R.x0 || h.cx - h.rmax > R.x1 || h.cy + h.rmax < R.y0 || h.cy - h.rmax > R.y1) continue;
        out.push(h);
      }
    }
    return out;
  }

  const radiusAt = (lut, dx, dy) => {
    const f = dia(dx, dy) * (NT / 4), k = f | 0;
    return lut[k] + (lut[k + 1] - lut[k]) * (f - k);
  };

  // Depth of every pixel (0 at a husk's edge, 1 at its centre; -1 outside), which husk it
  // belongs to (the deepest) and its distance in px to that husk's edge along the ray.
  // M (General's Size and Rotation): the canvas is M.cw x M.ch and its pixel (x, y) shows the world
  // at (M.x0 + x M.s, M.y0 + y M.s) (its centre half a pixel on); depths and edges stay in frame units.
  function depthMap(hs, W, H, M) {
    const cw = M ? M.cw : W, ch = M ? M.ch : H, ms = M ? M.s : 1, mx = M ? M.x0 : 0, my = M ? M.y0 : 0;
